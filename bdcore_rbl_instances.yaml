  # Requirements — ILLUSTRATIVE, added to populate the new Requirement concept
  # type. Deliberately mixed: some fulfilled by real existing components
  # ("pull from the repository"), some genuinely unfulfilled (real gaps —
  # "add their own things", nothing exists yet), and one decomposed into a
  # sub-requirement via "contains".
- {id: req1, concept_type: Requirement, name: Single Customer View Across Donor & Member Records, status: In Design, priority: Must Have, acceptance_criteria: 'A supporter''s full history (donations, membership,
    grants, communications) is viewable from one screen without switching systems', rationale: 'Fragmented records across systems mean staff can''t see a supporter''s full relationship with RBL, leading
    to poor donor experience and duplicated outreach', target_date: '2027-03-31', stereotype: Functional}
- {id: req1a, concept_type: Requirement, name: Deduplicate Existing Donor Records Before Go-Live, status: Fulfilled, priority: Must Have, acceptance_criteria: 'Zero duplicate donor records remain in the
    migrated dataset, verified by matching on name, postcode, and email', rationale: Historic exports from the legacy CRM and direct-marketing database contain known duplicates that would corrupt the single
    customer view if migrated as-is, target_date: '2026-11-30', stereotype: Functional}
- {id: req2, concept_type: Requirement, name: Encrypt All Personal Data At Rest And In Transit, status: Approved, priority: Must Have, acceptance_criteria: All systems holding personal data pass an annual
    encryption audit with no exceptions, rationale: GDPR Article 32 requires appropriate technical measures; current on-prem systems have inconsistent encryption coverage, target_date: '2026-12-31', stereotype: Non-Functional}
- {id: req3, concept_type: Requirement, name: Eliminate Single Point of Failure in Core Hosting, status: Proposed, priority: Should Have, acceptance_criteria: No single server or data centre failure can
    take down more than one critical system at a time, rationale: Current on-prem hosting concentrates multiple critical systems on shared infrastructure with no failover, target_date: '2027-06-30', stereotype: Non-Functional}
- {id: req4, concept_type: Requirement, name: Automated Initial Eligibility Screening for Welfare Grants, status: Draft, priority: Should Have, acceptance_criteria: 'Applications clearly ineligible on stated
    criteria (e.g. service history mismatch) are flagged before reaching a caseworker, reducing manual triage time', rationale: Caseworkers currently spend significant time on manual first-pass eligibility
    checks that could be automated for clear-cut cases, target_date: '2027-01-31', stereotype: Functional}
- {id: req5, concept_type: Requirement, name: Single Sign-On Across Core Staff Systems, status: Fulfilled, priority: Must Have, acceptance_criteria: 'Staff authenticate once to access CRM, finance, and
    membership systems without separate logins', rationale: 'Staff currently maintain separate credentials for each core system, increasing password fatigue and IT support burden', target_date: '2026-09-30',
  stereotype: Non-Functional}
- {id: req6, concept_type: Requirement, name: Real-Time Visibility of Poppy Appeal Fundraising Totals, status: Draft, priority: Could Have, acceptance_criteria: 'Regional fundraising totals are visible
    to coordinators within 15 minutes of a donation being processed, not next-day', rationale: 'Regional coordinators currently rely on next-day batch reports, making it hard to react to slow-starting campaigns
    during the appeal period', target_date: '2027-10-31', stereotype: Functional}

