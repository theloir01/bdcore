- {id: i4, concept_type: Initiative, name: '[FICTIONAL] Tiered Membership Pricing Change', status: Shelved, sponsor: Head of Membership, start_date: '2025-11-01', target_date: '2026-01-15', forecast_cost: 35000,
  description: 'Wanted to offer tiered membership pricing; the membership database''s flat record structure couldn''t express tiers without a costly rebuild, so it was shelved.', stereotype: Commercial}
- {id: i5, concept_type: Initiative, name: '[FICTIONAL] Corporate Partner Revenue-Share Integration', status: Shelved, sponsor: Head of Corporate Partnerships, start_date: '2025-06-01', target_date: '2025-09-01',
  forecast_cost: 52000, description: 'A corporate partner wanted automated revenue-share reporting; the finance system''s data model had no concept of a shared transaction, so the deal proceeded on manual
    monthly reconciliation instead.', stereotype: Commercial}
- {id: i6, concept_type: Initiative, name: '[FICTIONAL] AI-Assisted Grant Triage Pilot', status: Shelved, sponsor: Director of Services, start_date: '2026-01-01', target_date: '2026-03-01', forecast_cost: 18000,
  description: 'Wanted to pilot AI-assisted triage of incoming welfare grant applications; nobody could extract clean, structured case data out of the system fast enough, so the pilot never left the lab.',
  stereotype: Compliance}
- {id: i7, concept_type: Initiative, name: '[FICTIONAL] Real-Time Poppy Appeal Campaign Dashboard', status: Shelved, sponsor: Head of Digital Marketing, start_date: '2025-09-01', target_date: '2025-10-01',
  forecast_cost: 12000, description: 'Wanted a real-time fundraising dashboard for the Poppy Appeal; the data platform only refreshes overnight, so it shipped as a nightly manual export the ops team still
    runs by hand.', stereotype: Commercial}
