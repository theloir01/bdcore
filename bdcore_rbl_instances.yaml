- {id: d1, concept_type: Decision, name: Adopt Microsoft Dynamics 365 as core CRM platform, status: Approved, decision_maker: Chief Information Officer, decision_date: '2019-03-01', rationale: 'Legacy CRM
    was over a decade old, built for direct marketing, and not integrated with digital channels', options_considered: Retain and extend the legacy CRM; build a bespoke platform; adopt Salesforce Nonprofit
    Cloud; adopt Microsoft Dynamics 365, chosen_option: Microsoft Dynamics 365 — best fit for existing Microsoft 365/Azure investment and lower integration overhead, consequences: 'Easier: single supporter
    view across channels, native Power Platform automation, reduced integration cost with other Microsoft services. Harder: licensing cost scales with user count; direct-marketing data required significant
    cleansing to migrate.', confidence: High, impact_level: Critical, stereotype: Architecture}
- {id: d2, concept_type: Decision, name: Modernise legacy SQL Server infrastructure via managed service, status: Approved, decision_maker: 'Executive Director: Digital, Data & Technology', decision_date: '2021-06-01',
  rationale: 'Legacy SQL infrastructure was complex, outdated, and relied on a single point of failure', options_considered: Do nothing and accept the risk; in-place hardware refresh; managed cloud service;
    full application re-platform, chosen_option: Managed service on Azure — addressed the single-point-of-failure risk without the cost/risk of a full re-platform, consequences: 'Easier: reduced operational
    burden on internal IT, built-in DR/failover, predictable running cost. Harder: recurring managed-service cost replaces one-off capital spend; less low-level control over tuning.', confidence: Medium,
  impact_level: High, stereotype: Architecture}
- {id: d3, concept_type: Decision, name: Extend to a cloud-native data platform beyond the managed-service intermediary, status: Proposed, decision_maker: 'Executive Director: Digital, Data & Technology',
  decision_date: '2026-01-01', rationale: 'The managed-service approach solved the immediate resilience risk, but reporting and cross-system data needs have grown beyond what a lift-and-shift managed instance
    comfortably supports', options_considered: Stay on the current managed service; move to a cloud-native platform (e.g. Azure SQL / Synapse-style); adopt a separate analytics platform alongside the existing
    service, chosen_option: 'Not yet finalised — proposed, pending review', consequences: 'Easier (anticipated): elastic scaling for reporting workloads, reduced patching overhead. Harder (anticipated):
    migration effort from the current managed instance; team upskilling required.', confidence: Medium, impact_level: High, stereotype: Architecture}
- {id: i1, concept_type: Initiative, name: CRM Modernisation Programme, status: In Progress, sponsor: 'Executive Director: Digital, Data & Technology', priority: Critical, stereotype: Modernisation, start_date: '2025-09-01', target_date: '2026-08-31', budget: 450000, forecast_cost: 420000, progress: 55}
- {id: i2, concept_type: Initiative, name: Enterprise Data Integration Programme, status: In Progress, sponsor: 'Head of Data, Insight and Fundraising CRM', priority: High, stereotype: Modernisation, start_date: '2025-11-01', target_date: '2026-10-31', budget: 180000, forecast_cost: 165000, progress: 35}
