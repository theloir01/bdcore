<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RBL Application Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --ink: #0A0E1A;
    --ink-secondary: #64748B;
    --paper: #F3F4FA;
    --card: #FFFFFF;
    --border: #E4E6F0;
    --accent: #0EA968;
    --accent-bright: #22D3A6;
    --accent2: #7C5CFF;
    --accent2-bright: #9B8CFF;
    --risk: #F0384D;
    --glow-accent: rgba(14,169,104,0.35);
    --glow-accent2: rgba(124,92,255,0.35);
    --shadow-sm: 0 1px 2px rgba(10,14,26,0.05), 0 1px 1px rgba(10,14,26,0.04);
    --shadow-md: 0 4px 14px rgba(10,14,26,0.07), 0 1px 3px rgba(10,14,26,0.06);
    --shadow-lg: 0 20px 48px rgba(10,14,26,0.14), 0 4px 14px rgba(10,14,26,0.08);
    --shadow-glow: 0 8px 28px var(--glow-accent), 0 2px 8px rgba(10,14,26,0.08);
    --font-display: "Sora", "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  html, body { margin: 0; padding: 0; background: var(--paper); font-family: var(--font-body); }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-bright); color: #06251A; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #C7CBDC; border-radius: 10px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: #A7ADC4; }
  button, input, select, textarea { font-family: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 6px;
  }
  h1, h2, h3 { font-family: var(--font-display); }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; }
  tbody tr { border-top: 1px solid var(--border); transition: background 0.12s ease; }
  tbody tr:hover { background: #F4FBF7; }
  input { font-family: inherit; }

  .chat-markdown p { margin: 0 0 8px 0; }
  .chat-markdown p:last-child { margin-bottom: 0; }
  .chat-markdown ul, .chat-markdown ol { margin: 6px 0; padding-left: 20px; }
  .chat-markdown li { margin-bottom: 2px; }
  .chat-markdown code { background: #EEF0F8; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; font-family: ui-monospace, monospace; }
  .chat-markdown pre { background: var(--ink); color: #E8EAED; padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 8px 0; }
  .chat-markdown pre code { background: none; padding: 0; color: inherit; }
  .chat-markdown blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 2px 0 2px 12px; color: #64748B; font-style: italic; font-size: 0.95em; }
  .chat-markdown table { margin: 8px 0; font-size: 0.95em; }
  .chat-markdown th { border-bottom: 1px solid var(--border); font-weight: 600; }
  .chat-markdown h1, .chat-markdown h2, .chat-markdown h3 { margin: 10px 0 6px 0; font-size: 1.05em; }
  .chat-markdown a { color: var(--accent); }
  .chat-markdown hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  @keyframes heroGradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes floatSlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-14px, 16px) scale(1.06); }
  }
  @keyframes floatSlowReverse {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(18px, -12px) scale(1.08); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes viewFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 var(--glow-accent); }
    50% { box-shadow: 0 0 0 8px rgba(14,169,104,0); }
  }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .view-transition { animation: viewFade 0.32s cubic-bezier(0.16, 1, 0.3, 1); }

  .hero-flashy {
    background: linear-gradient(120deg, #060A14, #0E2A20, #0EA968, #0E2A20, #060A14);
    background-size: 400% 400%;
    animation: heroGradientShift 14s ease infinite;
  }
  .hero-flashy::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.12;
    pointer-events: none;
  }
  .hero-orb {
    position: absolute; border-radius: 50%; filter: blur(40px); pointer-events: none;
  }
  .hero-title {
    background: linear-gradient(90deg, #FFFFFF 0%, #E8F5ED 40%, #9EF0CE 55%, #FFFFFF 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #fff;
    animation: heroGradientShift 6s ease infinite;
    font-family: var(--font-display);
  }
  .landing-chat-input:focus { box-shadow: 0 0 0 4px rgba(255,255,255,0.25); }

  .landing-card {
    transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .landing-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: transparent; }

  .ds-card {
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .ds-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg) !important; }

  .ds-icon-chip {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    box-shadow: 0 6px 16px rgba(14,169,104,0.3);
    color: #fff;
  }

  .ds-btn-primary {
    background: linear-gradient(135deg, var(--accent) 0%, #0C8F58 100%);
    color: #fff; border: none; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow: 0 4px 14px rgba(14,169,104,0.32);
  }
  .ds-btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 8px 22px rgba(14,169,104,0.4); }
  .ds-btn-primary:active { transform: translateY(0); }

  .ds-nav-pill { transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  .ds-nav-pill:not(.ds-nav-pill-active):hover { background: var(--paper) !important; color: var(--ink) !important; }

  .skeleton {
    background: linear-gradient(90deg, #EDEFF7 25%, #F7F8FC 37%, #EDEFF7 63%);
    background-size: 800px 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }

  .spin-loader {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Vendored locally under vendor/ instead of loaded from a CDN — unpkg.com in
     particular gets silently blocked by some ad/tracker blockers and corporate
     firewalls, which broke the app for anyone behind one. These ship with the
     repo, so nothing but the Neo4j Query API call itself needs network access. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const COLORS = {
  ink: "#0A0E1A", inkSecondary: "#64748B", paper: "#F3F4FA", card: "#FFFFFF",
  border: "#E4E6F0", accent: "#0EA968", accentMuted: "#6FD3A8",
  accent2: "#7C5CFF", accent2Muted: "#B7A8FF",
  risk: "#F0384D", riskMuted: "#F8A5AF",
  warning: "#F59E0B", info: "#3B82F6",
  gradientAccent: "linear-gradient(135deg, #0EA968 0%, #22D3A6 100%)",
  gradientAI: "linear-gradient(135deg, #7C5CFF 0%, #22D3EE 100%)",
  quadInvest: "#C9F2DE", quadTolerate: "#FCE7B8", quadMigrate: "#FFD9CB", quadEliminate: "#FBC9D4",
};

// Removable "active filter" chip styling, shared by any filter bar that lists
// applied filters as individually-clearable pills (currently Portfolio Overview).
const filterChipStyle = {
  display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 600,
  color: COLORS.ink, background: `${COLORS.ink}0D`, border: `1px solid ${COLORS.border}`,
  padding: "3px 8px", borderRadius: 20,
};
const filterChipCloseStyle = { cursor: "pointer", color: COLORS.inkSecondary, fontSize: 10 };

// White-label config — persisted in localStorage like the Neo4j credentials.
// Only `primary`/`accent` actually re-theme the app (they map onto
// COLORS.ink/COLORS.accent, used pervasively throughout). Chart-specific and
// concept-type colors deliberately stay fixed — those are multi-hued by
// design, for visual distinction between categories, not meant to collapse
// into one brand color.
const DEFAULT_BRAND = { name: "The Royal British Legion", subtitle: "Digital, Data & Technology", logo: null, primary: "#0A0E1A", accent: "#0EA968" };

// Modelling Canvas: the real BDCore concept types (whitelist — anything
// pushed to Neo4j must be one of these, no arbitrary labels) and the
// controlled verb vocabulary, mirrored from chat_server.py's SCHEMA_CONTEXT.
const CANVAS_CONCEPT_TYPES = [
  "AIModel", "Application", "Capability", "Control", "Data", "Decision", "Flow", "FlowStep", "Goal",
  "HardwareTechnology", "Initiative", "Interface", "Journey", "JourneyStage", "Location", "Organisation",
  "Outcome", "Process", "Product", "Requirement", "Risk", "SoftwareTechnology", "Strategy",
  "ValueStream", "ValueStreamStage",
];

// Mirrors the `category` field each concept type carries in bdcore_schema.yaml —
// kept in sync by hand, same as CANVAS_CONCEPT_TYPES itself. A type missing here
// (e.g. added to the whitelist above but not yet given a category) falls back to
// an "Other" bucket in groupConceptTypesByCategory rather than silently vanishing.
const CONCEPT_TYPE_CATEGORY = {
  Strategy: "Strategic", Goal: "Strategic", Decision: "Strategic", Initiative: "Strategic", Outcome: "Strategic",
  Requirement: "Structural", Capability: "Structural", Process: "Structural", Location: "Structural",
  Organisation: "Structural", Product: "Structural", Journey: "Structural", JourneyStage: "Structural",
  ValueStream: "Structural", ValueStreamStage: "Structural", Flow: "Structural", FlowStep: "Structural",
  Application: "Technology", Data: "Technology", SoftwareTechnology: "Technology", HardwareTechnology: "Technology",
  AIModel: "Technology", Interface: "Technology",
  Risk: "GRC", Control: "GRC",
};
// Plain-language definitions for the Help glossary — hand-authored, since
// bdcore_schema.yaml documents each ATTRIBUTE's purpose but never the concept
// type itself. Kept in sync by hand like CONCEPT_TYPE_CATEGORY above; the
// allowed-relationships half of the glossary is NOT hand-authored — it reads
// schemaRelationships live off the connected graph, so it can't drift from
// the real schema the way a second hard-coded copy of the relationship list
// would.
const CONCEPT_DEFINITIONS = {
  Strategy: "A high-level direction the organisation is pursuing — corporate, business-unit, or functional — that goals, initiatives, and capability investment should ultimately trace back to.",
  Goal: "A specific, measurable target in service of a Strategy, with a defined success measure and target value to track progress against.",
  Decision: "A recorded architectural, investment, or governance decision — what was chosen, why, what alternatives were considered, and what it makes easier or harder going forward.",
  Requirement: "A functional or non-functional need something else in the graph must satisfy, with explicit acceptance criteria for knowing when it's actually met.",
  Initiative: "A funded piece of change work — a transformation, migration, retirement, or modernisation programme — with its own budget, forecast cost, and expected benefit.",
  Outcome: "A real-world result a Strategy or Initiative was meant to produce, tracked against a target and an actual value so realised benefit can be measured, not just claimed.",
  Capability: "A business ability the organisation has or needs — what it can DO, independent of who does it or what system supports it — scored across six maturity dimensions (governance, policies, process, people, applications, metrics).",
  Process: "A repeatable sequence of work that realises a Capability — who performs it, how automated it is, how critical it is, and how ready it is for AI.",
  Location: "A physical place in the organisation's geography, country down to floor — mainly used to answer data-residency and jurisdiction questions.",
  Organisation: "A unit of the organisation itself — a business unit, department, team, external partner, or vendor — arranged in a parent/child hierarchy.",
  Product: "Something the organisation offers to a customer segment — internal, external, platform, or service — tracked by revenue, cost to serve, and lifecycle stage.",
  Journey: "An end-to-end experience a customer, employee, or partner goes through, told from their point of view. Its ordered steps are JourneyStages.",
  JourneyStage: "One step in a Journey — what the person needs at that point, what channel they're on, and what pain point exists there today.",
  Flow: "An end-to-end sequence of work told from the asset's point of view rather than a person's — functional (a business process moving through several systems) or technical (data moving server to server) — inventoried so retiring a participant is a lookup, not a round of asking around. Its ordered steps are FlowSteps.",
  FlowStep: "One step in a Flow, naming what carries it — an Application, SoftwareTechnology, or HardwareTechnology — and where it sits in sequence.",
  ValueStream: "The end-to-end sequence that creates value for a stakeholder — core streams create direct value, support streams enable core ones, management streams govern and steer. Its ordered increments are ValueStreamStages.",
  ValueStreamStage: "One increment of value delivered within a ValueStream, in sequence.",
  Application: "A software system the organisation runs — its cost, criticality, technical health, hosting model, and AI readiness all live here. The central entity most of the rest of this tool is built around.",
  Data: "A named data asset — master, reference, transactional, or analytical — with its own classification, sensitivity, quality, and regulatory relevance, independent of which application happens to store it.",
  SoftwareTechnology: "A platform, framework, database, middleware, or runtime an Application runs on — tracked for lifecycle status (Current through Unsupported) so obsolescence risk can be traced to every Application exposed to it.",
  HardwareTechnology: "A physical or virtualised infrastructure component — server, storage, network, end-user device, or IoT — that an Application or SoftwareTechnology runs on.",
  AIModel: "A model the organisation has deployed or is evaluating — foundation, generative, predictive, or otherwise — governed separately from the Applications that use it, with its own risk, explainability, and human-oversight attributes.",
  Interface: "A specific integration between two systems — its protocol, data format, frequency, and auth method — the thing that actually breaks when one side changes.",
  Risk: "Something that could go wrong, scored by likelihood × impact, that a Control exists to mitigate and that can affect any other concept in the graph.",
  Control: "A safeguard — preventive, detective, corrective, or compensating — that constrains a Risk, with its own effectiveness and compliance-requirement tracking.",
};
const CONCEPT_CATEGORY_ORDER = ["Strategic", "Structural", "Technology", "GRC"];
const CONCEPT_CATEGORY_LABEL = { Strategic: "Strategic", Structural: "Structural", Technology: "Technology", GRC: "Governance, Risk & Compliance" };
function groupConceptTypesByCategory(types) {
  const groups = {};
  types.forEach((t) => {
    const cat = CONCEPT_TYPE_CATEGORY[t] || "Other";
    (groups[cat] = groups[cat] || []).push(t);
  });
  return [...CONCEPT_CATEGORY_ORDER, "Other"]
    .filter((cat) => groups[cat])
    .map((cat) => ({ key: cat, label: CONCEPT_CATEGORY_LABEL[cat] || cat, types: groups[cat] }));
}

          "\"Critical Systems With No DR\" expands in place rather than navigating away; click a listed app inside it to open that app's Profile.",

          "The confidence line under each figure is scoped to the exact records behind that number, not the whole graph's ownership stat.",
          "One snapshot is taken automatically the first time you connect each day — \"Record Snapshot Now\" adds an extra point immediately if you want one.",
        ] },

  },
  {

    items: [
      { key: "portfolio", label: "Portfolio Overview",
        description: "The full application inventory — filterable and plottable on a Business Value vs. Technical Health quadrant.",
        tips: [
          "Filter the Inventory by status, criticality, disposition or hosting model, or search by name/vendor — active filters show as removable chips.",
          "The Inventory itself leads the page, right under the filters — toggle it between a card grid and a sortable table with the two icons above it.",
          "Click the small score circle on any card or row to pop out that application's blast radius — capabilities going dark or degraded, technologies and peer apps impacted, recovery considerations — without leaving Portfolio Overview.",

        <line x1={cx} y1={h * 0.68} x2={cx} y2={h * 0.9} stroke={stroke} strokeWidth={2} />

    default: return null;
  }
}

const fmtGBP = (n) => n == null ? "—" : `£${Number(n).toLocaleString("en-GB", { maximumFractionDigits: 0 })}`;
const fmtWhen = (iso) => {
  if (!iso) return "—";
  const then = new Date(iso), diffMs = Date.now() - then.getTime(), mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  if (days < 7) return `${days}d ago`;
  return then.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: then.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
};

// Whole calendar days between now and a future ISO date — negative once
// that date is in the past (used to bucket the Renewals & Reviews board).
const daysUntil = (iso) => {
  if (!iso) return null;
  const ms = new Date(iso).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0);
  return Math.round(ms / 86400000);
};

// Whole months since a past ISO date — used for "not reviewed in N months"
// rather than fmtWhen's day/hour granularity, which reads as too precise
// for a data-governance staleness signal.
const monthsSince = (iso) => {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / (1000 * 60 * 60 * 24 * 30.44)));
};

// First-of-month for start through first-of-month for end, inclusive — the
// tick marks along the Initiatives Roadmap's time axis.
function monthsBetween(start, end) {
  const months = [];
  let d = new Date(start.getFullYear(), start.getMonth(), 1);
  const endD = new Date(end.getFullYear(), end.getMonth(), 1);
  while (d <= endD) {
    months.push(new Date(d));
    d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  }
  return months;
}

// A minimal SVG path for a sparkline — one line per Value Delivered metric
// card, each with its own unit (£, count, %), so a shared multi-axis chart
// would just confuse scale; small independent sparklines don't need one.
function sparklinePoints(values, w, h, pad) {
  if (values.length < 2) return [];
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const stepX = (w - pad * 2) / (values.length - 1);
  return values.map((v, i) => ({
    x: pad + i * stepX,
    y: pad + (h - pad * 2) * (1 - (v - min) / span),
  }));
}
function sparklinePath(values, w, h, pad) {
  return sparklinePoints(values, w, h, pad)
    .map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`)
    .join(" ");
}

// Generic sortable/filterable table — every <table> in the app used to be
// hand-rolled with no sort or filter affordance at all. One reusable
// component instead of duplicating sort/filter logic per view; each mounted
// instance owns its own sort/filter state, so multiple tables on one view
// (e.g. one per redundancy group) don't interfere with each other.
function SortableTable({ columns, rows, rowKey, onRowClick, getRowStyle, filterable, filterPlaceholder,
  emptyMessage, renderRowExtra, defaultSort }) {
  const [sortKey, setSortKey] = useState(defaultSort ? defaultSort.key : null);
  const [sortDir, setSortDir] = useState(defaultSort ? defaultSort.dir || "asc" : "asc");
  const [filterText, setFilterText] = useState("");
  const [colFilters, setColFilters] = useState({});
  const chipColumns = columns.filter((c) => c.chip);
  const showFilter = chipColumns.length === 0 && (filterable !== undefined ? filterable : rows.length > 6);
  const chipValue = (c, r) => (c.filterValue ? c.filterValue(r) : (c.sortValue ? c.sortValue(r) : r[c.key]));

  const chipOptions = useMemo(() => {
    const opts = {};
    chipColumns.forEach((c) => {
      const seen = new Set();
      const list = [];
      rows.forEach((r) => {
        const v = chipValue(c, r);
        if (v != null && v !== "" && !seen.has(v)) { seen.add(v); list.push(v); }
      });
      opts[c.key] = list;
    });
    return opts;
  }, [rows, chipColumns.map((c) => c.key).join(",")]);

  const hasActiveFilters = Object.values(colFilters).some(Boolean) || filterText.trim().length > 0;
  const clearAllFilters = () => { setColFilters({}); setFilterText(""); };

  const filtered = rows.filter((r) => {
    for (const c of chipColumns) {
      const v = colFilters[c.key];
      if (v && chipValue(c, r) !== v) return false;
    }
    if (showFilter && filterText.trim()) {
      const needle = filterText.trim().toLowerCase();
      return columns.some((c) => {
        const v = chipValue(c, r);
        return v != null && String(v).toLowerCase().includes(needle);
      });
    }
    return true;
  });

  const sorted = sortKey ? [...filtered].sort((a, b) => {
      const col = columns.find((c) => c.key === sortKey);
      const av = col && col.sortValue ? col.sortValue(a) : a[sortKey];
      const bv = col && col.sortValue ? col.sortValue(b) : b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      const cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv));
      return sortDir === "asc" ? cmp : -cmp;
    }) : filtered;

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  return (
    <div>
      {(chipColumns.length > 0 || showFilter) && (
        <div style={{ padding: "12px 14px 4px", display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8 }}>
          {chipColumns.length > 0 && (
            <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSecondary, marginRight: 2 }}>Filter by</span>
          )}
          {chipColumns.map((c) => (
            <select key={c.key} value={colFilters[c.key] || ""}
              onChange={(e) => setColFilters((prev) => ({ ...prev, [c.key]: e.target.value }))}
              style={{ padding: "6px 10px", border: `1px solid ${colFilters[c.key] ? COLORS.ink : COLORS.border}`,
                borderRadius: 6, fontSize: 12.5, background: COLORS.card, color: COLORS.ink, cursor: "pointer", outline: "none" }}>
              <option value="">Any {c.label}</option>
              {(chipOptions[c.key] || []).map((v) => <option key={v} value={v}>{v}</option>)}
            </select>
          ))}
          {showFilter && (
            <input value={filterText} onChange={(e) => setFilterText(e.target.value)}
              placeholder={filterPlaceholder || "Filter…"}
              style={{ padding: "6px 10px", border: `1px solid ${COLORS.border}`,
                borderRadius: 6, fontSize: 12.5, outline: "none", flex: "1 1 180px", maxWidth: 220 }} />
          )}
          {hasActiveFilters && (
            <span onClick={clearAllFilters} style={{ fontSize: 12, color: COLORS.inkSecondary, cursor: "pointer",
              textDecoration: "underline", whiteSpace: "nowrap" }}>Clear filters</span>
          )}
        </div>
      )}
      <table>
        <thead>
          <tr>
            {columns.map((c) => (
              <th key={c.key} onClick={c.sortable === false ? undefined : () => toggleSort(c.key)}
                style={{ textAlign: c.align || "left", cursor: c.sortable === false ? "default" : "pointer", userSelect: "none" }}>
                {c.label}{sortKey === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.length === 0 ? (
            <tr><td colSpan={columns.length} style={{ padding: "16px 14px", color: COLORS.inkSecondary, fontSize: 12.5 }}>
              {emptyMessage || "No matching rows."}
            </td></tr>
          ) : sorted.map((row) => (
            <React.Fragment key={rowKey(row)}>
              <tr onClick={onRowClick ? () => onRowClick(row) : undefined}
                style={{ cursor: onRowClick ? "pointer" : "default", ...(getRowStyle ? getRowStyle(row) : {}) }}>
                {columns.map((c) => (
                  <td key={c.key} style={{ textAlign: c.align || "left" }}>
                    {c.render ? c.render(row) : (row[c.key] != null && row[c.key] !== "" ? row[c.key] : "—")}
                  </td>
                ))}
              </tr>
              {renderRowExtra && renderRowExtra(row)}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function deriveQueryApiUrl(uri, dbName) {
  const host = uri.trim().replace(/^neo4j\+s:\/\//, "").replace(/^neo4j:\/\//, "")
    .replace(/^bolt\+s:\/\//, "").replace(/^bolt:\/\//, "").replace(/\/$/, "");
  return `https://${host}/db/${(dbName || "neo4j").trim()}/query/v2`;
}

async function runCypher(apiUrl, authHeader, statement, parameters = {}) {
  const res = await fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json", Authorization: authHeader },
    body: JSON.stringify({ statement, parameters }),
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Query API returned ${res.status}: ${text || res.statusText}`);
  }
  const json = await res.json();
  const fields = json.data.fields;
  const values = json.data.values;
  return values.map((row) => Object.fromEntries(fields.map((f, i) => [f, row[i]])));
}

function computeDisposition(app) {
  if (app.status === "Retiring") return { code: "Retire", reason: "Already flagged for retirement" };
  if (!app.businessValue || !app.techHealth) return { code: "Refactor", reason: "Insufficient data to classify" };
  const onPrem = app.hosting === "On-Prem";
  if (app.businessValue <= 1) return { code: "Retire", reason: "Low business value" };
  if (app.businessValue >= 2 && app.techHealth <= 2) {
    return onPrem
      ? { code: "Replatform", reason: "Valuable but ageing, on legacy infrastructure" }
      : { code: "Replace", reason: "Valuable but poor technical health, already off-prem" };
  }
  if (app.businessValue >= 2 && app.techHealth >= 3) {
    return onPrem
      ? { code: "Rehost", reason: "Healthy and valuable, just needs to leave legacy infrastructure" }
      : { code: "Retain", reason: "Healthy, valuable, and already modern" };
  }
  return { code: "Refactor", reason: "Doesn't fit a clean pattern" };
}

// AI-TIME: crosses category-driven "AI disruption exposure" against how
// entrenched the current system is (business value + technical health,
// reusing the same fields TIME already uses). This is my own reasoned
// heuristic, not a published industry standard the way 6R is — shown openly
// so the reasoning can be argued with, not treated as an authoritative score.
const CATEGORY_AI_EXPOSURE = {
  "Analytics": 3, "Campaign Management": 3, "Membership Management": 3,
  "CRM": 2, "Website/CMS": 2, "HR & Benefits": 2,
  "Case Management": 1.5, "E-commerce": 1.5,
  "Data Integration": 1, "Payment Processing": 1, "Finance & ERP": 1,
};
function aiExposure(category) {
  return CATEGORY_AI_EXPOSURE[category] ?? 1.5;
}
function computeAITime(app) {
  const exposure = aiExposure(app.category);
  const entrenchment = ((app.businessValue || 1.5) + (app.techHealth || 2)) / 2;
  return { exposure, entrenchment };
}
const AI_TIME_INFO = {
  "Prime Disruption Target": { color: "#F0384D", desc: "High AI exposure, and this specific system isn't valuable or healthy enough to defend." },
  "Watch Closely": { color: "#D97706", desc: "High AI exposure, but currently a strong, valuable system — monitor for AI-native competitors." },
  "Modernise Conventionally": { color: "#6C7A99", desc: "Weak system, but for ordinary technical-debt reasons — not an AI-specific story." },
  "Safe for Now": { color: "#0EA968", desc: "Low category exposure and a solid system — no near-term AI disruption case." },
};
function aiTimeQuadrant({ exposure, entrenchment }) {
  const highExp = exposure >= 2.5, highEntrench = entrenchment >= 2.25;
  if (highExp && !highEntrench) return "Prime Disruption Target";
  if (highExp && highEntrench) return "Watch Closely";
  if (!highExp && !highEntrench) return "Modernise Conventionally";
  return "Safe for Now";
}
// a process's AI readiness comes from the quality of the DATA belonging to the
// same CAPABILITY the process realises, found by traversing two real edges
// (Process -REALISES-> Capability <-BELONGS_TO- Data), not a hardcoded lookup.
// Refined blast radius: distinguishes a capability going fully DARK (no other
// app covers it) from DEGRADED (another app still supports it), computes a
// composite severity score, and generates plain-language recovery notes —
// all derived from data already in the graph, not a separate scoring model.
const CRIT_WEIGHT_BR = { Critical: 3, High: 2, Medium: 1, Low: 0.5 };
function computeDRReadiness(app, controls, depLinks) {
  const drControls = controls.filter((c) => /disaster recovery|backup/i.test(c.control || ""));
  const protectedIds = new Set(drControls.map((c) => c.targetId));
  if (protectedIds.has(app.id)) {
    return { covered: true, via: "direct", control: drControls.find((c) => c.targetId === app.id).control };
  }
  const runsOnIds = depLinks.filter((l) => l.sourceId === app.id && l.relType === "RUNS_ON").map((l) => l.targetId);
  for (const tid of runsOnIds) {
    if (protectedIds.has(tid)) {
      return { covered: true, via: "infrastructure", control: drControls.find((c) => c.targetId === tid).control };
    }
  }
  return { covered: false };
}

function computeBlastRadius(app, allApps, depLinks, depNodes, processes, orgsByProcess, controls, flowRows) {
  // Which end-to-end Flows (functional or technical) would lose a step if
  // this application went away — the direct "what must be reinstated"
  // answer a Flow/FlowStep inventory exists to give, grouped so a flow with
  // several of this app's steps still only shows once.
  const flowsById = {};
  (flowRows || []).filter((r) => r.carrierId === app.id).forEach((r) => {
    if (!flowsById[r.flowId]) flowsById[r.flowId] = { id: r.flowId, name: r.flowName, stereotype: r.flowStereotype, criticality: r.flowCriticality, steps: [] };
    flowsById[r.flowId].steps.push({ id: r.stepId, name: r.stepName, sequence: r.stepSequence });
  });
  const affectedFlows = Object.values(flowsById);

  const darkCapabilities = [];
  const degradedCapabilities = [];
  (app.capabilities || []).forEach((cap) => {
    const others = allApps.filter((a) => a.id !== app.id && (a.capabilities || []).includes(cap));
    if (others.length === 0) darkCapabilities.push(cap);
    else degradedCapabilities.push({ cap, coveredBy: others.map((o) => o.name) });
  });
  const downstreamIds = computeReachable(app.id, depLinks, "downstream");
  const downstreamApps = [...downstreamIds]
    .map((id) => depNodes.find((n) => n.id === id))
    .filter((n) => n && n.type === "Application")
    .map((n) => allApps.find((a) => a.id === n.id) || n);
  // Technology directly linked to this app — one hop only, not the full
  // transitive downstream set, since what matters for a cutover isn't "what's
  // reachable" but "what's this app actually plugged into" (credentials,
  // connection strings, queues) that need draining either way.
  const directNeighborIds = new Set();
  depLinks.forEach((l) => {
    if (!DEPENDENCY_TYPES.has(l.relType)) return;
    if (l.sourceId === app.id) directNeighborIds.add(l.targetId);
    if (l.targetId === app.id) directNeighborIds.add(l.sourceId);
  });
  const impactedTechnologies = [...directNeighborIds]
    .map((id) => depNodes.find((n) => n.id === id))
    .filter((n) => n && (n.type === "SoftwareTechnology" || n.type === "HardwareTechnology"));
  const usersAffected = (app.userCount || 0) + downstreamApps.reduce((s, a) => s + (a.userCount || 0), 0);
  const orgUnits = [...new Set(
    processes.filter((p) => app.capabilities.includes(p.capabilityName))
      .flatMap((p) => orgsByProcess[p.id] || [])
  )];
  const drReadiness = computeDRReadiness(app, controls, depLinks);
  const criticalFlowCount = affectedFlows.filter((f) => f.criticality === "Critical").length;
  const score = Math.min(100, Math.round(
    darkCapabilities.length * 25 + degradedCapabilities.length * 8 +
    downstreamApps.length * 10 + (CRIT_WEIGHT_BR[app.criticality] || 1) * 5 +
    affectedFlows.length * 6 + criticalFlowCount * 8 + impactedTechnologies.length * 4 +
    (drReadiness.covered ? 0 : 10)
  ));
  const severity = score >= 70 ? "Severe" : score >= 35 ? "Moderate" : "Limited";
  const recovery = [];
  if (degradedCapabilities.length > 0) {
    recovery.push(`${degradedCapabilities.length} capabilit${degradedCapabilities.length === 1 ? "y is" : "ies are"} also linked to other applications — confirm whether ${degradedCapabilities.length === 1 ? "it" : "any"} can take over.`);
  }
  if (darkCapabilities.length > 0) {
    recovery.push(`${darkCapabilities.length} capabilit${darkCapabilities.length === 1 ? "y" : "ies"} would go fully dark — nothing else currently covers ${darkCapabilities.length === 1 ? "it" : "them"}.`);
  }
  if (app.userCount) recovery.push(`Direct user reach is ${app.userCount} — consider a staged maintenance window.`);
  if (downstreamApps.length > 0) recovery.push(`${downstreamApps.length} other application${downstreamApps.length === 1 ? "" : "s"} technically depend on this — sequence any change carefully.`);
  if (impactedTechnologies.length > 0) {
    recovery.push(`${impactedTechnologies.length} technolog${impactedTechnologies.length === 1 ? "y is" : "ies are"} linked to this app — confirm credentials, connection strings, and queue draining for each.`);
  }
  if (affectedFlows.length > 0) {
    recovery.push(`${affectedFlows.length} end-to-end flow${affectedFlows.length === 1 ? "" : "s"} run${affectedFlows.length === 1 ? "s" : ""} a step through this application — reinstate ${affectedFlows.length === 1 ? "it" : "each"} on the replacement before cutover, not after.`);
  }
  if (!drReadiness.covered) recovery.push("No disaster recovery or backup control found covering this system or its infrastructure — a real readiness gap, not just a technical one.");
  if (recovery.length === 0) recovery.push("No significant dependencies found — this looks like a self-contained change.");
  return { darkCapabilities, degradedCapabilities, downstreamApps, impactedTechnologies, usersAffected, score, severity, recovery, orgUnits, drReadiness, affectedFlows };
}

// Evenly spaces `count` points around a circle of the given radius, starting
// at 12 o'clock — used to lay dependency items out on the Blast Radius
// modal's radial diagram without any of them landing exactly on top of another.
function ringPositions(count, radius, cx, cy) {
  if (count === 0) return [];
  return Array.from({ length: count }, (_, i) => {
    const angle = (-90 + (360 / count) * i) * (Math.PI / 180);
    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  });
}

// A pop-out, single-application view of computeBlastRadius — reachable from
// a card/row anywhere applications are listed (Portfolio Overview today)
// without navigating away, mirroring the same data already shown inline on
// the application's own Profile page.
// Replaces window.confirm/window.prompt for anything that needs a person's
// yes/no or a short piece of text — dialog is driven by askConfirm's or
// askPrompt's { message, ... } state. A plain confirm resolves true/false;
// dialog.input turns on a text field and resolves the typed string (or null
// if cancelled) — same true/false vs. string-or-null contract window.confirm
// and window.prompt themselves had, so call sites barely changed.
function ConfirmDialog({ dialog, onResolve }) {
  const [inputValue, setInputValue] = useState("");
  useEffect(() => {
    if (dialog && dialog.input) setInputValue(dialog.defaultValue || "");
  }, [dialog]);

  const cancelValue = dialog && dialog.input ? null : false;
  const confirmValue = dialog && dialog.input ? inputValue : true;

  useEffect(() => {
    if (!dialog) return;
    const onKey = (e) => {
      if (e.key === "Escape") onResolve(cancelValue);
      else if (e.key === "Enter" && dialog.input) onResolve(inputValue);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [dialog, inputValue]);

  if (!dialog) return null;
  const tone = dialog.danger ? COLORS.risk : COLORS.info;
  return (
    <div onClick={() => onResolve(cancelValue)} style={{ position: "fixed", inset: 0, background: "rgba(20,31,48,0.55)", zIndex: 400,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 16, width: "min(420px, 100%)",
        padding: 24, boxShadow: "0 24px 60px rgba(10,14,26,0.38)" }}>
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
          <div style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, background: `${tone}18`, color: tone,
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 700 }}>
            {dialog.danger ? "▲" : "i"}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            {dialog.title && <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink, marginBottom: 6 }}>{dialog.title}</div>}
            <div style={{ fontSize: 13, color: COLORS.inkSecondary, lineHeight: 1.55 }}>{dialog.message}</div>
            {dialog.input && (
              <input autoFocus value={inputValue} onChange={(e) => setInputValue(e.target.value)}
                onFocus={(e) => e.target.select()}
                onKeyDown={(e) => { if (e.key === "Enter") onResolve(inputValue); }}
                style={{ width: "100%", boxSizing: "border-box", marginTop: 12, padding: "8px 10px",
                  border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 13, outline: "none" }} />
            )}
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 22 }}>
          <button onClick={() => onResolve(cancelValue)}
            style={{ padding: "8px 16px", background: "transparent", color: COLORS.ink, border: `1px solid ${COLORS.border}`,
              borderRadius: 8, fontSize: 12.5, cursor: "pointer" }}>
            {dialog.cancelLabel || "Cancel"}
          </button>
          <button onClick={() => onResolve(confirmValue)} autoFocus={!dialog.input}
            style={{ padding: "8px 16px", background: dialog.danger ? COLORS.risk : COLORS.ink, color: "#fff", border: "none",
              borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
            {dialog.confirmLabel || (dialog.input ? "Save" : (dialog.danger ? "Delete" : "Continue"))}
          </button>
        </div>
      </div>
    </div>
  );
}

const RADAR_RING_ORDER = ["Preferred", "Accepted", "Contained", "Retire"];
const RADAR_RING_LABELS = { Preferred: "Adopt", Accepted: "Trial", Contained: "Hold", Retire: "Sunset" };
const RADAR_RING_COLORS = { Preferred: "#0EA968", Accepted: "#4A7A8C", Contained: "#D97706", Retire: "#F0384D" };
const RADAR_BAND_RADII = { Preferred: 65, Accepted: 115, Contained: 165, Retire: 210 };

const LIFECYCLE_STAGES = [
  { key: "plannedDate", label: "Planned" }, { key: "activeDate", label: "Active" },
  { key: "sunsetDate", label: "Sunset" }, { key: "retiringDate", label: "Retiring" },
  { key: "decommissionDate", label: "Decommission" },
];
function currentLifecycleStage(app) {
  for (let i = LIFECYCLE_STAGES.length - 1; i >= 0; i--) {
    if (app[LIFECYCLE_STAGES[i].key]) return i;
  }
  return -1;
}
// a process's AI readiness comes from the quality of the DATA belonging to the
// same CAPABILITY the process realises, found by traversing two real edges
// (Process -REALISES-> Capability <-BELONGS_TO- Data), not a hardcoded lookup.
// AI Pathfinder: the company's own 2x2 framework, not something the app infers.
// AIReadiness (feasibility) and AIRelevance (payoff) are stored, editable per-
// application judgements — "High" on either axis is what counts as "high" for
// quadrant placement; Low/Medium both read as "low" so the four quadrants stay
// meaningfully differentiated instead of nearly everything landing top-right.
const ACTION_SEVERITY_INFO = {
  critical: { color: COLORS.risk, label: "Critical" },
  high: { color: COLORS.warning, label: "High" },
  medium: { color: COLORS.info, label: "Medium" },
};

const AI_PATHFINDER_INFO = {
  Accelerate: { color: "#0EA968", desc: "High readiness, high relevance — move now." },
  Selective: { color: "#7C5CFF", desc: "High readiness, lower relevance — pursue selectively, case by case." },
  Prepare: { color: "#D97706", desc: "Lower readiness, high relevance — the value is there; build the foundations first." },
  Deprioritize: { color: "#7A6A73", desc: "Lower readiness, lower relevance — not worth attention right now." },
};
function aiPathfinderQuadrant(app) {
  if (!app.aiReadiness || !app.aiRelevance) return null;
  const highReadiness = app.aiReadiness === "High", highRelevance = app.aiRelevance === "High";
  if (highReadiness && highRelevance) return "Accelerate";
  if (highReadiness && !highRelevance) return "Selective";
  if (!highReadiness && highRelevance) return "Prepare";
  return "Deprioritize";
}

// simple force-directed layout, no external library — fine for small graphs
function layoutGraph(nodes, links, width, height) {
  const pos = {};
  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * 2 * Math.PI;
    pos[n.id] = { x: width / 2 + Math.cos(angle) * 150, y: height / 2 + Math.sin(angle) * 150, vx: 0, vy: 0 };
  });
  for (let iter = 0; iter < 300; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = pos[nodes[i].id], b = pos[nodes[j].id];
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
        const force = 1800 / (dist * dist);
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      }
    }
    links.forEach((l) => {
      const a = pos[l.sourceId], b = pos[l.targetId];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
      const force = (dist - 130) * 0.02;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });
    nodes.forEach((n) => {
      const p = pos[n.id];
      p.vx += (width / 2 - p.x) * 0.001;
      p.vy += (height / 2 - p.y) * 0.001;
      p.vx *= 0.85; p.vy *= 0.85;
      p.x += p.vx; p.y += p.vy;
      p.x = Math.max(40, Math.min(width - 40, p.x));
      p.y = Math.max(40, Math.min(height - 40, p.y));
    });
  }
  return pos;
}

function computeReachable(nodeId, links, direction) {
  // direction 'downstream' = things affected if nodeId fails (source depends on nodeId)
  // direction 'upstream' = things nodeId depends on
  const found = new Set();
  let frontier = [nodeId];
  while (frontier.length) {
    const next = [];
    frontier.forEach((cur) => {
      links.forEach((l) => {
        if (!DEPENDENCY_TYPES.has(l.relType)) return;
        if (direction === "downstream" && l.targetId === cur && !found.has(l.sourceId) && l.sourceId !== nodeId) {
          found.add(l.sourceId); next.push(l.sourceId);
        }
        if (direction === "upstream" && l.sourceId === cur && !found.has(l.targetId) && l.targetId !== nodeId) {
          found.add(l.targetId); next.push(l.targetId);
        }
      });
    });
    frontier = next;
  }
  return found;
}
