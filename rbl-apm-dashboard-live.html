                </div>

                {showRationalization && (() => {
                  const blocking = blockedDecisions.filter((d) => d.appId === app.id);
                  const gaps = [];
                  if (!app.owner) gaps.push("No owner defined");
                  if (!app.vendor || app.vendor === "Undisclosed") gaps.push("Vendor unconfirmed");
                  let verdict, verdictColor;
                  if (dispo.code === "Retire") { verdict = "Clear removal candidate"; verdictColor = COLORS.accent; }
                  else if (dispo.code === "Replace" && blocking.length === 0) { verdict = "Replace, but not urgently blocking anything"; verdictColor = "#D97706"; }
                  else if (blocking.length > 0) { verdict = "Keep, or replace deliberately — it's actively blocking real decisions"; verdictColor = COLORS.risk; }
                  else { verdict = "No strong case either way from this data"; verdictColor = COLORS.inkSecondary; }
                  return (
                    <div style={{ background: "#EFEDE5", border: `1px solid ${COLORS.border}`, borderRadius: 18, padding: 20, marginBottom: 20 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>Rationalization Readiness</div>
                      <div style={{ fontSize: 15, fontWeight: 600, color: verdictColor, marginBottom: 14 }}>{verdict}</div>

                          <b>Blocking Real Decisions?</b>
                          <div style={{ color: COLORS.inkSecondary, marginTop: 3 }}>

                      <div style={{ marginBottom: 10, fontSize: 12.5 }}>

                    <div key={i} className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`,
                      boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)", borderRadius: 18, padding: "14px 16px" }}>
                      <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 4 }}>{k.label}</div>
                      <div style={{ fontSize: 17, fontWeight: 600 }}>{k.value}</div>
                    </div>
                  ))}
                </div>

                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",
                  borderRadius: 18, padding: 20, marginBottom: 20 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 16 }}>

              ["marketDifferentiation", "Market Differentiation", "Capability", "Importance",

            ];
            const [key, label, onType, against, explanation] = FIELD_OPTIONS.find(([k]) => k === fieldReviewKey);
            const r = fieldReviews[fieldReviewKey];
            const maxCount = Math.max(1, ...Object.values(r.dist));
            return (
              <div>
                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",
                  borderRadius: 16, padding: 22, marginBottom: 22, maxWidth: 820 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 6 }}>What is this page?</div>
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary, lineHeight: 1.6 }}>
                    Every field on your applications and capabilities was typed in by a person — and people
                    occasionally mistag things, or a support commitment quietly falls out of date. This page checks
                    each field against another one it should logically agree with. For example: a system marked
                    "Critical" should almost always have "Platinum" support — if it's tagged "Bronze" instead,
                    that's either a data mistake, or a real gap nobody would choose on purpose. Being flagged here
                    doesn't mean something's wrong — it means it's worth a two-minute look.
                  </div>
                </div>

                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>

                        border: `1px solid ${fieldReviewKey === k ? COLORS.ink : COLORS.border}`,
                        background: fieldReviewKey === k ? COLORS.ink : COLORS.card,

                    </button>

                </div>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 20 }}>
                  <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",

                        </div>
                        <div style={{ width: 24, textAlign: "right", fontSize: 12.5 }}>{count}</div>

                  <div style={{ fontSize: 30, fontWeight: 700 }}>{rankedBlockedDecisions.length}</div>
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginTop: 4 }}>Decisions Blocked</div>
                </div>
                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)", borderRadius: 16, padding: 22 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 12, background: "#FBE0D8", color: COLORS.risk,

                </div>

                {!journey ? (
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary }}>No journeys found.</div>
                ) : (
                  <div>
                    {journey.stages.map((stage, i) => {
                      const noCapability = stage.capabilities.length === 0 && stage.processes.length === 0;
                      const noApp = stage.capabilities.length > 0 && stage.applications.length === 0;
                      return (
                        <div key={stage.id} style={{ display: "flex", gap: 16 }}>
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                            <div style={{ width: 30, height: 30, borderRadius: "50%", background: CONCEPT_TYPE_STYLE.JourneyStage.color,
                              color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12.5, fontWeight: 700 }}>
                              {i + 1}
                            </div>
                            {i < journey.stages.length - 1 && <div style={{ width: 2, flex: 1, background: COLORS.border, minHeight: 30 }} />}
                          </div>
                          <div style={{ flex: 1, paddingBottom: 24 }}>
                            <div style={{ fontSize: 14.5, fontWeight: 600, marginBottom: 2 }}>{stage.name}</div>
                            <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 10 }}>{stage.type}</div>
                            <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 14 }}>
                              {noCapability ? (
                                <div style={{ fontSize: 12.5, color: COLORS.risk, fontWeight: 600 }}>⚠ No capability or process linked to this stage</div>
                              ) : (
                                <>
                                  {stage.capabilities.length > 0 && (
                                    <div style={{ marginBottom: 8 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Capability.color, textTransform: "uppercase" }}>Capabilities: </span>
                                      {stage.capabilities.map((c) => (
                                        <span key={c} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{c}</span>
                                      ))}
                                    </div>
                                  )}
                                  {stage.processes.length > 0 && (
                                    <div style={{ marginBottom: 8 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Process.color, textTransform: "uppercase" }}>Processes: </span>
                                      {stage.processes.map((p) => (
                                        <span key={p} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{p}</span>
                                      ))}
                                    </div>
                                  )}
                                  {noApp ? (
                                    <div style={{ fontSize: 12, color: "#D97706", fontWeight: 600 }}>⚠ Capability linked, but no application supports it</div>
                                  ) : stage.applications.length > 0 && (
                                    <div style={{ marginBottom: stage.technologies.length > 0 ? 8 : 0 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Application.color, textTransform: "uppercase" }}>Applications: </span>
                                      {stage.applications.map((a) => {
                                        const full = apps.find((x) => x.name === a);
                                        return (
                                          <span key={a} onClick={() => full && (setProfileAppId(full.id), setView("profile"))}
                                            style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6,
                                              cursor: full ? "pointer" : "default", textDecoration: full ? "underline" : "none" }}>{a}</span>
                                        );
                                      })}
                                    </div>
                                  )}
                                  {stage.technologies.length > 0 && (
                                    <div>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: "#5B6E4F", textTransform: "uppercase" }}>Technology: </span>
                                      {stage.technologies.map((t) => (
                                        <span key={t} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{t}</span>
                                      ))}
                                    </div>
                                  )}
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })()}

          {view === "shortlist" && (
            <div>
              <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginBottom: 20, maxWidth: 700, lineHeight: 1.6 }}>
                One verdict per system, synthesised from 6R disposition, AI-TIME, and AI Opportunity — not a fourth
                independent score, a combination of the three you've already seen. Ranked by criticality × TCO,
                cut to what's actually actionable ({decisionShortlist.length} of {apps.length} applications;
                the rest need no AI-specific decision right now).
              </div>

              {decisionShortlist.length > 0 && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 28 }}>
                  {(() => {
                    const fund = decisionShortlist.find((a) => a.verdict === "Augment") || decisionShortlist[0];
                    const stop = decisionShortlist.find((a) => a.verdict === "Replace" || a.verdict === "Retire");
                    return (
                      <>
                        <div style={{ background: "#DCEAE1", border: `1px solid ${COLORS.accent}`, borderRadius: 18, padding: "16px 20px" }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.accent, marginBottom: 4 }}>Fund With Confidence</div>
                          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{fund.name}</div>
                          <div style={{ fontSize: 12.5, color: COLORS.inkSecondary }}>{fund.reason}</div>
                        </div>
                        {stop ? (
                          <div style={{ background: "#FBE0D8", border: `1px solid ${COLORS.risk}`, borderRadius: 18, padding: "16px 20px" }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.risk, marginBottom: 4 }}>Stop or Pause Early</div>
                            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{stop.name}</div>
                            <div style={{ fontSize: 12.5, color: COLORS.inkSecondary }}>{stop.reason}</div>
                          </div>
                        ) : (
                          <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)", borderRadius: 18, padding: "16px 20px" }}>
                            <div style={{ fontSize: 12.5, color: COLORS.inkSecondary }}>No clear stop/pause candidate in this data.</div>
                          </div>
                        )}
                      </>
                    );
                  })()}
                </div>
              )}

              {decisionShortlist.map((a, i) => (
                <div key={a.id} className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)", borderRadius: 18,
                  padding: 20, marginBottom: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                    <div>
                      <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, marginBottom: 2 }}>#{i + 1}</div>
                      <div style={{ fontSize: 16, fontWeight: 600 }}>{a.name}</div>
                    </div>
                    <span style={{ background: { Retire: "#7A6A73", Replace: COLORS.risk, Augment: COLORS.accent }[a.verdict] || COLORS.ink,
                      color: "#fff", padding: "4px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600 }}>
                      {a.verdict}
                    </span>
                  </div>
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginBottom: 14, lineHeight: 1.6 }}>{a.reason}</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16, fontSize: 12.5 }}>
                    <div>
                      <div style={{ fontWeight: 600, marginBottom: 4 }}>Impacted Processes</div>
                      {a.impactedProcesses.length ? a.impactedProcesses.map((p) => <div key={p.id}>{p.name}</div>) : <div style={{ color: COLORS.inkSecondary }}>None</div>}
                    </div>
                    <div>
                      <div style={{ fontWeight: 600, marginBottom: 4 }}>Impacted Teams</div>
                      {a.impactedTeams.length ? a.impactedTeams.map((t) => <div key={t}>{t}</div>) : <div style={{ color: COLORS.inkSecondary }}>None traced</div>}
                    </div>
                    <div>
                      <div style={{ fontWeight: 600, marginBottom: 4 }}>Impacted Roles</div>
                      {a.impactedRoles.length ? a.impactedRoles.map((r) => <div key={r}>{r}</div>) : <div style={{ color: COLORS.inkSecondary }}>None traced</div>}
                    </div>
                    <div>
                      <div style={{ fontWeight: 600, marginBottom: 4 }}>Impacted Apps/Integrations</div>
                      {a.impactedApps.length ? a.impactedApps.map((n) => <div key={n}>{n}</div>) : <div style={{ color: COLORS.inkSecondary }}>None</div>}
                    </div>
                  </div>
                  <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px solid ${COLORS.border}`, fontSize: 12, color: COLORS.inkSecondary }}>
                    {a.criticality} criticality · {fmtGBP(a.tco)} annual TCO · 6R: {a.disposition.code} · AI-TIME: {a.aiQuadrant}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, marginTop: 20, lineHeight: 1.6 }}>
        Connects directly to Neo4j Aura's Query API over HTTPS. Credentials are held only in this page's memory.
        6R disposition is calculated from business value, technical health, and hosting model using simple rules
        shown in each application's detail — a real assessment would involve architect judgement, this is a starting point.
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(APMDashboardLive));
</script>

<script>
  (function () {
    var root = document.getElementById('root');
    var missing = [];
    if (typeof React === 'undefined') missing.push('React (unpkg.com)');
    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM (unpkg.com)');
    if (typeof Babel === 'undefined') missing.push('Babel (unpkg.com)');
    if (typeof marked === 'undefined') missing.push('marked (cdn.jsdelivr.net)');
    if (typeof DOMPurify === 'undefined') missing.push('DOMPurify (cdn.jsdelivr.net)');
    if (missing.length) {
      root.innerHTML =
        '<div style="font-family: sans-serif; padding: 40px; max-width: 700px; color: #1C2A3A;">' +
        '<h2 style="color:#9B3A2E;">' + missing.length + ' script(s) failed to load</h2>' +
        '<p style="line-height:1.6;">Missing: ' + missing.join(', ') + '</p>' +
        '<p style="color:#5B6B7A; font-size: 13px; line-height: 1.6;">Almost always an ad/tracker blocker or ' +
        'firewall silently blocking the CDN shown above. Check the shield icon in Vivaldi\'s address bar, or ' +
        'Developer Tools \u2192 Network tab to see which specific request failed and why.</p></div>';
      return;
    }
    try {
      var src = document.getElementById('app-source').textContent;
      var output = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], sourceType: 'script' }).code;
      var runner = new Function('React', 'ReactDOM', output);
      runner(React, ReactDOM);
    } catch (err) {
      root.innerHTML =
        '<div style="font-family: sans-serif; padding: 40px; max-width: 700px; color: #1C2A3A;">' +
        '<h2 style="color:#9B3A2E;">Build error</h2>' +
        '<pre style="white-space: pre-wrap; background: #F6F4EF; padding: 16px; border-radius: 4px; ' +
        'font-size: 12.5px; border: 1px solid #DDD9CE;">' + (err.stack || err.message) + '</pre></div>';
    }
  })();
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="font-family: sans-serif; padding: 40px; color:#9B3A2E;">' +
        'Still blank with no error caught \u2014 open Developer Tools \u2192 Console and share what\'s there.</div>';
    }
  }, 4000);
</script>
</body>
</html>
