<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RBL Application Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>

    --accent-bright: #22D3A6;
    --accent2: #7C5CFF;
    --accent2-bright: #9B8CFF;

    --glow-accent2: rgba(124,92,255,0.35);

  .chat-markdown pre { background: var(--ink); color: #E8EAED; padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 8px 0; }
  .chat-markdown pre code { background: none; padding: 0; color: inherit; }
  .chat-markdown blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 2px 0 2px 12px; color: #64748B; font-style: italic; font-size: 0.95em; }
  .chat-markdown table { margin: 8px 0; font-size: 0.95em; }
  .chat-markdown th { border-bottom: 1px solid var(--border); font-weight: 600; }
  .chat-markdown h1, .chat-markdown h2, .chat-markdown h3 { margin: 10px 0 6px 0; font-size: 1.05em; }
  .chat-markdown a { color: var(--accent); }
  .chat-markdown hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  @keyframes heroGradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes floatSlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-14px, 16px) scale(1.06); }
  }
  @keyframes floatSlowReverse {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(18px, -12px) scale(1.08); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }

  @keyframes viewFade {
    from { opacity: 0; transform: translateY(6px); }

    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hero-flashy {
    background: linear-gradient(120deg, #060A14, #0E2A20, #0EA968, #0E2A20, #060A14);

    animation: heroGradientShift 14s ease infinite;

    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.12;
    pointer-events: none;

    animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }

    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;

    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    box-shadow: 0 6px 16px rgba(14,169,104,0.3);
    color: #fff;

    background: linear-gradient(135deg, var(--accent) 0%, #0C8F58 100%);
    color: #fff; border: none; cursor: pointer;

    box-shadow: 0 4px 14px rgba(14,169,104,0.32);

  .ds-btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 8px 22px rgba(14,169,104,0.4); }
  .ds-btn-primary:active { transform: translateY(0); }

  .ds-nav-pill:not(.ds-nav-pill-active):hover { background: rgba(255,255,255,0.08) !important; color: #fff !important; }

  .skeleton {
    background: linear-gradient(90deg, #EDEFF7 25%, #F7F8FC 37%, #EDEFF7 63%);
    background-size: 800px 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }

  .spin-loader {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
</style>
</head>

function sanitizeVerbJS(verb) {
  return verb.trim().replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").toUpperCase();
}
function newCanvasId(prefix) {
  return `${prefix}-${Date.now()}-${Math.round(Math.random() * 100000)}`;
}
// Finds a spot near the desired position that doesn't overlap any existing
// canvas item, spiralling outward until it finds one — new objects should
// land somewhere usable, not stacked exactly on top of whatever's already there.
// Exact distance from a rectangle's centre to its edge along a given
// direction — replaces a fixed-radius trim that overshot badly on short
// vertical connections (a 100px trim vs a 96px-tall card left a visible gap).
// Rough estimate of wrapped line count for a name at the card's width, so
// imported/expanded concepts (which carry real, often longer names) start at
// a height that actually fits their content instead of a flat guess.
// Full markdown via the real `marked` library (loaded from CDN — see the
// build script's <head>), not a hand-rolled parser. Output is run through
// DOMPurify before rendering, since this goes through dangerouslySetInnerHTML
// and the source text ultimately traces back to data in the person's own
// Neo4j instance — low risk for a single-user local tool, but sanitizing is
// cheap and this is the one spot in the app where raw HTML actually renders.
function renderChatMarkdown(text) {
  if (!text) return null;
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
    return <span>{text}</span>; // CDN blocked — fall back to plain text rather than crash

  // blockquote so it gets genuinely distinct styling via normal markdown
  // semantics, not a special case bolted onto a custom renderer.
  const withBlockquote = text.replace(
    /(^|\n)(General context \(not from your data\):[^\n]*(\n(?!\n)[^\n]*)*)/,
    (match, lead, para) => `${lead}> ${para.replace(/\n/g, "\n> ")}`
  );
  const html = DOMPurify.sanitize(marked.parse(withBlockquote));
  return <div className="chat-markdown" dangerouslySetInnerHTML={{ __html: html }} />;
}

function estimateConceptHeight(name, width, baseHeight) {
  const charsPerLine = Math.max(8, Math.floor((width - 24) / 8)); // was 6.5 — too narrow for the actual bold name font, undershot on medium-length names
  const lines = Math.max(1, Math.ceil((name || "").length / charsPerLine));
  return baseHeight + (lines - 1) * 18;
}

const ANCHOR_NORMAL = { top: { x: 0, y: -1 }, bottom: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

const ANCHOR_SIDES = ["top", "right", "bottom", "left"];
function getAnchorPoint(box, w, h, anchor) {
  switch (anchor) {
    case "top": return { x: box.x + w / 2, y: box.y };
    case "bottom": return { x: box.x + w / 2, y: box.y + h };
    case "left": return { x: box.x, y: box.y + h / 2 };
    case "right": default: return { x: box.x + w, y: box.y + h / 2 };
  }
}
const MATURITY_DIMS = [
  ["governance", "Governance"], ["policies", "Policies"], ["process", "Process"],
  ["people", "People"], ["applications", "Applications"], ["metrics", "Metrics"],
];
function maturityToNumber(str) {
  if (!str) return 0;
  const n = parseInt(str, 10);
  return isNaN(n) ? 0 : n;
}

function radarPoint(cx, cy, radius, index, total) {
  const angle = (Math.PI * 2 * index) / total - Math.PI / 2;
  return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
}

function closestAnchor(box, w, h, point) {
  let best = "top", bestDist = Infinity;
  ANCHOR_SIDES.forEach((a) => {
    const p = getAnchorPoint(box, w, h, a);
    const d = (p.x - point.x) ** 2 + (p.y - point.y) ** 2;
    if (d < bestDist) { bestDist = d; best = a; }
  });
  return best;
}

function rectTrimDistance(ux, uy, halfW, halfH) {
  if (ux === 0 && uy === 0) return 0;
  const tx = ux !== 0 ? halfW / Math.abs(ux) : Infinity;
  const ty = uy !== 0 ? halfH / Math.abs(uy) : Infinity;
  return Math.min(tx, ty);
}

function findFreePosition(desiredX, desiredY, existingItems, w, h) {
  const pad = 24;
  const overlaps = (x, y) => existingItems.some((it) => {
    const iw = it.w || 190, ih = it.h || 96;
    return x < it.x + iw + pad && x + w + pad > it.x && y < it.y + ih + pad && y + h + pad > it.y;
  });
  if (!overlaps(desiredX, desiredY)) return { x: desiredX, y: desiredY };
  const step = 50;
  for (let ring = 1; ring <= 24; ring++) {
    for (let angle = 0; angle < 360; angle += 30) {
      const rad = (angle * Math.PI) / 180;
      const x = desiredX + Math.cos(rad) * ring * step, y = desiredY + Math.sin(rad) * ring * step;
      if (!overlaps(x, y)) return { x, y };

// Reverses the sanitizeVerbJS transform well enough for display — Neo4j only
// stores the sanitized uppercase relationship type, so this is how imported
// relationships get a readable verb back on the canvas edge label.
function desanitizeVerb(relType) {
  return relType.toLowerCase().replace(/_/g, " ");
}

function toSnakeCase(name) {
  return name.replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1_$2").toLowerCase();

function humanizeLabel(name) {
  return name.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2");

  if (word === "Data") return word; // uncountable — "Datas" is wrong
  if (/[^aeiouAEIOU]y$/.test(word)) return word.slice(0, -1) + "ies"; // Strategy -> Strategies

  return word + "s"; // Journey -> Journeys (vowel before "y")

  words[words.length - 1] = pluralizeWord(words[words.length - 1]);

}
const CONCEPT_ICON_COMMON = { width: 15, height: 15, viewBox: "0 0 24 24", fill: "none", stroke: "#fff", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };

  Goal: { color: "#D9971F", icon: <svg {...CONCEPT_ICON_COMMON}><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4" /><circle cx="12" cy="12" r="0.7" fill="#fff" stroke="none" /></svg> },

// Basic shapes are actual geometry (filled + stroked), not an icon — rendered
// fresh at whatever size the box currently is, so resizing genuinely reshapes
// the shape rather than stretching a fixed icon.
function renderBasicShapeSvg(shapeKey, w, h, color) {
  const stroke = color, fill = color + "22", strokeWidth = 2;
  const common = { stroke, fill, strokeWidth };
  const cx = w / 2, cy = h / 2;
  switch (shapeKey) {
    case "rectangle": return <rect x="1" y="1" width={Math.max(0, w - 2)} height={Math.max(0, h - 2)} {...common} />;
    case "roundedrect": case "task": return <rect x="1" y="1" width={Math.max(0, w - 2)} height={Math.max(0, h - 2)} rx="10" {...common} />;
    case "circle": case "start": return <ellipse cx={cx} cy={cy} rx={Math.max(0, w / 2 - 1)} ry={Math.max(0, h / 2 - 1)} {...common} />;
    case "end": return <ellipse cx={cx} cy={cy} rx={Math.max(0, w / 2 - 2.5)} ry={Math.max(0, h / 2 - 2.5)} stroke={stroke} fill={fill} strokeWidth={3.5} />;
    case "intermediate": return (
      <>
        <ellipse cx={cx} cy={cy} rx={Math.max(0, w / 2 - 1)} ry={Math.max(0, h / 2 - 1)} {...common} />
        <ellipse cx={cx} cy={cy} rx={Math.max(0, w / 2 - 5)} ry={Math.max(0, h / 2 - 5)} stroke={stroke} fill="none" strokeWidth={1.4} />
      </>
    );
    case "lozenge": return <rect x="1" y="1" width={Math.max(0, w - 2)} height={Math.max(0, h - 2)} rx={h / 2} {...common} />;
    case "triangle": return <polygon points={`${w / 2},2 ${w - 2},${h - 2} 2,${h - 2}`} strokeLinejoin="round" {...common} />;
    case "diamond": return <polygon points={`${w / 2},2 ${w - 2},${h / 2} ${w / 2},${h - 2} 2,${h / 2}`} strokeLinejoin="round" {...common} />;
    case "gateway-x": case "gateway-and": case "gateway-or": {
      const pts = `${cx},2 ${w - 2},${cy} ${cx},${h - 2} 2,${cy}`;
      const m = Math.min(w, h) * 0.16;
      return (
        <>
          <polygon points={pts} strokeLinejoin="round" {...common} />
          {shapeKey === "gateway-x" && (
            <>
              <line x1={cx - m} y1={cy - m} x2={cx + m} y2={cy + m} stroke={stroke} strokeWidth={2} strokeLinecap="round" />
              <line x1={cx + m} y1={cy - m} x2={cx - m} y2={cy + m} stroke={stroke} strokeWidth={2} strokeLinecap="round" />
            </>
          )}
          {shapeKey === "gateway-and" && (
            <>
              <line x1={cx} y1={cy - m} x2={cx} y2={cy + m} stroke={stroke} strokeWidth={2} strokeLinecap="round" />
              <line x1={cx - m} y1={cy} x2={cx + m} y2={cy} stroke={stroke} strokeWidth={2} strokeLinecap="round" />
            </>
          )}
          {shapeKey === "gateway-or" && <circle cx={cx} cy={cy} r={m * 0.85} stroke={stroke} fill="none" strokeWidth={2} />}
        </>
      );
    }
    case "dataobject": {
      const fold = Math.min(w, h) * 0.22;
      return (
        <>
          <polygon points={`2,2 ${w - 2 - fold},2 ${w - 2},${2 + fold} ${w - 2},${h - 2} 2,${h - 2}`} strokeLinejoin="round" {...common} />
          <polyline points={`${w - 2 - fold},2 ${w - 2 - fold},${2 + fold} ${w - 2},${2 + fold}`} stroke={stroke} fill="none" strokeWidth={strokeWidth} />
        </>
      );
    }
    case "datastore": {
      const ry = Math.min(h * 0.18, 12);
      return (
        <>
          <ellipse cx={cx} cy={2 + ry} rx={Math.max(0, w / 2 - 2)} ry={ry} {...common} />
          <line x1="2" y1={2 + ry} x2="2" y2={h - 2 - ry} stroke={stroke} strokeWidth={strokeWidth} />
          <line x1={w - 2} y1={2 + ry} x2={w - 2} y2={h - 2 - ry} stroke={stroke} strokeWidth={strokeWidth} />
          <path d={`M2,${h - 2 - ry} C2,${h - 2 + ry * 0.6} ${w - 2},${h - 2 + ry * 0.6} ${w - 2},${h - 2 - ry}`} stroke={stroke} fill={fill} strokeWidth={strokeWidth} />
        </>
      );
    }
    case "lane": return (
      <>
        <rect x="1" y="1" width={Math.max(0, w - 2)} height={Math.max(0, h - 2)} {...common} />
        <line x1="1" y1={cy} x2={w - 1} y2={cy} stroke={stroke} strokeWidth={1.4} />
      </>
    );

    // --- Cloud ---
    case "cloud": {
      const r = Math.min(w, h) * 0.28;
      return <path d={`M${w*0.28},${h*0.72} a${r},${r} 0 1,1 ${r*0.3},${-r*1.5} a${r*1.3},${r*1.3} 0 0,1 ${r*2.4},${-r*0.3} a${r},${r} 0 0,1 ${r*0.5},${r*2.15} Z`} strokeLinejoin="round" {...common} />;
    }
    case "server": return (
      <>
        <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h / 2 - 3)} rx="3" {...common} />
        <rect x="2" y={h / 2 + 1} width={Math.max(0, w - 4)} height={Math.max(0, h / 2 - 3)} rx="3" {...common} />
        <circle cx={w * 0.18} cy={h * 0.25} r="1.6" fill={stroke} stroke="none" />
        <circle cx={w * 0.18} cy={h * 0.75} r="1.6" fill={stroke} stroke="none" />
      </>
    );
    case "database": case "cache": {
      const ry = Math.min(h * 0.18, 12);
      return (
        <>
          <ellipse cx={cx} cy={2 + ry} rx={Math.max(0, w / 2 - 2)} ry={ry} {...common} strokeDasharray={shapeKey === "cache" ? "3,2" : undefined} />
          <line x1="2" y1={2 + ry} x2="2" y2={h - 2 - ry} stroke={stroke} strokeWidth={strokeWidth} />
          <line x1={w - 2} y1={2 + ry} x2={w - 2} y2={h - 2 - ry} stroke={stroke} strokeWidth={strokeWidth} />
          <path d={`M2,${h - 2 - ry} C2,${h - 2 + ry * 0.6} ${w - 2},${h - 2 + ry * 0.6} ${w - 2},${h - 2 - ry}`} stroke={stroke} fill={fill} strokeWidth={strokeWidth} />
        </>
      );
    }
    case "storage": case "backup": return (
      <>
        <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h - 4)} rx="3" {...common} />
        <line x1="2" y1={h * 0.42} x2={w - 2} y2={h * 0.42} stroke={stroke} strokeWidth={1.4} />
        <line x1="2" y1={h * 0.68} x2={w - 2} y2={h * 0.68} stroke={stroke} strokeWidth={1.4} />
      </>
    );
    case "container": return (
      <>
        <rect x="2" y={h * 0.28} width={Math.max(0, w - 4)} height={Math.max(0, h * 0.68)} rx="2" {...common} />
        <polyline points={`2,${h*0.28} ${w*0.2},${h*0.06} ${w-2},${h*0.06} ${w-2},${h*0.28}`} strokeLinejoin="round" {...common} />
      </>
    );
    case "vm": return (
      <>
        <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h * 0.7)} rx="3" {...common} />
        <line x1={w * 0.35} y1={h - 3} x2={w * 0.65} y2={h - 3} stroke={stroke} strokeWidth={2.4} strokeLinecap="round" />
        <line x1={cx} y1={h * 0.72} x2={cx} y2={h - 3} stroke={stroke} strokeWidth={1.6} />
      </>
    );
    case "function": return (
      <>
        <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h - 4)} rx="8" {...common} />
        <polyline points={`${w*0.42},${h*0.22} ${w*0.58},${h*0.22} ${w*0.44},${h*0.5} ${w*0.58},${h*0.5} ${w*0.4},${h*0.8}`} stroke={stroke} fill="none" strokeWidth={1.6} strokeLinejoin="round" strokeLinecap="round" />
      </>
    );
    case "cluster": case "loadbalancer": {
      const r = Math.min(w, h) * 0.14;
      const topY = h * 0.22, botY = h * 0.78, lx = w * 0.22, rx2 = w * 0.78;
      return (
        <>
          <line x1={cx} y1={topY} x2={lx} y2={botY} stroke={stroke} strokeWidth={1.6} />
          <line x1={cx} y1={topY} x2={rx2} y2={botY} stroke={stroke} strokeWidth={1.6} />
          <circle cx={cx} cy={topY} r={r} {...common} />
          <circle cx={lx} cy={botY} r={r} {...common} />
          <circle cx={rx2} cy={botY} r={r} {...common} />
        </>
      );
    }
    case "cdn": case "dns": case "internet": return (
      <>
        <ellipse cx={cx} cy={cy} rx={Math.max(0, w / 2 - 2)} ry={Math.max(0, h / 2 - 2)} {...common} />
        <ellipse cx={cx} cy={cy} rx={Math.max(0, w * 0.16)} ry={Math.max(0, h / 2 - 2)} stroke={stroke} fill="none" strokeWidth={1.4} />
        <line x1="2" y1={cy} x2={w - 2} y2={cy} stroke={stroke} strokeWidth={1.4} />
      </>
    );
    case "queue": return (
      <>
        <rect x="2" y={h * 0.2} width={Math.max(0, w * 0.28)} height={Math.max(0, h * 0.6)} rx="3" {...common} />
        <rect x={w * 0.37} y={h * 0.2} width={Math.max(0, w * 0.28)} height={Math.max(0, h * 0.6)} rx="3" {...common} />
        <rect x={w * 0.72} y={h * 0.2} width={Math.max(0, w * 0.26 - 2)} height={Math.max(0, h * 0.6)} rx="3" {...common} />
      </>
    );

    // --- Network ---
    case "firewall": return (
      <>
        <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h - 4)} {...common} />
        <line x1="2" y1={h * 0.35} x2={w - 2} y2={h * 0.35} stroke={stroke} strokeWidth={1.3} />
        <line x1="2" y1={h * 0.65} x2={w - 2} y2={h * 0.65} stroke={stroke} strokeWidth={1.3} />
        <line x1={w * 0.35} y1="2" x2={w * 0.35} y2={h * 0.35} stroke={stroke} strokeWidth={1.3} />
        <line x1={w * 0.65} y1={h * 0.35} x2={w * 0.65} y2={h * 0.65} stroke={stroke} strokeWidth={1.3} />
        <line x1={w * 0.35} y1={h * 0.65} x2={w * 0.35} y2={h - 2} stroke={stroke} strokeWidth={1.3} />
      </>
    );
    case "router": case "switch": case "vpngateway": case "apigateway": {
      const portCount = shapeKey === "switch" ? 5 : shapeKey === "router" ? 3 : 0;
      const ports = [];
      for (let i = 0; i < portCount; i++) {
        const px = w * (0.18 + i * (0.64 / Math.max(1, portCount - 1)));
        ports.push(<line key={i} x1={px} y1="2" x2={px} y2={h * 0.32} stroke={stroke} strokeWidth={1.4} />);
      }
      const isPill = shapeKey === "apigateway" || shapeKey === "vpngateway";
      return (
        <>
          <rect x="2" y={portCount ? h * 0.32 : 2} width={Math.max(0, w - 4)} height={Math.max(0, h - (portCount ? h * 0.32 : 2) - 2)} rx={isPill ? h / 2.5 : 4} {...common} />
          {ports}
          {isPill && (
            <>
              <circle cx={w * 0.38} cy={cy} r="1.7" fill={stroke} stroke="none" />
              <circle cx={cx} cy={cy} r="1.7" fill={stroke} stroke="none" />
              <circle cx={w * 0.62} cy={cy} r="1.7" fill={stroke} stroke="none" />
            </>

        </>

    case "vpn": case "waf": {
      const pts = `${cx},2 ${w-2},${h*0.25} ${w-2},${h*0.65} ${cx},${h-2} 2,${h*0.65} 2,${h*0.25}`;
      return (
        <>
          <polygon points={pts} strokeLinejoin="round" {...common} />
          <polyline points={`${w*0.35},${h*0.5} ${w*0.46},${h*0.62} ${w*0.66},${h*0.36}`} stroke={stroke} fill="none" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
        </>
      );

    case "vpc": case "external": return <rect x="2" y="2" width={Math.max(0, w - 4)} height={Math.max(0, h - 4)} rx="4" stroke={stroke} fill="none" strokeWidth="1.6" strokeDasharray="4,3" />;
    case "proxy": return (

async function runCypher(apiUrl, authHeader, statement, parameters = {}) {
  const res = await fetch(apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json", Authorization: authHeader },
    body: JSON.stringify({ statement, parameters }),
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Query API returned ${res.status}: ${text || res.statusText}`);
  }
  const json = await res.json();
  const fields = json.data.fields;
  const values = json.data.values;
  return values.map((row) => Object.fromEntries(fields.map((f, i) => [f, row[i]])));
}

function computeDisposition(app) {
  if (app.status === "Retiring") return { code: "Retire", reason: "Already flagged for retirement" };
  if (!app.businessValue || !app.techHealth) return { code: "Refactor", reason: "Insufficient data to classify" };
  const onPrem = app.hosting === "On-Prem";
  if (app.businessValue <= 1) return { code: "Retire", reason: "Low business value" };
  if (app.businessValue >= 2 && app.techHealth <= 2) {
    return onPrem
      ? { code: "Replatform", reason: "Valuable but ageing, on legacy infrastructure" }
      : { code: "Replace", reason: "Valuable but poor technical health, already off-prem" };
  }
  if (app.businessValue >= 2 && app.techHealth >= 3) {
    return onPrem
      ? { code: "Rehost", reason: "Healthy and valuable, just needs to leave legacy infrastructure" }
      : { code: "Retain", reason: "Healthy, valuable, and already modern" };
  }
  return { code: "Refactor", reason: "Doesn't fit a clean pattern" };
}

// a process's AI readiness comes from the quality of the DATA belonging to the
// same CAPABILITY the process realises, found by traversing two real edges
// (Process -REALISES-> Capability <-BELONGS_TO- Data), not a hardcoded lookup.
// Refined blast radius: distinguishes a capability going fully DARK (no other
// app covers it) from DEGRADED (another app still supports it), computes a
// composite severity score, and generates plain-language recovery notes —
// all derived from data already in the graph, not a separate scoring model.
const CRIT_WEIGHT_BR = { Critical: 3, High: 2, Medium: 1, Low: 0.5 };
function computeDRReadiness(app, controls, depLinks) {
  const drControls = controls.filter((c) => /disaster recovery|backup/i.test(c.control || ""));
  const protectedIds = new Set(drControls.map((c) => c.targetId));
  if (protectedIds.has(app.id)) {
    return { covered: true, via: "direct", control: drControls.find((c) => c.targetId === app.id).control };
  }
  const runsOnIds = depLinks.filter((l) => l.sourceId === app.id && l.relType === "RUNS_ON").map((l) => l.targetId);
  for (const tid of runsOnIds) {
    if (protectedIds.has(tid)) {
      return { covered: true, via: "infrastructure", control: drControls.find((c) => c.targetId === tid).control };
    }
  }
  return { covered: false };
}

function computeBlastRadius(app, allApps, depLinks, depNodes, processes, orgsByProcess, controls) {
  const darkCapabilities = [];
  const degradedCapabilities = [];
  (app.capabilities || []).forEach((cap) => {
    const others = allApps.filter((a) => a.id !== app.id && (a.capabilities || []).includes(cap));
    if (others.length === 0) darkCapabilities.push(cap);
    else degradedCapabilities.push({ cap, coveredBy: others.map((o) => o.name) });
  });
  const downstreamIds = computeReachable(app.id, depLinks, "downstream");
  const downstreamApps = [...downstreamIds]
    .map((id) => depNodes.find((n) => n.id === id))
    .filter((n) => n && n.type === "Application")
    .map((n) => allApps.find((a) => a.id === n.id) || n);
  const usersAffected = (app.userCount || 0) + downstreamApps.reduce((s, a) => s + (a.userCount || 0), 0);
  const orgUnits = [...new Set(
    processes.filter((p) => app.capabilities.includes(p.capabilityName))
      .flatMap((p) => orgsByProcess[p.id] || [])
  )];
  const drReadiness = computeDRReadiness(app, controls, depLinks);
  const score = Math.min(100, Math.round(
    darkCapabilities.length * 25 + degradedCapabilities.length * 8 +
    downstreamApps.length * 10 + (CRIT_WEIGHT_BR[app.criticality] || 1) * 5 +
    (drReadiness.covered ? 0 : 10)
  ));
  const severity = score >= 70 ? "Severe" : score >= 35 ? "Moderate" : "Limited";
  const recovery = [];
  if (degradedCapabilities.length > 0) {
    recovery.push(`${degradedCapabilities.length} capabilit${degradedCapabilities.length === 1 ? "y is" : "ies are"} also linked to other applications — confirm whether ${degradedCapabilities.length === 1 ? "it" : "any"} can take over.`);
  }
  if (darkCapabilities.length > 0) {
    recovery.push(`${darkCapabilities.length} capabilit${darkCapabilities.length === 1 ? "y" : "ies"} would go fully dark — nothing else currently covers ${darkCapabilities.length === 1 ? "it" : "them"}.`);
  }
  if (app.userCount) recovery.push(`Direct user reach is ${app.userCount} — consider a staged maintenance window.`);
  if (downstreamApps.length > 0) recovery.push(`${downstreamApps.length} other application${downstreamApps.length === 1 ? "" : "s"} technically depend on this — sequence any change carefully.`);
  if (!drReadiness.covered) recovery.push("No disaster recovery or backup control found covering this system or its infrastructure — a real readiness gap, not just a technical one.");
  if (recovery.length === 0) recovery.push("No significant dependencies found — this looks like a self-contained change.");
  return { darkCapabilities, degradedCapabilities, downstreamApps, usersAffected, score, severity, recovery, orgUnits, drReadiness };
}

// a process's AI readiness comes from the quality of the DATA belonging to the
// same CAPABILITY the process realises, found by traversing two real edges
// (Process -REALISES-> Capability <-BELONGS_TO- Data), not a hardcoded lookup.
// AI opportunity scoring: reasons through the graph rather than a flat table —
// a process's AI readiness comes from the quality of the DATA belonging to the
// same CAPABILITY the process realises, found by traversing two real edges
// (Process -REALISES-> Capability <-BELONGS_TO- Data), not a hardcoded lookup.
const AUTOMATION_SCORE = { Manual: 3, Partial: 1.5, Full: 0 };
const FREQUENCY_SCORE = { "Real-time": 3, Daily: 3, Weekly: 2, Monthly: 1, "Ad-hoc": 0.5 };
const IMPORTANCE_SCORE = { Critical: 3, High: 2, Medium: 1, Low: 0.5 };
const QUALITY_SCORE = { High: 3, Adequate: 2, Poor: 1 };

function computeAIScores(p) {
  const autoS = AUTOMATION_SCORE[p.automationLevel] ?? 1;
  const freqS = FREQUENCY_SCORE[p.frequency] ?? 1;
  const impS = IMPORTANCE_SCORE[p.capabilityImportance] ?? 1;
  const opportunity = (autoS + freqS + impS) / 3;
  const readiness = p.dataQualities.length
    ? p.dataQualities.reduce((s, q) => s + (QUALITY_SCORE[q] || 2), 0) / p.dataQualities.length
    : 1.5;
  return { opportunity, readiness };
}

// simple force-directed layout, no external library — fine for small graphs
function layoutGraph(nodes, links, width, height) {
  const pos = {};
  nodes.forEach((n, i) => {
    const angle = (i / nodes.length) * 2 * Math.PI;
    pos[n.id] = { x: width / 2 + Math.cos(angle) * 150, y: height / 2 + Math.sin(angle) * 150, vx: 0, vy: 0 };
  });
  for (let iter = 0; iter < 300; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = pos[nodes[i].id], b = pos[nodes[j].id];
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
        const force = 1800 / (dist * dist);
        const fx = (dx / dist) * force, fy = (dy / dist) * force;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      }
    }
    links.forEach((l) => {
      const a = pos[l.sourceId], b = pos[l.targetId];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
      const force = (dist - 130) * 0.02;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });
    nodes.forEach((n) => {
      const p = pos[n.id];
      p.vx += (width / 2 - p.x) * 0.001;
      p.vy += (height / 2 - p.y) * 0.001;
      p.vx *= 0.85; p.vy *= 0.85;
      p.x += p.vx; p.y += p.vy;
      p.x = Math.max(40, Math.min(width - 40, p.x));
      p.y = Math.max(40, Math.min(height - 40, p.y));
    });
  }
  return pos;
}

function computeReachable(nodeId, links, direction) {
  // direction 'downstream' = things affected if nodeId fails (source depends on nodeId)
  // direction 'upstream' = things nodeId depends on
  const found = new Set();
  let frontier = [nodeId];
  while (frontier.length) {
    const next = [];
    frontier.forEach((cur) => {
      links.forEach((l) => {
        if (!DEPENDENCY_TYPES.has(l.relType)) return;
        if (direction === "downstream" && l.targetId === cur && !found.has(l.sourceId) && l.sourceId !== nodeId) {
          found.add(l.sourceId); next.push(l.sourceId);
        }
        if (direction === "upstream" && l.sourceId === cur && !found.has(l.targetId) && l.targetId !== nodeId) {
          found.add(l.targetId); next.push(l.targetId);
        }
      });
    });
    frontier = next;
  }
  return found;
}

  const updateAsk = (key, patch) => setAskState((prev) => ({ ...prev, [key]: { ...(prev[key] || {}), ...patch } }));

  const submitAsk = async (key) => {
    const q = (askState[key]?.input || "").trim();
    if (!q) return;
    updateAsk(key, { loading: true, answer: "" });
    try {
      const res = await fetch("http://localhost:5050/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }),
      });
      const data = await res.json();
      updateAsk(key, { loading: false, answer: data.answer });
      // On Portfolio Overview specifically: if the answer identified a set of
      // real applications, actually filter the real table to show them
      // properly — sortable columns, exportable — instead of leaving the
      // person to read a comma-separated wall of names out of a chat bubble.
      if (key === "portfolio") {
        const appEntities = (data.entities || []).filter((e) => e.type === "Application");
        setAiResultFilter(appEntities.length > 0 ? new Set(appEntities.map((e) => e.id)) : null);
      }
    } catch (e) {
      updateAsk(key, { loading: false, answer: `Couldn't reach chat_server.py: ${e.message}` });
    }
  };

  // Plain function, not a component — called inline as {askBox(...)} so it never
  // gets a fresh component identity on re-render, which would otherwise wipe out
  // whatever the person just typed on every single keystroke elsewhere on the page.
  const askBox = (key, placeholder) => {
    const s = askState[key] || {};
    return (
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={s.input || ""} onChange={(e) => updateAsk(key, { input: e.target.value })}
            onKeyDown={(e) => { if (e.key === "Enter") submitAsk(key); }} placeholder={placeholder}
            style={{ flex: 1, padding: "9px 12px", border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 13 }} />
          <button onClick={() => submitAsk(key)} disabled={s.loading}
            style={{ padding: "9px 16px", background: COLORS.ink, color: "#fff", border: "none", borderRadius: 8, fontSize: 12.5, cursor: "pointer" }}>
            {s.loading ? "…" : "Ask"}
          </button>
        </div>
        {s.answer && (
          <div style={{ fontSize: 12.5, background: "#F3F4F7", border: `1px solid ${COLORS.border}`, padding: "10px 12px",
            borderRadius: 8, marginTop: 8, lineHeight: 1.5 }}>{s.answer}</div>
        )}
      </div>
    );
  };

  // Plain function like askBox, not a component — same reasoning: called inline
  // as {subTabs(...)} so re-renders never wipe out unrelated state.
  const subTabs = (options) => (
    <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
      {options.map(([key, label]) => (
        <button key={key} onClick={() => setView(key)}
          style={{ padding: "6px 14px", fontSize: 12.5, borderRadius: 8, cursor: "pointer",
            border: `1px solid ${view === key ? COLORS.ink : COLORS.border}`,
            background: view === key ? COLORS.ink : COLORS.card,
            color: view === key ? "#fff" : COLORS.ink }}>
          {label}
        </button>
      ))}
    </div>
  );
  const [lastFetched, setLastFetched] = useState(null);
  const [hovered, setHovered] = useState(null);
  const [selectedNode, setSelectedNode] = useState(null);
  const [hoveredEdge, setHoveredEdge] = useState(null);
  const [view, setView] = useState("landing");
  const [openGroups, setOpenGroups] = useState({ costrisk: false, datatrust: false, ai: false, modernisation: false, journeys: false });
  const [chatMessages, setChatMessages] = useState([]);
  const [canvasChatInput, setCanvasChatInput] = useState("");
  const [canvasChatLoading, setCanvasChatLoading] = useState(false);
  const [canvasChatLog, setCanvasChatLog] = useState([]); // [{request, summary, error}]
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [editingAppId, setEditingAppId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editSaving, setEditSaving] = useState(false);
  const [editError, setEditError] = useState("");

  const startEdit = (app) => {
    setEditingAppId(app.id);
    setEditForm({
      owner: app.owner || "", vendor: app.vendor || "", criticality: app.criticality || "",
      hosting: app.hosting || "", businessValue: app.businessValue || "", techHealth: app.techHealth || "",
      tco: app.tco != null ? app.tco : "", architectureStyle: app.architectureStyle || "Traditional",
    });
    setEditError("");
  };

  const saveEdit = useCallback(async () => {
    setEditSaving(true);
    setEditError("");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader,
        `MATCH (n {id: $id}) SET n.owner = $owner, n.vendor = $vendor, n.criticality = $criticality,
         n.hosting_model = $hosting, n.business_value = $businessValue, n.technical_health = $techHealth, n.tco = $tco,
         n.architecture_style = $architectureStyle`,
        {
          id: editingAppId, owner: editForm.owner, vendor: editForm.vendor, criticality: editForm.criticality,
          hosting: editForm.hosting, businessValue: Number(editForm.businessValue) || null,
          techHealth: Number(editForm.techHealth) || null, tco: editForm.tco === "" ? null : Number(editForm.tco),
          architectureStyle: editForm.architectureStyle,
        }
      );
      setEditingAppId(null);
      handleRefresh();
    } catch (e) {
      setEditError(e.message);
    } finally {
      setEditSaving(false);
    }
  }, [editingAppId, editForm, uri, username, password]);

  const sendChatMessage = useCallback(async () => {
    const question = chatInput.trim();
    if (!question || chatLoading) return;
    const history = chatMessages.map((m) => ({ role: m.role, content: m.content }));
    setChatInput("");
    setChatMessages((prev) => [...prev, { role: "user", content: question }]);
    setChatLoading(true);
    try {
      const res = await fetch("http://localhost:5050/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      if (!res.ok) throw new Error(`Chat backend returned ${res.status}`);
      const data = await res.json();
      setChatMessages((prev) => [...prev, { role: "assistant", content: data.answer, cypher: data.cypher, rowCount: data.rowCount, tokens: data.tokens, entities: data.entities }]);
    } catch (e) {
      setChatMessages((prev) => [...prev, { role: "assistant", content: `Couldn't reach the chat backend: ${e.message}. Is chat_server.py running on port 5050?`, error: true }]);
    } finally {
      setChatLoading(false);
    }
  }, [chatInput, chatLoading, chatMessages]);

  const [statusFilter, setStatusFilter] = useState(new Set());
  const [criticalityFilter, setCriticalityFilter] = useState(new Set());
  const [dispositionFilter, setDispositionFilter] = useState(new Set());
  const [hostingFilter, setHostingFilter] = useState(new Set());
  const [aiResultFilter, setAiResultFilter] = useState(null); // Set of ids, or null = no AI filter active
  const [refineInput, setRefineInput] = useState("");
  const [refineLoading, setRefineLoading] = useState(false);
  const [refineFeedback, setRefineFeedback] = useState(null); // { summary, tokens, error }
  const [search, setSearch] = useState("");

  const fetchData = useCallback(async (apiUrl, authHeader) => {
    setStatus("loading");
    setErrorMsg("");
    try {
      const appRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)
         OPTIONAL MATCH (r:Instance:Risk)-[:AFFECTS]->(a)
         OPTIONAL MATCH (a)-[:SUPPORTS]->(c:Instance:Capability)
         RETURN properties(a) AS app, collect(DISTINCT r.name) AS risks, collect(DISTINCT c.name) AS capabilities
         ORDER BY app.name`
      );
      const decisionRows = await runCypher(apiUrl, authHeader,
        `MATCH (d:Instance:Decision)
         OPTIONAL MATCH (d)-[r]->(affected:Instance) WHERE type(r) <> "SUPERSEDES" AND NOT affected:Decision
         WITH d, collect(DISTINCT {verb: type(r), name: affected.name}) AS affects
         OPTIONAL MATCH (d)-[:SUPERSEDES]->(older:Instance:Decision)
         WITH d, affects, collect(DISTINCT {id: older.id, name: older.name}) AS supersedes
         OPTIONAL MATCH (newer:Instance:Decision)-[:SUPERSEDES]->(d)
         WITH d, affects, supersedes, collect(DISTINCT {id: newer.id, name: newer.name}) AS supersededBy
         RETURN properties(d) AS d, affects, supersedes, supersededBy
         ORDER BY d.decision_date DESC`
      );
      const appLocationRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)
         OPTIONAL MATCH (a)-[:HOSTED_AT]->(directLoc:Instance:Location)
         OPTIONAL MATCH (a)-[:RUNS_ON]->(:Instance)-[:HOSTED_AT]->(techLoc:Instance:Location)
         WITH a, collect(DISTINCT directLoc.name) + collect(DISTINCT techLoc.name) AS allLocs
         RETURN a.id AS appId, [l IN allLocs WHERE l IS NOT NULL] AS locations`
      );
      const journeyRows = await runCypher(apiUrl, authHeader,
        `MATCH (j:Instance:Journey)
         OPTIONAL MATCH (j)-[:CONTAINS]->(js:Instance:JourneyStage)
         OPTIONAL MATCH (cap:Instance:Capability)-[:ENABLES]->(js)
         OPTIONAL MATCH (proc:Instance:Process)-[:SUPPORTS]->(js)
         OPTIONAL MATCH (app:Instance:Application)-[:SUPPORTS]->(cap)
         OPTIONAL MATCH (app)-[:RUNS_ON]->(tech)
         RETURN j.id AS journeyId, j.name AS journeyName, j.stereotype AS journeyType,
                js.id AS stageId, js.name AS stageName, js.sequence AS stageSeq, js.stereotype AS stageType,
                collect(DISTINCT cap.name) AS capabilities,
                collect(DISTINCT proc.name) AS processes,
                collect(DISTINCT app.name) AS applications,
                collect(DISTINCT tech.name) AS technologies
         ORDER BY j.name, js.sequence`
      );
      const capRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Instance:Capability)
         OPTIONAL MATCH (c)<-[:SUPPORTS]-(a:Instance:Application)
         RETURN properties(c) AS cap, count(a) AS count
         ORDER BY cap.name`
      );
      const depRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance)-[r]->(b:Instance)
         WHERE (a:Application OR a:SoftwareTechnology OR a:HardwareTechnology OR a:Data)
           AND (b:Application OR b:SoftwareTechnology OR b:HardwareTechnology OR b:Data)
         RETURN a.id AS sourceId, a.name AS sourceName,
                [l IN labels(a) WHERE l <> 'Instance'][0] AS sourceType,
                a.lifecycle AS sourceLifecycle, a.support_status AS sourceSupportStatus,
                a.tech_category AS sourceTechCategory, a.strategic_classification AS sourceStrategicClass,
                type(r) AS relType,
                b.id AS targetId, b.name AS targetName,
                [l IN labels(b) WHERE l <> 'Instance'][0] AS targetType,
                b.lifecycle AS targetLifecycle, b.support_status AS targetSupportStatus,
                b.tech_category AS targetTechCategory, b.strategic_classification AS targetStrategicClass`
      );
      const techRows = await runCypher(apiUrl, authHeader,
        `MATCH (t:Instance)
         WHERE t:SoftwareTechnology OR t:HardwareTechnology
         RETURN properties(t) AS tech, [l IN labels(t) WHERE l <> 'Instance'][0] AS techType`
      );
      const processRows = await runCypher(apiUrl, authHeader,
        `MATCH (p:Instance:Process)-[:REALISES]->(c:Instance:Capability)
         OPTIONAL MATCH (d:Instance:Data)-[:BELONGS_TO]->(c)
         OPTIONAL MATCH (app:Instance:Application)-[:SUPPORTS]->(c)
         RETURN properties(p) AS process, properties(c) AS capability,
                collect(DISTINCT d.quality) AS dataQualities,
                collect(DISTINCT app.name) AS supportingApps
         ORDER BY process.name`
      );
      const orgProcessRows = await runCypher(apiUrl, authHeader,
        `MATCH (o:Instance:Organisation)-[:PERFORMS]->(p:Instance:Process)
         RETURN o.name AS org, p.id AS processId`
      );
      const blockedRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)-[:BLOCKS]->(i:Instance:Initiative)
         RETURN properties(i) AS initiative, a.id AS appId, a.name AS appName`
      );
      const controlRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Instance:Control)-[:CONSTRAINS]->(n)
         RETURN c.name AS control, c.stereotype AS controlType, n.id AS targetId,
                [l IN labels(n) WHERE l <> 'Instance'][0] AS targetType`
      );
      const workspaceRows = await runCypher(apiUrl, authHeader,
        `MATCH (w:Workspace) RETURN w.id AS id, w.name AS name ORDER BY w.name`
      );
      const canvasSummaryRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Canvas) RETURN c.id AS id, c.name AS name, c.workspaceId AS workspaceId ORDER BY c.name`
      );
      let finalWorkspaces = workspaceRows;
      let finalCanvases = canvasSummaryRows;
      if (finalWorkspaces.length === 0) {
        // First time under the workspace/canvas model — migrate any pre-existing
        // single canvas into a default workspace rather than losing it, or start
        // fresh with an empty default if there was nothing there yet.
        const legacyRows = await runCypher(apiUrl, authHeader,
          `OPTIONAL MATCH (c:CanvasState {id: 'main'}) RETURN c.data AS data`
        );
        const legacyData = legacyRows[0] && legacyRows[0].data;
        const wsId = newCanvasId("workspace");
        const canvasId = newCanvasId("pcanvas");
        await runCypher(apiUrl, authHeader, `CREATE (w:Workspace {id: $wsId, name: $wsName})`, { wsId, wsName: "My Workspace" });
        await runCypher(apiUrl, authHeader,
          `CREATE (c:Canvas {id: $canvasId, name: $canvasName, workspaceId: $wsId, data: $data, updatedAt: $now})`,
          { canvasId, canvasName: "Canvas 1", wsId,
            data: legacyData || JSON.stringify({ stickies: [], concepts: [], edges: [], texts: [] }),
            now: new Date().toISOString() }
        );
        finalWorkspaces = [{ id: wsId, name: "My Workspace" }];
        finalCanvases = [{ id: canvasId, name: "Canvas 1", workspaceId: wsId }];
      }
      setWorkspaces(finalWorkspaces);
      setCanvasList(finalCanvases);
      setOpenWorkspaces((prev) => {
        const next = { ...prev };
        finalWorkspaces.forEach((w) => { if (!(w.id in next)) next[w.id] = true; });
        return next;
      });
      const schemaRows = await runCypher(apiUrl, authHeader,
        `MATCH (ct:ConceptType)-[:HAS_ATTRIBUTE]->(ad:AttributeDefinition)
         RETURN ct.name AS conceptType, collect({name: ad.name, type: ad.type, options: ad.options}) AS attributes
         ORDER BY ct.name`
      );
      const relTypeRows = await runCypher(apiUrl, authHeader,
        `MATCH (r:RelationshipType)-[:HAS_SOURCE]->(s:ConceptType)
         MATCH (r)-[:HAS_TARGET]->(t:ConceptType)
         RETURN r.verb AS verb, s.name AS source, t.name AS target`
      );

      const appLocationMap = {};
      appLocationRows.forEach((r) => { appLocationMap[r.appId] = [...new Set(r.locations || [])]; });

      const normalised = appRows.map((row) => ({
        id: row.app.id, name: row.app.name, vendor: row.app.vendor || null,
        owner: row.app.owner || null, category: row.app.category || "Uncategorised",
        architectureStyle: row.app.architecture_style || "Traditional",
        status: row.app.status || "—", hosting: row.app.hosting_model || "—",
        businessValue: Number(row.app.business_value) || null,
        techHealth: Number(row.app.technical_health) || null,
        criticality: row.app.criticality || "—",
        tco: row.app.tco != null ? Number(row.app.tco) : null,
        userCount: row.app.user_count != null ? Number(row.app.user_count) : null,
        plannedDate: row.app.planned_date || null, activeDate: row.app.active_date || null,
        sunsetDate: row.app.sunset_date || null, retiringDate: row.app.retiring_date || null,
        decommissionDate: row.app.decommission_date || null,
        serviceLevel: row.app.service_level || null, rto: row.app.rto || null, rpo: row.app.rpo || null,
        locations: appLocationMap[row.app.id] || [],
        risks: row.risks || [],
        capabilities: (row.capabilities || []).filter(Boolean),
      }));

      const nodeMap = new Map();
      depRows.forEach((r) => {
        nodeMap.set(r.sourceId, { id: r.sourceId, name: r.sourceName, type: r.sourceType,
          lifecycle: r.sourceLifecycle, supportStatus: r.sourceSupportStatus });
        nodeMap.set(r.targetId, { id: r.targetId, name: r.targetName, type: r.targetType,
          lifecycle: r.targetLifecycle, supportStatus: r.targetSupportStatus });
      });

      const technologiesNormalised = techRows.map((row) => ({
        id: row.tech.id, name: row.tech.name, type: row.techType,
        techCategory: row.tech.tech_category || "Uncategorised",
        lifecycle: row.tech.lifecycle || "Current",
        strategicClassification: row.tech.strategic_classification || null,
        supportStatus: row.tech.support_status || null,
        tco: row.tech.tco != null ? Number(row.tech.tco) : null,
      }));

      const processNormalised = processRows.map((row) => ({
        id: row.process.id,
        name: row.process.name,
        automationLevel: row.process.automation_level || null,
        frequency: row.process.frequency || null,
        roles: row.process.roles || null,
        capabilityName: row.capability ? row.capability.name : null,
        capabilityImportance: row.capability ? row.capability.importance : null,
        dataQualities: (row.dataQualities || []).filter(Boolean),
        supportingApps: (row.supportingApps || []).filter(Boolean),
      }));
      const orgsByProcess = {};
      orgProcessRows.forEach((r) => {
        (orgsByProcess[r.processId] = orgsByProcess[r.processId] || []).push(r.org);
      });

      const capCoverageNormalised = capRows.map((r) => ({
        capability: r.cap.name, count: r.count,
        importance: r.cap.importance || null, marketDifferentiation: r.cap.market_differentiation || null,
        maturity: {
          governance: r.cap.governance_maturity || null, policies: r.cap.policies_maturity || null,
          process: r.cap.process_maturity || null, people: r.cap.people_maturity || null,
          applications: r.cap.applications_maturity || null, metrics: r.cap.metrics_maturity || null,
        },
      }));

      const journeysGrouped = {};
      journeyRows.forEach((r) => {
        if (!journeysGrouped[r.journeyId]) journeysGrouped[r.journeyId] = { id: r.journeyId, name: r.journeyName, type: r.journeyType, stages: [] };
        if (r.stageId) {
          journeysGrouped[r.journeyId].stages.push({
            id: r.stageId, name: r.stageName, sequence: r.stageSeq, type: r.stageType,
            capabilities: (r.capabilities || []).filter(Boolean),
            processes: (r.processes || []).filter(Boolean),
            applications: (r.applications || []).filter(Boolean),
            technologies: (r.technologies || []).filter(Boolean),
          });
        }
      });
      const journeysNormalised = Object.values(journeysGrouped).map((j) => ({ ...j, stages: j.stages.sort((a, b) => (a.sequence || 0) - (b.sequence || 0)) }));

      setApps(normalised);
      setCapCoverage(capCoverageNormalised);
      setJourneys(journeysNormalised);

      const decisionsNormalised = decisionRows.map((r) => ({
        id: r.d.id, name: r.d.name, status: r.d.status || "—", type: r.d.stereotype || "—",
        decisionMaker: r.d.decision_maker || null, decisionDate: r.d.decision_date || null,
        reviewDate: r.d.review_date || null, rationale: r.d.rationale || null,
        optionsConsidered: r.d.options_considered || null, chosenOption: r.d.chosen_option || null,
        consequences: r.d.consequences || null, confidence: r.d.confidence || null, impactLevel: r.d.impact_level || null,
        affects: (r.affects || []).filter((a) => a && a.name),
        supersedes: (r.supersedes || []).filter((s) => s && s.id),
        supersededBy: (r.supersededBy || []).filter((s) => s && s.id),
      }));
      setDecisions(decisionsNormalised);
      setDepNodes([...nodeMap.values()]);
      setDepLinks(depRows.map((r) => ({ sourceId: r.sourceId, targetId: r.targetId, relType: r.relType })));
      setProcesses(processNormalised);
      setOrgsByProcess(orgsByProcess);
      setTechnologies(technologiesNormalised);
      setBlockedDecisions(blockedRows.map((row) => ({
        id: row.initiative.id, name: (row.initiative.name || "").replace("[FICTIONAL] ", ""),
        fictional: (row.initiative.name || "").includes("[FICTIONAL]"),
        status: row.initiative.status, sponsor: row.initiative.sponsor,
        startDate: row.initiative.start_date, targetDate: row.initiative.target_date,
        cost: row.initiative.forecast_cost != null ? Number(row.initiative.forecast_cost) : null,
        description: row.initiative.description, appId: row.appId, appName: row.appName,
      })));
      setControls(controlRows);
      const schemaAttrs = {};
      schemaRows.forEach((row) => {
        schemaAttrs[row.conceptType] = (row.attributes || []).filter((a) => a.name && a.name !== "Name");
      });
      setSchemaAttributes(schemaAttrs);
      setSchemaRelationships(relTypeRows);
      setLastFetched(new Date());
      setStatus("connected");
    } catch (e) {
      setErrorMsg(e.message || String(e));
      setStatus("error");
    }
  }, []);

  // Auto-connect on load if credentials were saved from a previous session —
  // the whole point of remembering them is to skip the manual click too.
  useEffect(() => {
    if (uri && password) {
      fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
    }
  }, []);

  // Escape cancels an in-progress arrow — the mouse-driven Finish/Cancel
  // buttons are the primary way, this is just a safety net.
  useEffect(() => {
    const onKeyDown = (e) => { if (e.key === "Escape" && arrowDrawMode) cancelArrowDraw(); };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [arrowDrawMode]);

  // Autoscroll the chat to the newest message — without this, new answers
  // land below the visible area and the person has to manually scroll down
  // every single turn, which doesn't feel like a live conversation.
  useEffect(() => {
    if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
  }, [chatMessages, chatLoading]);

  // Once the workspace/canvas list loads, open whatever canvas comes first —
  // otherwise the person lands on an empty tree with nothing selected.
  useEffect(() => {
    if (canvasList.length > 0 && !activeCanvasId) {
      const first = canvasList[0];
      setActiveCanvasId(first.id);
      loadCanvasData(first.id);
    }
  }, [canvasList]);

  const loadOmInstances = async (type) => {
    setOmLoading(true);
    setOmEditingId(null);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${type}) RETURN properties(n) AS props ORDER BY n.name`
      );
      setOmInstances(rows.map((r) => r.props));
    } catch (e) {
      setOmStatus(`Couldn't load ${type}: ${e.message}`);
      setOmInstances([]);
    } finally {
      setOmLoading(false);
    }
  };

  // Attribute options manager — deliberately separate from instance editing.
  // This changes the SCHEMA (every instance of the type, present and
  // future), not one record, so it lives as its own modal rather than
  // inside the per-instance Add/Edit panel where that distinction would be
  // easy to miss.
  const selectEnumAttr = async (attr) => {
    setEnumManagerAttrName(attr.name);
    setEnumManagerDraft([...(attr.options || [])]);
    setEnumManagerRemoveConfirm(null);
    setEnumManagerStatus("");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const snakeKey = toSnakeCase(attr.name);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${omSelectedType}) WHERE n.${snakeKey} IS NOT NULL RETURN n.${snakeKey} AS val, count(n) AS cnt`
      );
      const counts = {};
      rows.forEach((r) => { counts[r.val] = r.cnt; });
      setEnumManagerCounts(counts);
    } catch (e) {
      setEnumManagerCounts({});
    }
  };

  const removeEnumOption = (value) => {
    if ((enumManagerCounts[value] || 0) > 0 && enumManagerRemoveConfirm !== value) {
      setEnumManagerRemoveConfirm(value);
      return;
    }
    setEnumManagerDraft((prev) => prev.filter((v) => v !== value));
    setEnumManagerRemoveConfirm(null);
  };

  const addEnumOption = () => {
    const val = enumManagerNewOption.trim();
    if (!val || enumManagerDraft.includes(val)) return;
    setEnumManagerDraft((prev) => [...prev, val]);
    setEnumManagerNewOption("");
  };

  const saveEnumOptions = async () => {
    setEnumManagerStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader,
        `MATCH (a:AttributeDefinition {concept_type: $type, name: $name}) SET a.options = $options`,
        { type: omSelectedType, name: enumManagerAttrName, options: enumManagerDraft }
      );
      // Patch the local schema cache too, so the Add/Edit form reflects this
      // immediately without needing a full reconnect.
      setSchemaAttributes((prev) => ({
        ...prev,
        [omSelectedType]: (prev[omSelectedType] || []).map((a) =>
          a.name === enumManagerAttrName ? { ...a, options: enumManagerDraft } : a
        ),
      }));
      setEnumManagerStatus("Saved.");
    } catch (e) {
      setEnumManagerStatus(`Couldn't save: ${e.message}`);
    }
  };

  const omStartNew = () => { setOmEditingId("new"); setOmEditForm({ name: "" }); };
  const omStartEdit = (instance) => { setOmEditingId(instance.id); setOmEditForm({ ...instance }); };

  const omSaveInstance = async () => {
    if (!omEditForm.name || !omEditForm.name.trim()) { setOmStatus("Name is required."); return; }
    setOmStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const { id, ...rest } = omEditForm;
      if (omEditingId === "new") {
        const newId = newCanvasId("om");
        await runCypher(apiUrl, authHeader, `CREATE (n:Instance:${omSelectedType} $props)`, { props: { id: newId, ...rest } });
      } else {
        await runCypher(apiUrl, authHeader, `MATCH (n:Instance:${omSelectedType} {id: $id}) SET n += $props`, { id: omEditingId, props: rest });
      }
      setOmStatus("Saved.");
      setOmEditingId(null);
      loadOmInstances(omSelectedType);
      handleRefresh();
      setTimeout(() => setOmStatus(""), 1500);
    } catch (e) {
      setOmStatus(`Save failed: ${e.message}`);
    }
  };

  const omDeleteInstance = async (instance) => {
    if (!window.confirm(`Permanently delete "${instance.name}" (${omSelectedType}) from the graph? This removes the node and all its relationships — it can't be undone.`)) return;
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader, `MATCH (n:Instance:${omSelectedType} {id: $id}) DETACH DELETE n`, { id: instance.id });
      setOmInstances((prev) => prev.filter((x) => x.id !== instance.id));
      handleRefresh();
    } catch (e) {
      setOmStatus(`Delete failed: ${e.message}`);
    }
  };

  const deleteApplication = async (app) => {
    if (!window.confirm(`Permanently delete "${app.name}" from the graph? This removes the real node and all its relationships in Neo4j — it can't be undone, and it's separate from anything on the Modelling Canvas.`)) return;
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader, `MATCH (n:Instance:Application {id: $id}) DETACH DELETE n`, { id: app.id });
      setApps((prev) => prev.filter((a) => a.id !== app.id));
      handleRefresh();
    } catch (e) {
      setErrorMsg(`Couldn't delete ${app.name}: ${e.message}`);
    }
  };

  const saveBrand = (next) => {
    const merged = { ...brand, ...next };
    setBrand(merged);
    localStorage.setItem("bdcore_brand", JSON.stringify(merged));
  };
  const resetBrand = () => { setBrand(DEFAULT_BRAND); localStorage.removeItem("bdcore_brand"); };

  const handleConnect = () => {
    if (!uri || !password) { setErrorMsg("Enter your Aura connection URI and password."); setStatus("error"); return; }
    localStorage.setItem("bdcore_neo4j_uri", uri);
    localStorage.setItem("bdcore_neo4j_username", username);
    localStorage.setItem("bdcore_neo4j_password", password);
    localStorage.setItem("bdcore_neo4j_dbname", dbName);
    fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
  };
  const handleRefresh = () => fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
  const forgetSavedLogin = () => {
    localStorage.removeItem("bdcore_neo4j_uri");
    localStorage.removeItem("bdcore_neo4j_username");
    localStorage.removeItem("bdcore_neo4j_password");
    localStorage.removeItem("bdcore_neo4j_dbname");
    setUri(""); setUsername("neo4j"); setPassword(""); setDbName("neo4j");
  };

  const appsWithDisposition = useMemo(
    () => apps.map((a) => ({ ...a, disposition: computeDisposition(a) })),
    [apps]
  );

  const allStatuses = useMemo(() => [...new Set(apps.map((a) => a.status))], [apps]);
  const allCriticalities = useMemo(() => [...new Set(apps.map((a) => a.criticality))], [apps]);
  const allDispositions = Object.keys(DISPOSITION_INFO);
  const allHostings = useMemo(() => [...new Set(apps.map((a) => a.hosting).filter(Boolean))], [apps]);

  const filteredApps = useMemo(() => appsWithDisposition.filter((a) => {
    if (statusFilter.size && !statusFilter.has(a.status)) return false;
    if (criticalityFilter.size && !criticalityFilter.has(a.criticality)) return false;
    if (dispositionFilter.size && !dispositionFilter.has(a.disposition.code)) return false;
    if (hostingFilter.size && !hostingFilter.has(a.hosting)) return false;
    if (aiResultFilter && !aiResultFilter.has(a.id)) return false;
    if (search && !`${a.name} ${a.vendor}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [appsWithDisposition, statusFilter, criticalityFilter, dispositionFilter, hostingFilter, aiResultFilter, search]);

  const kpis = useMemo(() => ({
    total: filteredApps.length,
    production: filteredApps.filter((a) => a.status === "Production").length,
    atRisk: filteredApps.filter((a) => a.risks && a.risks.length > 0).length,
    totalTco: filteredApps.reduce((sum, a) => sum + (a.tco || 0), 0),
  }), [filteredApps]);

  const dispositionCounts = useMemo(() => {
    const counts = Object.fromEntries(allDispositions.map((d) => [d, 0]));
    appsWithDisposition.forEach((a) => { counts[a.disposition.code] = (counts[a.disposition.code] || 0) + 1; });
    return counts;
  }, [appsWithDisposition]);

  // Portfolio Health: data completeness across the FULL repository, not the
  // current filter selection — data quality is a property of the whole
  // dataset, not whatever subset happens to be filtered in right now.
  const healthStats = useMemo(() => {
    const total = apps.length;
    const withOwner = apps.filter((a) => a.owner).length;
    const withVendor = apps.filter((a) => a.vendor && a.vendor !== "Undisclosed").length;
    const gaps = apps
      .map((a) => {
        const missing = [];
        if (!a.owner) missing.push("No Owner Defined");
        if (!a.vendor || a.vendor === "Undisclosed") missing.push("Vendor Unconfirmed");
        return { app: a, missing };
      })
      .filter((g) => g.missing.length > 0)
      .sort((a, b) => b.missing.length - a.missing.length);
    const completenessScore = total ? Math.round(((withOwner + withVendor) / (total * 2)) * 100) : 0;
    return { total, withOwner, withVendor, completenessScore, gaps };
  }, [apps]);

  const scoredProcesses = useMemo(() => {
    return processes.map((p) => {
      const scores = computeAIScores(p);
      return { ...p, ...scores, quadrant: aiQuadrant(scores) };
    }).sort((a, b) => (b.opportunity - b.readiness * 0.01) - (a.opportunity - a.readiness * 0.01));
  }, [processes]);

  const topRecommendation = useMemo(
    () => scoredProcesses.find((p) => p.quadrant === "Automate Now"),
    [scoredProcesses]
  );

  // Redundancy: group apps by (capability, functional category) — more than
  // one app in the same group is a genuine overlap candidate, not just two
  // apps that happen to touch the same capability for different reasons.
  const redundancyGroups = useMemo(() => {
    const groups = {};
    apps.forEach((a) => {
      (a.capabilities || []).forEach((cap) => {
        const key = `${cap}::${a.category}`;
        (groups[key] = groups[key] || []).push(a);
      });
    });
    return Object.entries(groups)
      .filter(([, list]) => list.length > 1)
      .map(([key, list]) => {
        const [capability, category] = key.split("::");
        return { capability, category, apps: list };
      });
  }, [apps]);

  const scoredAppsForAITime = useMemo(() => {
    return appsWithDisposition.map((a) => {
      const scores = computeAITime(a);
      return { ...a, ...scores, aiQuadrant: aiTimeQuadrant(scores) };
    });
  }, [appsWithDisposition]);

  const AT_RISK_LIFECYCLES = new Set(["Approaching EOL", "EOL", "Unsupported"]);
  const LIFECYCLE_SEVERITY = { "EOL": 3, "Unsupported": 3, "Approaching EOL": 2, "Current": 0 };
  const atRiskTech = useMemo(() => {
    return depNodes
      .filter((n) => (n.type === "SoftwareTechnology" || n.type === "HardwareTechnology") && AT_RISK_LIFECYCLES.has(n.lifecycle))
      .map((n) => {
        const exposedIds = computeReachable(n.id, depLinks, "downstream");
        const exposedApps = [...exposedIds]
          .map((id) => depNodes.find((x) => x.id === id))
          .filter((x) => x && x.type === "Application")
          .map((x) => {
            const full = apps.find((a) => a.id === x.id);
            return full || { id: x.id, name: x.name, tco: null };
          });
        const tcoAtRisk = exposedApps.reduce((sum, a) => sum + (a.tco || 0), 0);
        return { ...n, exposedApps, tcoAtRisk };
      })
      .sort((a, b) => (LIFECYCLE_SEVERITY[b.lifecycle] || 0) - (LIFECYCLE_SEVERITY[a.lifecycle] || 0));
  }, [depNodes, depLinks, apps]);

  const totalAppsExposed = useMemo(() => {
    const ids = new Set();
    atRiskTech.forEach((t) => t.exposedApps.forEach((a) => ids.add(a.id)));
    return ids.size;
  }, [atRiskTech]);
  const totalTcoExposed = useMemo(() => {
    const ids = new Set();
    let sum = 0;
    atRiskTech.forEach((t) => t.exposedApps.forEach((a) => {
      if (!ids.has(a.id)) { ids.add(a.id); sum += a.tco || 0; }
    }));
    return sum;
  }, [atRiskTech]);

  // Cloud migration: illustrative rule-of-thumb multipliers per 6R disposition,
  // not a costed business case. Wave 1 (foundation) and wave 2 (dependent apps)
  // reuse atRiskTech directly rather than recomputing the dependency chain.
  const CLOUD_COST_MULTIPLIER = { Retain: 1, Rehost: 0.85, Replatform: 0.75, Replace: 0.65, Retire: 0, Refactor: 0.8 };
  const migrationWaves = useMemo(() => {
    const foundation = atRiskTech; // wave 1: on-prem infra flagged at-risk
    const dependentIds = new Set();
    foundation.forEach((t) => t.exposedApps.forEach((a) => dependentIds.add(a.id)));
    const dependentApps = appsWithDisposition.filter((a) => dependentIds.has(a.id));
    const standaloneApps = appsWithDisposition.filter((a) => a.hosting === "On-Prem" && !dependentIds.has(a.id));
    const withCloudCost = (a) => {
      const mult = CLOUD_COST_MULTIPLIER[a.disposition.code] ?? 0.8;
      const cloudTco = Math.round((a.tco || 0) * mult);
      return { ...a, cloudTco, savings: (a.tco || 0) - cloudTco };
    };
    return {
      foundation,
      dependentApps: dependentApps.map(withCloudCost),
      standaloneApps: standaloneApps.map(withCloudCost),
    };
  }, [atRiskTech, appsWithDisposition]);
  const totalMigrationSavings = useMemo(() => {
    return [...migrationWaves.dependentApps, ...migrationWaves.standaloneApps].reduce((s, a) => s + a.savings, 0);
  }, [migrationWaves]);

  const rankedBlockedDecisions = useMemo(() =>
    [...blockedDecisions].sort((a, b) => (b.cost || 0) - (a.cost || 0)),
    [blockedDecisions]);
  const blockingAppIds = useMemo(() => new Set(blockedDecisions.map((d) => d.appId)), [blockedDecisions]);
  // The actual payoff of this framework: which systems look bad on age/health
  // (6R says replace/replatform/retire) but, once you check, block nothing at all.
  const ageFlaggedNotBlocking = useMemo(() =>
    appsWithDisposition.filter((a) =>
      ["Replace", "Replatform", "Retire"].includes(a.disposition.code) && !blockingAppIds.has(a.id)
    ),
    [appsWithDisposition, blockingAppIds]);

  // Executive Brief: nothing computed here is new reasoning — it's the same
  // numbers already sitting in five separate tabs, added up and reframed as
  // cost/risk instead of as analytical technique, so it hits on login instead
  // of requiring five clicks to assemble by hand.
  const totalBlockedCost = useMemo(() =>
    rankedBlockedDecisions.reduce((s, d) => s + (d.cost || 0), 0),
    [rankedBlockedDecisions]);
  const redundancyWaste = useMemo(() =>
    redundancyGroups.reduce((sum, g) => {
      const retiring = g.apps.find((a) => a.status === "Retiring");
      const wasteApp = retiring || [...g.apps].sort((a, b) => (a.businessValue || 0) - (b.businessValue || 0))[0];
      return sum + (wasteApp ? (wasteApp.tco || 0) : 0);
    }, 0),
    [redundancyGroups]);
  const criticalNoDR = useMemo(() =>
    appsWithDisposition
      .filter((a) => a.criticality === "Critical")
      .map((a) => ({ app: a, dr: computeDRReadiness(a, controls, depLinks) }))
      .filter((x) => !x.dr.covered),
    [appsWithDisposition, controls, depLinks]);
  const totalAtStake = totalBlockedCost + redundancyWaste + totalTcoExposed;

  // Field-distribution reviews: same generic pattern (count the distribution,
  // flag values that look inconsistent with a correlated field), applied to
  // three different fields with three different, explainable consistency rules
  // — one reusable capability, not three bespoke ones.
  const SERVICE_TIER_EXPECTED = { Critical: "Platinum", High: "Gold", Medium: "Silver", Low: "Bronze" };
  const fieldReviews = useMemo(() => {
    const serviceLevel = { dist: {}, flagged: [] };
    const criticality = { dist: {}, flagged: [] };
    apps.forEach((a) => {
      if (a.serviceLevel) {
        serviceLevel.dist[a.serviceLevel] = (serviceLevel.dist[a.serviceLevel] || 0) + 1;
        const expected = SERVICE_TIER_EXPECTED[a.criticality];
        if (expected && a.serviceLevel !== expected) {
          serviceLevel.flagged.push({ id: a.id, name: a.name, value: a.serviceLevel,
            reason: `Criticality is ${a.criticality} (would suggest ${expected} support), but tagged ${a.serviceLevel}.` });
        }
      }
      if (a.criticality) {
        criticality.dist[a.criticality] = (criticality.dist[a.criticality] || 0) + 1;
        if (a.businessValue === 3 && (a.criticality === "Low" || a.criticality === "Medium")) {
          criticality.flagged.push({ id: a.id, name: a.name, value: a.criticality,
            reason: `Business value is High, but criticality is only ${a.criticality} — worth checking if this is under-rated.` });
        } else if (a.businessValue === 1 && a.criticality === "Critical") {
          criticality.flagged.push({ id: a.id, name: a.name, value: a.criticality,
            reason: `Business value is Low, but criticality is Critical — worth checking if this is over-rated.` });
        }
      }
    });
    const marketDifferentiation = { dist: {}, flagged: [] };
    capCoverage.forEach((c) => {
      if (!c.marketDifferentiation) return;
      marketDifferentiation.dist[c.marketDifferentiation] = (marketDifferentiation.dist[c.marketDifferentiation] || 0) + 1;
      if (c.marketDifferentiation === "High" && !["Critical", "High"].includes(c.importance)) {
        marketDifferentiation.flagged.push({ id: c.capability, name: c.capability, value: c.marketDifferentiation,
          reason: `Tagged as a market differentiator, but organisational importance is only ${c.importance} — is the differentiation claim real?` });
      }
    });
    return { serviceLevel, criticality, marketDifferentiation };
  }, [apps, capCoverage]);

  const capabilityRealization = useMemo(() => {
    return capCoverage.map((c) => {
      const realizingProcs = processes.filter((p) => p.capabilityName === c.capability);
      let health, reason;
      if (realizingProcs.length === 0) {
        health = "Not Realized"; reason = "No process realises this capability.";
      } else if (realizingProcs.every((p) => (p.supportingApps || []).length === 0)) {
        health = "Weakly Realized";
        reason = `Realized by ${realizingProcs.map((p) => p.name).join(", ")}, but no application supports ${realizingProcs.length === 1 ? "it" : "any of them"}.`;
      } else {
        health = "Realized";
        reason = `Realized by ${realizingProcs.map((p) => p.name).join(", ")}.`;
      }
      return { ...c, realizingProcs, health, reason };
    });
  }, [capCoverage, processes]);

  const radarData = useMemo(() => {
    const softwareTechs = technologies.filter((t) => t.type === "SoftwareTechnology");
    const categories = [...new Set(softwareTechs.map((t) => t.techCategory))];
    const segAngle = categories.length ? (2 * Math.PI) / categories.length : 0;
    const cx = 260, cy = 240;
    const items = softwareTechs.map((t) => {
      const catIdx = Math.max(0, categories.indexOf(t.techCategory));
      const ring = RADAR_RING_ORDER.includes(t.strategicClassification) ? t.strategicClassification : "Contained";
      const baseAngle = catIdx * segAngle + segAngle / 2 - Math.PI / 2;
      const jitter = ((t.id.charCodeAt(t.id.length - 1) % 10) - 5) * (segAngle / 14);
      const angle = baseAngle + jitter;
      const radiusJitter = ((t.id.length * 7) % 24) - 12;
      const r = RADAR_BAND_RADII[ring] + radiusJitter;
      return { ...t, ring, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    });
    return { categories, items, segAngle, cx, cy };
  }, [technologies]);

  // Decision shortlist: synthesises 6R + AI-TIME + AI Opportunity into a single
  // verdict per application, rather than making a CIO combine three tabs by hand.
  // Infra/plumbing categories don't inherit a shared capability's process
  // opportunity — Talend and PayPal support Fundraising, but the manual work
  // in "Poppy Appeal Collection" happens in the CRM and website, not in them.
  const INFRA_CATEGORIES = new Set(["Data Integration", "Payment Processing"]);
  const CRIT_WEIGHT = { Critical: 3, High: 2, Medium: 1, Low: 0.5 };
  const decisionShortlist = useMemo(() => {
    const relatedOpportunity = (app) => {
      if (INFRA_CATEGORIES.has(app.category)) return [];
      return scoredProcesses.filter((p) => app.capabilities.includes(p.capabilityName));
    };
    return scoredAppsForAITime.map((app) => {
      const relatedProcs = relatedOpportunity(app);
      const hasAutomateNow = relatedProcs.some((p) => p.quadrant === "Automate Now");
      let verdict, reason;
      if (app.disposition.code === "Retire") {
        verdict = "Retire"; reason = app.disposition.reason;
      } else if (app.aiQuadrant === "Prime Disruption Target") {
        verdict = "Replace"; reason = AI_TIME_INFO[app.aiQuadrant].desc;
      } else if (app.disposition.code === "Replace") {

          ? `${app.disposition.reason} — and the underlying process is a strong AI-augmentation candidate, so design the replacement AI-native rather than bolting AI onto what's there.`

      } else if (hasAutomateNow && (app.aiQuadrant === "Safe for Now" || app.aiQuadrant === "Watch Closely")) {
        verdict = "Augment";
        reason = `The process behind this system is manual/frequent/valuable enough to automate, but the application itself is healthy — augment the workflow, don't replace the system.`;
      } else {
        verdict = "Leave"; reason = "No AI-specific action indicated right now.";
      }
      const impactedProcesses = relatedProcs;
      const impactedTeams = [...new Set(impactedProcesses.flatMap((p) => orgsByProcess[p.id] || []))];
      const impactedRoles = [...new Set(impactedProcesses.flatMap((p) => (p.roles ? p.roles.split(",").map((r) => r.trim()) : [])))];

      const priority = (CRIT_WEIGHT[app.criticality] || 1) * (app.tco || 0);
      return { ...app, verdict, reason, impactedProcesses, impactedTeams, impactedRoles, impactedApps, priority };
