        setActiveCanvasId(null); setStickies([]); setCanvasConcepts([]); setCanvasEdges([]); setCanvasTexts([]); setShapes([]); setShapeEdges([]); setFreeArrows([]);
      }
    } catch (e) {
      setCanvasStatus(`Couldn't delete workspace: ${e.message}`);
    }
  };

  const pushToGraph = useCallback(async () => {
    const toPush = canvasConcepts.filter((c) => !c.pushed);
    if (toPush.length === 0) { setCanvasStatus("Nothing new to push."); setTimeout(() => setCanvasStatus(""), 1500); return; }
    setCanvasStatus("Pushing to graph…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const idMap = {};
      for (const c of toPush) {
        if (!CANVAS_CONCEPT_TYPES.includes(c.conceptType)) continue; // whitelist guard
        const realId = newCanvasId("canvas");
        const props = { id: realId, name: c.name, ...c.attributes };
        await runCypher(apiUrl, authHeader,
          `CREATE (n:Instance:${c.conceptType} $props)`,
          { props }
        );
        idMap[c.id] = realId;
      }
      const updatedConcepts = canvasConcepts.map((c) =>
        idMap[c.id] ? { ...c, pushed: true, realId: idMap[c.id] } : c
      );
      const updatedEdges = [...canvasEdges];
      for (let i = 0; i < updatedEdges.length; i++) {
        const e = updatedEdges[i];
        if (e.pushed) continue;
        const srcConcept = updatedConcepts.find((c) => c.id === e.sourceId);
        const tgtConcept = updatedConcepts.find((c) => c.id === e.targetId);
        const srcRealId = srcConcept && (srcConcept.realId || (srcConcept.pushed ? srcConcept.realId : null));
        const tgtRealId = tgtConcept && (tgtConcept.realId || (tgtConcept.pushed ? tgtConcept.realId : null));
        if (!srcRealId || !tgtRealId) continue;
        const relType = sanitizeVerbJS(e.verb);
        await runCypher(apiUrl, authHeader,
          `MATCH (a:Instance {id: $srcId}), (b:Instance {id: $tgtId}) MERGE (a)-[r:${relType}]->(b) SET r.type = $verb`,
          { srcId: srcRealId, tgtId: tgtRealId, verb: e.verb }
        );
        updatedEdges[i] = { ...e, pushed: true };
      }
      setCanvasConcepts(updatedConcepts);
      setCanvasEdges(updatedEdges);
      await saveCanvas(stickies, updatedConcepts, updatedEdges);
      setCanvasStatus(`Pushed ${toPush.length} concept${toPush.length === 1 ? "" : "s"} to the graph.`);
      handleRefresh();
    } catch (e) {
      setCanvasStatus(`Push failed: ${e.message}`);
    }
  }, [uri, username, password, canvasConcepts, canvasEdges, stickies, saveCanvas]);

  const loadImportOptions = async () => {
    setImportLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${importType}) RETURN n.id AS id, n.name AS name ORDER BY n.name`
      );
      setImportOptions(rows);
    } catch (e) {
      setCanvasStatus(`Browse failed: ${e.message}`);
    } finally {
      setImportLoading(false);
    }
  };

  const importFromGraph = async (opt) => {
    setShowImportPanel(false);
    setCanvasStatus("Importing…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const nodeRows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${importType} {id: $id}) RETURN properties(n) AS props`,
        { id: opt.id }
      );
      if (!nodeRows[0]) { setCanvasStatus("Not found."); return; }
      const { id, name, ...rest } = nodeRows[0].props;

      let mainConcept = canvasConcepts.find((c) => c.realId === opt.id);
      if (!mainConcept) {
        const center = canvasCenter();
        const mainName = name || opt.name;
        const mainH = estimateConceptHeight(mainName, CONCEPT_W, CONCEPT_H);
        const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - mainH / 2, allCanvasItems(), CONCEPT_W, mainH);
        mainConcept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: mainH, conceptType: importType, name: mainName, attributes: rest, pushed: true, realId: opt.id, zIndex: zCounterRef.current++ };
        setCanvasConcepts((prev) => [...prev, mainConcept]);
        setCanvasStatus(`Imported ${opt.name}. Click "Expand" on its card to pull in its relationships.`);
        setTimeout(() => setCanvasStatus(""), 3000);
      } else {
        setCanvasStatus(`${opt.name} is already on the canvas.`);
        setTimeout(() => setCanvasStatus(""), 2000);
      }
    } catch (e) {
      setCanvasStatus(`Import failed: ${e.message}`);
    }
  };

  // Opt-in, separate from import itself — pulls in a concept's 1-hop
  // relationships (both directions) only when the person explicitly asks for
  // it via the "Expand" button, rather than automatically on every import.
  const expandRelationships = async (concept) => {
    if (!concept.realId) return;
    setCanvasStatus("Expanding relationships…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const relRows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance {id: $id})-[r]->(m:Instance)
         RETURN type(r) AS verb, properties(m) AS m, [l IN labels(m) WHERE l <> 'Instance'][0] AS mType, 'out' AS direction
         UNION
         MATCH (n:Instance {id: $id})<-[r]-(m:Instance)
         RETURN type(r) AS verb, properties(m) AS m, [l IN labels(m) WHERE l <> 'Instance'][0] AS mType, 'in' AS direction`,
        { id: concept.realId }
      );

      const existingItems = allCanvasItems();
      const newConcepts = [];
      const newEdges = [];
      const angleStep = relRows.length ? (2 * Math.PI) / relRows.length : 0;

      relRows.forEach((row, i) => {
        let related = canvasConcepts.find((c) => c.realId === row.m.id) || newConcepts.find((c) => c.realId === row.m.id);
        if (!related) {
          const angle = i * angleStep;
          const { id: mId, name: mName, ...mRest } = row.m;
          const relatedName = mName || "Unnamed";
          const relatedH = estimateConceptHeight(relatedName, CONCEPT_W, CONCEPT_H);
          const desiredX = concept.x + Math.cos(angle) * 260, desiredY = concept.y + Math.sin(angle) * 260;
          const pos = findFreePosition(desiredX, desiredY,
            [...existingItems, ...newConcepts.map((c) => ({ x: c.x, y: c.y, w: CONCEPT_W, h: c.height || CONCEPT_H }))], CONCEPT_W, relatedH);
          related = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: relatedH, conceptType: row.mType, name: relatedName, attributes: mRest, pushed: true, realId: row.m.id, expandedFrom: concept.id, zIndex: zCounterRef.current++ };
          newConcepts.push(related);
        }
        const verb = desanitizeVerb(row.verb);
        const sourceId = row.direction === "out" ? concept.id : related.id;
        const targetId = row.direction === "out" ? related.id : concept.id;
        const dup = canvasEdges.some((e) => e.sourceId === sourceId && e.targetId === targetId && e.verb === verb) ||
          newEdges.some((e) => e.sourceId === sourceId && e.targetId === targetId && e.verb === verb);
        if (!dup) newEdges.push({ id: newCanvasId("edge"), sourceId, targetId, verb, pushed: true, expandedFrom: concept.id });
      });

      if (newConcepts.length) setCanvasConcepts((prev) => [...prev, ...newConcepts]);
      if (newEdges.length) setCanvasEdges((prev) => [...prev, ...newEdges]);
      setCanvasConcepts((prev) => prev.map((c) => c.id === concept.id ? { ...c, expanded: true } : c));
      setCanvasStatus(relRows.length === 0
        ? `${concept.name} has no relationships to expand.`
        : `Expanded ${concept.name}: ${relRows.length} relationship${relRows.length === 1 ? "" : "s"} added.`);
      setTimeout(() => setCanvasStatus(""), 2500);
    } catch (e) {
      setCanvasStatus(`Expand failed: ${e.message}`);
    }
  };

  // Undoes exactly what expandRelationships added for this concept, using the
  // expandedFrom tag — not a general "delete nearby stuff" operation.
  const collapseRelationships = (concept) => {
    setCanvasEdges((prevEdges) => {
      const remaining = prevEdges.filter((e) => e.expandedFrom !== concept.id);
      // Concepts tagged as created by this expansion get removed outright. But a
      // concept that already existed on canvas for some other reason — reused
      // via the dedup check in expandRelationships rather than freshly created —
      // never got tagged, so it wouldn't be caught by that filter alone. Catch it
      // here instead: if removing this expansion's edges leaves it with nothing
      // connecting it to anything, it's an orphan of this collapse either way.
      setCanvasConcepts((prevConcepts) => prevConcepts
        .filter((c) => c.expandedFrom !== concept.id)
        .filter((c) =>
          c.id === concept.id ||
          editingConceptId === c.id ||
          remaining.some((e) => e.sourceId === c.id || e.targetId === c.id)
        )
        .map((c) => c.id === concept.id ? { ...c, expanded: false } : c)
      );
      return remaining;
    });
  };

  const screenToCanvas = (clientX, clientY) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return {
      x: (clientX - rect.left - canvasOffset.x) / canvasScale,
      y: (clientY - rect.top - canvasOffset.y) / canvasScale,
    };
  };

  // Combined bounding boxes of every existing canvas object, for collision-aware placement.
  // Auto-arrange into a tree — a general utility on whatever's currently on
  // the canvas, not bespoke logic tied to any one feature. Levels nodes via
  // BFS from root (zero in-degree) concepts; disconnected pieces and cycles
  // just become extra roots rather than breaking the layout.
  const autoOrganizeCanvas = (overrideConcepts, overrideEdges) => {
    const concepts = overrideConcepts || canvasConcepts;
    const edges = overrideEdges || canvasEdges;
    const nodeIds = concepts.map((c) => c.id);
    if (nodeIds.length === 0) return;
    // Undirected adjacency — "drives" pointing one way and "invests in" pointing
    // the other shouldn't change which row something lands in. What matters for
    // layout is how many hops something is from where you started, not which
    // way the arrow happens to point.
    const neighbors = {};
    nodeIds.forEach((id) => { neighbors[id] = []; });
    edges.forEach((e) => {
      if (neighbors[e.sourceId] && neighbors[e.targetId]) {
        neighbors[e.sourceId].push(e.targetId);
        neighbors[e.targetId].push(e.sourceId);
      }
    });
    // Anchor = the node placed first (lowest zIndex), since that's the thing
    // the person actually started from and expanded outward from — not
    // whichever node happens to have no incoming edges.
    const sorted = [...concepts].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
    const anchor = sorted[0].id;

    const level = { [anchor]: 0 };
    const queue = [anchor];
    const visited = new Set();
    while (queue.length) {
      const id = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      (neighbors[id] || []).forEach((neighborId) => {
        if (!(neighborId in level)) { level[neighborId] = level[id] + 1; queue.push(neighborId); }
      });
    }
    // Anything not reachable from the anchor (a separate, disconnected cluster)
    // still needs a row — treat it as its own extra top row rather than
    // breaking the layout.
    nodeIds.forEach((id) => { if (!(id in level)) level[id] = 0; });

    const byLevel = {};
    nodeIds.forEach((id) => { (byLevel[level[id]] = byLevel[level[id]] || []).push(id); });

    const LEVEL_HEIGHT = 220, NODE_SPACING = 260, CENTER_X = 500;
    const newPos = {};
    Object.keys(byLevel).map(Number).sort((a, b) => a - b).forEach((l) => {
      const ids = byLevel[l];
      const startX = CENTER_X - (ids.length * NODE_SPACING) / 2;
      ids.forEach((id, i) => { newPos[id] = { x: startX + i * NODE_SPACING, y: 80 + l * LEVEL_HEIGHT }; });
    });
    setCanvasConcepts((prev) => (overrideConcepts || prev).map((c) => newPos[c.id] ? { ...c, x: newPos[c.id].x, y: newPos[c.id].y } : c));

    // Route edges to match the new tree — a straight line makes sense on a
    // freely-positioned canvas, but once everything's aligned into neat rows,
    // an org-chart-style elbow (down, across, down) reads much more clearly
    // than a fan of diagonals. This writes real waypoints using the same
    // manual-bend field the hover handles use — it doesn't change the global
    // default, only what Organize itself produces.
    const STUB = 40;
    setCanvasEdges((prev) => (overrideEdges || prev).map((e) => {
      const srcLevel = level[e.sourceId], tgtLevel = level[e.targetId];
      const srcPos = newPos[e.sourceId], tgtPos = newPos[e.targetId];
      if (srcLevel === undefined || tgtLevel === undefined || !srcPos || !tgtPos || srcLevel === tgtLevel) {
        return e; // same-row or partially-outside-selection edges are left as straight lines
      }
      const higherIsSource = srcLevel < tgtLevel;
      const higher = higherIsSource ? srcPos : tgtPos, lower = higherIsSource ? tgtPos : srcPos;
      const higherAnchor = "bottom", lowerAnchor = "top";
      const hCenterX = higher.x + CONCEPT_W / 2, hBottomY = higher.y + CONCEPT_H;
      const lCenterX = lower.x + CONCEPT_W / 2, lTopY = lower.y;
      const midY = hBottomY + (lTopY - hBottomY - STUB) / 2 + STUB / 2;
      // Waypoint order must follow the edge's actual source→target direction —
      // not always "higher node first" — or edges where the source happens to
      // be the physically lower node zigzag: jump to the other node's X, then
      // jump back, before finally heading to the target.
      const waypoints = higherIsSource
        ? [{ x: hCenterX, y: midY }, { x: lCenterX, y: midY }]
        : [{ x: lCenterX, y: midY }, { x: hCenterX, y: midY }];
      return { ...e, waypoints,
        sourceAnchor: higherIsSource ? higherAnchor : lowerAnchor,
        targetAnchor: higherIsSource ? lowerAnchor : higherAnchor };
    }));
  };

  const allCanvasItems = () => [
    ...stickies.map((s) => ({ x: s.x, y: s.y, w: s.width || 160, h: s.height || 120 })),
    ...canvasConcepts.map((c) => ({ x: c.x, y: c.y, w: c.width || CONCEPT_W, h: c.height || CONCEPT_H })),
    ...canvasTexts.map((t) => ({ x: t.x, y: t.y, w: t.width || 220, h: t.height || 80 })),
    ...shapes.map((s) => ({ x: s.x, y: s.y, w: s.width || 100, h: s.height || 90 })),
  ];
  const canvasCenter = () => {
    const rect = canvasRef.current.getBoundingClientRect();
    return screenToCanvas(rect.left + rect.width / 2, rect.top + rect.height / 2);
  };

  const addSticky = () => {
    const center = canvasCenter();
    const pos = findFreePosition(center.x - 80, center.y - 60, allCanvasItems(), 160, 120);
    setStickies((prev) => [...prev, {
      id: newCanvasId("sticky"), x: pos.x, y: pos.y, width: 160, height: 120, zIndex: zCounterRef.current++,
      text: "New idea", color: STICKY_COLORS[stickies.length % STICKY_COLORS.length],
    }]);
  };

  const addConcept = (conceptType) => {
    const center = canvasCenter();
    const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - CONCEPT_H / 2, allCanvasItems(), CONCEPT_W, CONCEPT_H);
    const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: CONCEPT_H, conceptType, name: `New ${conceptType}`, attributes: {}, pushed: false, zIndex: zCounterRef.current++ };
    setCanvasConcepts((prev) => [...prev, concept]);
    setEditingConceptId(concept.id);
  };

  const addText = () => {
    const center = canvasCenter();
    const pos = findFreePosition(center.x - 110, center.y - 40, allCanvasItems(), 220, 80);
    const text = {
      id: newCanvasId("text"), x: pos.x, y: pos.y, width: 220, height: 80, content: "Text", zIndex: zCounterRef.current++,
      fontSize: 16, color: COLORS.ink, bold: false, italic: false, align: "left", valign: "top",
    };
    setCanvasTexts((prev) => [...prev, text]);
    setEditingTextId(text.id);
  };

  const SHAPE_W = 92, SHAPE_H = 76;
  const SHAPE_CATEGORY_COLOR = { Basic: "#4A5A78", Cloud: "#2C7A8C", Network: "#5A6B99", Security: "#F0384D", Generic: "#7A6A73", BPM: "#0EA968" };

  const addShape = (category, shapeKey) => {
    const def = SHAPE_INDEX[shapeKey];
    if (!def) return;
    const center = canvasCenter();
    const pos = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, allCanvasItems(), SHAPE_W, SHAPE_H);
    setShapes((prev) => [...prev, {
      id: newCanvasId("shape"), x: pos.x, y: pos.y, width: SHAPE_W, height: SHAPE_H, zIndex: zCounterRef.current++,
      category, shapeKey, label: def.label,
    }]);
    setShowShapePalette(false);
  };
  // Turns a /canvas-chat plan (pulled real entities + new concepts/shapes/
  // stickies + connections) into actual canvas objects. Builds everything in
  // local arrays first rather than calling setState per item — React state
  // updates are async/batched, so checking collision against "what's already
  // on the canvas" via the live state mid-batch would miss items added
  // moments earlier in the same plan, causing overlaps.
  const executeCanvasPlan = async (plan) => {
    const localConcepts = [...canvasConcepts];
    const localShapes = [...shapes];
    const localStickies = [...stickies];
    const localCanvasEdges = [...canvasEdges];
    const localShapeEdges = [...shapeEdges];
    const idMap = {}, kindMap = {}; // tempId or "pull:i:j" -> real canvas id / which array it's in

    const occupied = () => [
      ...localConcepts.map((c) => ({ x: c.x, y: c.y, w: c.width || CONCEPT_W, h: c.height || CONCEPT_H })),
      ...localShapes.map((s) => ({ x: s.x, y: s.y, w: s.width || SHAPE_W, h: s.height || SHAPE_H })),
      ...localStickies.map((s) => ({ x: s.x, y: s.y, w: s.width || 160, h: s.height || 120 })),
    ];
    const center = canvasCenter();
    const apiUrl = deriveQueryApiUrl(uri, dbName);
    const authHeader = "Basic " + btoa(`${username}:${password}`);

    // 1. Real entities pulled from the graph — same shape as manual "Add From Graph"
    for (let i = 0; i < (plan.pulled || []).length; i++) {
      const rows = plan.pulled[i].rows || [];
      for (let j = 0; j < rows.length; j++) {
        const row = rows[j];
        if (!row.id || !row.name || !row.type) continue;
        const existing = localConcepts.find((c) => c.realId === row.id);
        if (existing) { idMap[`pull:${i}:${j}`] = existing.id; kindMap[`pull:${i}:${j}`] = "concept"; continue; }
        try {
          const nodeRows = await runCypher(apiUrl, authHeader, `MATCH (n:Instance:${row.type} {id: $id}) RETURN properties(n) AS props`, { id: row.id });
          if (!nodeRows[0]) continue;
          const { id: _id, name: realName, ...rest } = nodeRows[0].props;
          const finalName = realName || row.name;
          const h = estimateConceptHeight(finalName, CONCEPT_W, CONCEPT_H);
          const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - h / 2, occupied(), CONCEPT_W, h);
          const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: h,
            conceptType: row.type, name: finalName, attributes: rest, pushed: true, realId: row.id, zIndex: zCounterRef.current++ };
          localConcepts.push(concept);
          idMap[`pull:${i}:${j}`] = concept.id;
          kindMap[`pull:${i}:${j}`] = "concept";
        } catch (e) { /* skip this one, don't block the rest of the plan */ }
      }
    }

    // 2. New concepts/shapes/stickies — BPM shapes get a deliberate left-to-right
    // sequence since they're meant to read as a flow, not a scatter
    let bpmX = null, bpmY = null;
    (plan.create || []).forEach((item) => {
      if (item.kind === "concept" && CANVAS_CONCEPT_TYPES.includes(item.conceptType)) {
        const name = item.name || `New ${item.conceptType}`;
        const h = estimateConceptHeight(name, CONCEPT_W, CONCEPT_H);
        const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - h / 2, occupied(), CONCEPT_W, h);
        const attrs = {};
        Object.entries(item.attributes || {}).forEach(([k, v]) => { attrs[toSnakeCase(k)] = v; });
        const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: h,
          conceptType: item.conceptType, name, attributes: attrs, pushed: false, zIndex: zCounterRef.current++ };
        localConcepts.push(concept);
        idMap[item.tempId] = concept.id; kindMap[item.tempId] = "concept";
      } else if (item.kind === "shape" && SHAPE_INDEX[item.shapeKey]) {
        const def = SHAPE_INDEX[item.shapeKey];
        let pos;
        if (item.category === "BPM") {
          if (bpmX === null) { const s = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, occupied(), SHAPE_W, SHAPE_H); bpmX = s.x; bpmY = s.y; }
          else { bpmX += SHAPE_W + 60; }
          pos = { x: bpmX, y: bpmY };
        } else {
          pos = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, occupied(), SHAPE_W, SHAPE_H);
        }
        const shape = { id: newCanvasId("shape"), x: pos.x, y: pos.y, width: SHAPE_W, height: SHAPE_H,
          zIndex: zCounterRef.current++, category: item.category, shapeKey: item.shapeKey, label: item.label || def.label };
        localShapes.push(shape);
        idMap[item.tempId] = shape.id; kindMap[item.tempId] = "shape";
      } else if (item.kind === "sticky") {
        const pos = findFreePosition(center.x - 80, center.y - 60, occupied(), 160, 120);
        const sticky = { id: newCanvasId("sticky"), x: pos.x, y: pos.y, width: 160, height: 120,
          zIndex: zCounterRef.current++, text: item.text || "New idea", color: STICKY_COLORS[localStickies.length % STICKY_COLORS.length] };
        localStickies.push(sticky);
        idMap[item.tempId] = sticky.id; kindMap[item.tempId] = "sticky";
      }
    });

    // 3. Connections — concepts only connect to concepts (governed verb),
    // shapes only connect to shapes (free label); silently skipped if the
    // plan tried to cross the two, since there's no connector for that yet
    (plan.connections || []).forEach((conn) => {
      const fromId = idMap[conn.from], toId = idMap[conn.to];
      const fromKind = kindMap[conn.from], toKind = kindMap[conn.to];
      if (!fromId || !toId || fromKind !== toKind || fromId === toId) return;
      if (fromKind === "concept" && conn.kind === "concept") {
        localCanvasEdges.push({ id: newCanvasId("edge"), sourceId: fromId, targetId: toId, verb: conn.verb || "relates to",
          pushed: false, sourceAnchor: "right", targetAnchor: "left", waypoints: [] });
      } else if (fromKind === "shape" && conn.kind === "shape") {
        localShapeEdges.push({ id: newCanvasId("sedge"), sourceId: fromId, targetId: toId, label: conn.label || "",
          sourceAnchor: "right", targetAnchor: "left", waypoints: [] });
      }
    });

    setShapes(localShapes);
    setStickies(localStickies);
    setShapeEdges(localShapeEdges);
    setCanvasConcepts(localConcepts);
    setCanvasEdges(localCanvasEdges);
    // Pass the fresh local arrays explicitly rather than relying on state —
    // React hasn't necessarily re-rendered with the setState calls above yet.
    autoOrganizeCanvas(localConcepts, localCanvasEdges);
  };

  const sendCanvasChatMessage = async () => {
    const requestText = canvasChatInput.trim();
    if (!requestText || canvasChatLoading) return;
    setCanvasChatInput("");
    setCanvasChatLoading(true);
    try {
      const res = await fetch("http://localhost:5050/canvas-chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ request: requestText }),
      });
      if (!res.ok) throw new Error(`Chat backend returned ${res.status}`);
      const data = await res.json();
      if (data.error) { setCanvasChatLog((prev) => [...prev, { request: requestText, error: data.error }]); return; }
      await executeCanvasPlan(data);
      setCanvasChatLog((prev) => [...prev, { request: requestText, summary: data.summary }]);
    } catch (e) {
      setCanvasChatLog((prev) => [...prev, { request: requestText, error: `Couldn't reach the chat backend: ${e.message}. Is chat_server.py running on port 5050?` }]);
    } finally {
      setCanvasChatLoading(false);
    }
  };

  const deleteShape = (id) => {
    setShapes((prev) => prev.filter((s) => s.id !== id));
    setShapeEdges((prev) => prev.filter((e) => e.sourceId !== id && e.targetId !== id));
  };
  const deleteShapeEdge = (id) => setShapeEdges((prev) => prev.filter((e) => e.id !== id));
  const updateShapeLabel = (id, label) => setShapes((prev) => prev.map((s) => s.id === id ? { ...s, label } : s));

  const handleShapeHandleMouseDown = (e, shapeId, anchor) => {
    e.stopPropagation();
    const shape = shapes.find((s) => s.id === shapeId);
    const start = shape ? getAnchorPoint(shape, shape.width || SHAPE_W, shape.height || SHAPE_H, anchor) : screenToCanvas(e.clientX, e.clientY);
    setShapeConnectDrag({ sourceId: shapeId, sourceAnchor: anchor, x: start.x, y: start.y });
  };
  // Shape connections skip the ontology verb picker entirely — they're not
  // relationships in the graph, just a labeled line on a diagram — so this
  // just prompts for optional free text instead of opening a picker panel.
  const completeShapeConnect = (targetId, targetAnchor) => {
    if (!shapeConnectDrag || shapeConnectDrag.sourceId === targetId) { setShapeConnectDrag(null); return; }
    const label = window.prompt("Label this connection (optional):", "") || "";
    setShapeEdges((prev) => [...prev, { id: newCanvasId("sedge"), sourceId: shapeConnectDrag.sourceId, targetId, label,
      sourceAnchor: shapeConnectDrag.sourceAnchor, targetAnchor, waypoints: [] }]);
    setShapeConnectDrag(null);
  };

  // Freehand arrow: explicit Finish/Cancel rather than double-click detection —
  // a double-click involves two click events firing before the dblclick event,
  // which would either duplicate the final point or need extra bookkeeping to
  // suppress it. A Finish button sidesteps that whole class of timing issue.
  const startArrowDraw = () => { setArrowDrawMode(true); setArrowDraftPoints([]); setArrowPreviewPoint(null); };
  const addArrowDraftPoint = (point) => setArrowDraftPoints((prev) => [...prev, point]);
  const finishArrowDraw = () => {
    if (arrowDraftPoints.length >= 2) {
      setFreeArrows((prev) => [...prev, { id: newCanvasId("arrow"), points: arrowDraftPoints }]);
    }
    setArrowDrawMode(false); setArrowDraftPoints([]); setArrowPreviewPoint(null);
  };
  const cancelArrowDraw = () => { setArrowDrawMode(false); setArrowDraftPoints([]); setArrowPreviewPoint(null); };
  const deleteArrow = (id) => setFreeArrows((prev) => prev.filter((a) => a.id !== id));
  // Layering — z-index wasn't tracked at all before, stacking was just
  // accidental DOM order across four separate arrays. This treats every
  // canvas object as one combined stack regardless of type.
  const getAllLayeredObjects = () => [
    ...stickies.map((o) => ({ kind: "sticky", id: o.id, zIndex: o.zIndex || 0 })),
    ...canvasConcepts.map((o) => ({ kind: "concept", id: o.id, zIndex: o.zIndex || 0 })),
    ...canvasTexts.map((o) => ({ kind: "text", id: o.id, zIndex: o.zIndex || 0 })),
    ...shapes.map((o) => ({ kind: "shape", id: o.id, zIndex: o.zIndex || 0 })),
  ];
  const setObjectZIndex = (kind, id, z) => {
    const updater = (prev) => prev.map((o) => o.id === id ? { ...o, zIndex: z } : o);
    if (kind === "sticky") setStickies(updater);
    else if (kind === "concept") setCanvasConcepts(updater);
    else if (kind === "text") setCanvasTexts(updater);
    else if (kind === "shape") setShapes(updater);
  };
  const bringToFront = (kind, id) => {
    const all = getAllLayeredObjects();
    setObjectZIndex(kind, id, Math.max(0, ...all.map((o) => o.zIndex)) + 1);
  };
  const sendToBack = (kind, id) => {
    const all = getAllLayeredObjects();
    setObjectZIndex(kind, id, Math.min(0, ...all.map((o) => o.zIndex)) - 1);
  };
  const bringForward = (kind, id) => {
    const all = getAllLayeredObjects().sort((a, b) => a.zIndex - b.zIndex);
    const idx = all.findIndex((o) => o.kind === kind && o.id === id);
    if (idx === -1 || idx === all.length - 1) return;
    const next = all[idx + 1];
    setObjectZIndex(kind, id, next.zIndex);
    setObjectZIndex(next.kind, next.id, all[idx].zIndex);
  };
  const sendBackward = (kind, id) => {
    const all = getAllLayeredObjects().sort((a, b) => a.zIndex - b.zIndex);
    const idx = all.findIndex((o) => o.kind === kind && o.id === id);
    if (idx <= 0) return;
    const prevObj = all[idx - 1];
    setObjectZIndex(kind, id, prevObj.zIndex);
    setObjectZIndex(prevObj.kind, prevObj.id, all[idx].zIndex);
  };
  const openContextMenu = (e, kind, id) => {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, kind, id });
  };
  const closeContextMenu = () => setContextMenu(null);
  const contextMenuDelete = () => {
    if (!contextMenu) return;
    const { kind, id } = contextMenu;
    if (kind === "sticky") deleteSticky(id);
    else if (kind === "text") deleteText(id);
    else if (kind === "shape") deleteShape(id);
    else if (kind === "concept") { const c = canvasConcepts.find((x) => x.id === id); deleteConcept(id, c && c.pushed); }
    closeContextMenu();
  };

  const handleArrowPointMouseDown = (e, arrowId, pointIndex) => {
    e.stopPropagation();
    setDraggingArrowPoint({ arrowId, pointIndex });
  };
  // Grabbing the line itself (not a specific point) moves the whole arrow —
  // without this, the only way to reposition an arrow was to drag every
  // point individually, which isn't really "moving" it.
  const handleArrowLineMouseDown = (e, arrowId) => {
    e.stopPropagation();
    const arrow = freeArrows.find((a) => a.id === arrowId);
    if (!arrow) return;
    const point = screenToCanvas(e.clientX, e.clientY);
    setDraggingWholeArrow({ arrowId, startMouse: point, startPoints: arrow.points });
  };
  // Dragging a segment's midpoint inserts a real new point there and starts
  // reshaping from it immediately — this is how you route an existing arrow
  // around something without redrawing the whole thing from scratch.
  const handleArrowSegmentMouseDown = (e, arrowId, segmentIndex, midpoint) => {
    e.stopPropagation();
    setFreeArrows((prev) => prev.map((a) => {
      if (a.id !== arrowId) return a;
      const points = [...a.points];
      points.splice(segmentIndex + 1, 0, midpoint);
      return { ...a, points };
    }));
    setDraggingArrowPoint({ arrowId, pointIndex: segmentIndex + 1 });
  };

  // Same mechanism as free arrows, applied to concept/shape edges — lets a
  // person override the automatic elbow routing wherever it still isn't
  // good enough, rather than the system trying to guess obstacle avoidance.
  const handleEdgeWaypointMouseDown = (e, kind, edgeId, pointIndex) => {
    e.stopPropagation();
    setDraggingEdgeWaypoint({ kind, edgeId, pointIndex });
  };
  const handleEdgeSegmentMouseDown = (e, kind, edgeId, fullPath, segmentIndex, midpoint) => {
    e.stopPropagation();
    const setter = kind === "concept" ? setCanvasEdges : setShapeEdges;
    setter((prev) => prev.map((ed) => {
      if (ed.id !== edgeId) return ed;
      // Seed from the currently-displayed path (auto-elbow or existing manual
      // waypoints) so the first manual edit keeps the current shape instead
      // of jumping to a straight line.
      const currentInner = fullPath.slice(1, -1);
      const waypoints = [...currentInner];
      waypoints.splice(segmentIndex, 0, midpoint);
      return { ...ed, waypoints };
    }));
    setDraggingEdgeWaypoint({ kind, edgeId, pointIndex: segmentIndex });
  };
  const deleteEdgeWaypoint = (kind, edgeId, pointIndex) => {
    const setter = kind === "concept" ? setCanvasEdges : setShapeEdges;
    setter((prev) => prev.map((ed) => ed.id === edgeId ? { ...ed, waypoints: (ed.waypoints || []).filter((_, i) => i !== pointIndex) } : ed));
  };

  const deleteSticky = (id) => setStickies((prev) => prev.filter((s) => s.id !== id));
  const deleteText = (id) => { setCanvasTexts((prev) => prev.filter((t) => t.id !== id)); if (editingTextId === id) setEditingTextId(null); };
  const deleteConcept = (id, pushed) => {
    if (pushed && !window.confirm("This concept was already pushed to Neo4j. Removing it here only removes it from the canvas — the real node stays in the graph. Continue?")) return;
    setCanvasConcepts((prev) => prev.filter((c) => c.id !== id));
    setCanvasEdges((prev) => prev.filter((e) => e.sourceId !== id && e.targetId !== id));
    if (editingConceptId === id) setEditingConceptId(null);
  };
  const deleteEdge = (id) => setCanvasEdges((prev) => prev.filter((e) => e.id !== id));

  // Single entry point for the type picker regardless of what opened it — the
  // "+ Concept" button (no sticky context) and "Convert to Concept" on a sticky
  // (uses that sticky's position/text) now share the exact same experience,
  // instead of the sticky path silently defaulting to Application.
  const handleConceptTypeChosen = (conceptType) => {
    if (convertingStickyId) {
      const sticky = stickies.find((s) => s.id === convertingStickyId);
      if (sticky) {
        const trimmed = (sticky.text || "").trim();
        const conceptName = trimmed && trimmed !== "New idea" ? sticky.text : `New ${conceptType}`;
        const concept = { id: newCanvasId("concept"), x: sticky.x, y: sticky.y, width: CONCEPT_W, height: CONCEPT_H, conceptType, name: conceptName, attributes: {}, pushed: false, zIndex: zCounterRef.current++ };
        setStickies((prev) => prev.filter((s) => s.id !== convertingStickyId));
        setCanvasConcepts((prev) => [...prev, concept]);
        setEditingConceptId(concept.id);
      }
      setConvertingStickyId(null);
    } else {
      addConcept(conceptType);
    }
    setShowConceptPicker(false);
  };

  const handleCanvasMouseDown = (e) => {
    if (contextMenu) setContextMenu(null);
    if (e.target !== canvasRef.current && !e.target.dataset.canvasBg) return;
    if (arrowDrawMode) { addArrowDraftPoint(screenToCanvas(e.clientX, e.clientY)); return; }
    setDragState({ type: "pan", startMouse: { x: e.clientX, y: e.clientY }, startOffset: canvasOffset });
  };
  const handleItemMouseDown = (e, id) => {
    e.stopPropagation();
    const point = screenToCanvas(e.clientX, e.clientY);
    const item = stickies.find((s) => s.id === id) || canvasConcepts.find((c) => c.id === id) || canvasTexts.find((t) => t.id === id) || shapes.find((s) => s.id === id);
    if (!item) return;
    setDragState({ type: "item", id, startMouse: point, startPos: { x: item.x, y: item.y } });
  };
  const handleCanvasMouseMove = (e) => {
    if (draggingEdgeWaypoint) {
      const point = screenToCanvas(e.clientX, e.clientY);
      const setter = draggingEdgeWaypoint.kind === "concept" ? setCanvasEdges : setShapeEdges;
      setter((prev) => prev.map((ed) => ed.id === draggingEdgeWaypoint.edgeId
        ? { ...ed, waypoints: (ed.waypoints || []).map((p, i) => i === draggingEdgeWaypoint.pointIndex ? point : p) }
        : ed
      ));
      return;
    }
    if (draggingWholeArrow) {
      const point = screenToCanvas(e.clientX, e.clientY);
      const dx = point.x - draggingWholeArrow.startMouse.x, dy = point.y - draggingWholeArrow.startMouse.y;
      setFreeArrows((prev) => prev.map((a) => a.id === draggingWholeArrow.arrowId
        ? { ...a, points: draggingWholeArrow.startPoints.map((p) => ({ x: p.x + dx, y: p.y + dy })) }
        : a
      ));
      return;
    }
    if (draggingArrowPoint) {
      const point = screenToCanvas(e.clientX, e.clientY);
      setFreeArrows((prev) => prev.map((a) => a.id === draggingArrowPoint.arrowId
        ? { ...a, points: a.points.map((p, i) => i === draggingArrowPoint.pointIndex ? point : p) }
        : a
      ));
      return;
    }
    if (arrowDrawMode && arrowDraftPoints.length > 0) {
      setArrowPreviewPoint(screenToCanvas(e.clientX, e.clientY));
      return;
    }
    if (connectDrag) {
      const point = screenToCanvas(e.clientX, e.clientY);
      setConnectDrag((prev) => (prev ? { ...prev, x: point.x, y: point.y } : prev));
      return;
    }
    if (shapeConnectDrag) {
      const point = screenToCanvas(e.clientX, e.clientY);
      setShapeConnectDrag((prev) => (prev ? { ...prev, x: point.x, y: point.y } : prev));
      return;
    }
    if (resizeState) {
      const point = screenToCanvas(e.clientX, e.clientY);
      const dw = point.x - resizeState.startMouse.x, dh = point.y - resizeState.startMouse.y;
      const newW = Math.max(120, resizeState.startSize.w + dw);
      const newH = Math.max(70, resizeState.startSize.h + dh);
      if (resizeState.kind === "sticky") setStickies((prev) => prev.map((s) => s.id === resizeState.id ? { ...s, width: newW, height: newH } : s));
      else if (resizeState.kind === "concept") setCanvasConcepts((prev) => prev.map((c) => c.id === resizeState.id ? { ...c, width: newW, height: newH } : c));
      else if (resizeState.kind === "text") setCanvasTexts((prev) => prev.map((t) => t.id === resizeState.id ? { ...t, width: newW, height: newH } : t));
      else if (resizeState.kind === "shape") setShapes((prev) => prev.map((s) => s.id === resizeState.id ? { ...s, width: newW, height: newH } : s));
      return;
    }
    if (!dragState) return;
    if (dragState.type === "pan") {
      const dx = e.clientX - dragState.startMouse.x, dy = e.clientY - dragState.startMouse.y;
      setCanvasOffset({ x: dragState.startOffset.x + dx, y: dragState.startOffset.y + dy });
    } else if (dragState.type === "item") {
      const point = screenToCanvas(e.clientX, e.clientY);
      const dx = point.x - dragState.startMouse.x, dy = point.y - dragState.startMouse.y;
      const newX = dragState.startPos.x + dx, newY = dragState.startPos.y + dy;
      setStickies((prev) => prev.map((s) => (s.id === dragState.id ? { ...s, x: newX, y: newY } : s)));
      setCanvasConcepts((prev) => prev.map((c) => (c.id === dragState.id ? { ...c, x: newX, y: newY } : c)));
      setCanvasTexts((prev) => prev.map((t) => (t.id === dragState.id ? { ...t, x: newX, y: newY } : t)));
      setShapes((prev) => prev.map((s) => (s.id === dragState.id ? { ...s, x: newX, y: newY } : s)));
    }
  };
  const handleCanvasMouseUp = () => {
    if (draggingEdgeWaypoint) { setDraggingEdgeWaypoint(null); return; }
    if (draggingWholeArrow) { setDraggingWholeArrow(null); return; }
    if (draggingArrowPoint) { setDraggingArrowPoint(null); return; }
    if (connectDrag) {
      const hit = canvasConcepts.find((c) =>
        c.id !== connectDrag.sourceId &&
        connectDrag.x >= c.x && connectDrag.x <= c.x + (c.width || CONCEPT_W) &&
        connectDrag.y >= c.y && connectDrag.y <= c.y + (c.height || CONCEPT_H)
      );
      if (hit) {
        setConnectingFrom(connectDrag.sourceId);
        setPendingEdgeTarget(hit.id);
        setPendingSourceAnchor(connectDrag.sourceAnchor || "right");
        setPendingTargetAnchor(closestAnchor(hit, hit.width || CONCEPT_W, hit.height || CONCEPT_H, { x: connectDrag.x, y: connectDrag.y }));
      }
      setConnectDrag(null);
      return;
    }
    if (shapeConnectDrag) {
      const hit = shapes.find((s) =>
        s.id !== shapeConnectDrag.sourceId &&
        shapeConnectDrag.x >= s.x && shapeConnectDrag.x <= s.x + (s.width || SHAPE_W) &&
        shapeConnectDrag.y >= s.y && shapeConnectDrag.y <= s.y + (s.height || SHAPE_H)
      );
      if (hit) completeShapeConnect(hit.id, closestAnchor(hit, hit.width || SHAPE_W, hit.height || SHAPE_H, { x: shapeConnectDrag.x, y: shapeConnectDrag.y }));
      else setShapeConnectDrag(null);
      return;
    }
    if (resizeState) { setResizeState(null); return; }
    setDragState(null);
  };
  const handleCanvasWheel = (e) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    const cursorX = e.clientX - rect.left, cursorY = e.clientY - rect.top;
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.min(2.5, Math.max(0.3, canvasScale * factor));
    setCanvasOffset((prev) => ({
      x: cursorX - (cursorX - prev.x) * (newScale / canvasScale),
      y: cursorY - (cursorY - prev.y) * (newScale / canvasScale),
    }));
    setCanvasScale(newScale);
  };

  const [pendingEdgeTarget, setPendingEdgeTarget] = useState(null);
  const [pendingVerb, setPendingVerb] = useState("");
  const [pendingSourceAnchor, setPendingSourceAnchor] = useState(null);
  const [pendingTargetAnchor, setPendingTargetAnchor] = useState(null);
  const CONCEPT_W = 212, CONCEPT_H = 118; // wider/taller than the strict minimum — most 2-line titles fit without pushing the real card past this, keeping layout/collision/arrow-trim math roughly accurate
  const handleHandleMouseDown = (e, conceptId, anchor) => {
    e.stopPropagation();
    const concept = canvasConcepts.find((c) => c.id === conceptId);
    const start = concept ? getAnchorPoint(concept, concept.width || CONCEPT_W, concept.height || CONCEPT_H, anchor) : screenToCanvas(e.clientX, e.clientY);
    setConnectDrag({ sourceId: conceptId, sourceAnchor: anchor, x: start.x, y: start.y });
  };
  const handleResizeMouseDown = (e, id, kind, currentW, currentH) => {
    e.stopPropagation();
    const point = screenToCanvas(e.clientX, e.clientY);
    setResizeState({ id, kind, startMouse: point, startSize: { w: currentW, h: currentH } });
  };
  // Fix from the parameter, not a separate setState — the previous version called
  // setPendingVerb(v) then confirmEdge() in the same handler, which reads the OLD
  // value because React state updates are async. Passing verb directly sidesteps
  // that whole class of bug rather than relying on state timing.
  const confirmEdge = (verb) => {
    if (!connectingFrom || !pendingEdgeTarget || !verb) return;
    setCanvasEdges((prev) => [...prev, { id: newCanvasId("edge"), sourceId: connectingFrom, targetId: pendingEdgeTarget, verb, pushed: false,
      sourceAnchor: pendingSourceAnchor, targetAnchor: pendingTargetAnchor, waypoints: [] }]);
    setConnectingFrom(null); setPendingEdgeTarget(null); setPendingVerb(""); setPendingSourceAnchor(null); setPendingTargetAnchor(null);
  };
  const cancelEdge = () => {
    setConnectingFrom(null); setPendingEdgeTarget(null); setConnectDrag(null); setPendingVerb("");
    setPendingSourceAnchor(null); setPendingTargetAnchor(null);
  };
  // Swaps source/target (and their anchors, since anchor points are directional
  // too) without dropping the pending connection — used when the ontology only
  // defines the relationship the other way round, so "reverse it" is one click
  // instead of cancel-and-redraw-the-arrow-backwards.
  const reverseEdgeDirection = () => {
    setConnectingFrom(pendingEdgeTarget); setPendingEdgeTarget(connectingFrom);
    setPendingSourceAnchor(pendingTargetAnchor); setPendingTargetAnchor(pendingSourceAnchor);
    setPendingVerb("");
  };

  const EditFormFields = () => (
    <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 12 }}>
        <label style={{ fontSize: 12 }}>Owner
          <input value={editForm.owner} onChange={(e) => setEditForm({ ...editForm, owner: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }} />
        </label>
        <label style={{ fontSize: 12 }}>Vendor
          <input value={editForm.vendor} onChange={(e) => setEditForm({ ...editForm, vendor: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }} />
        </label>
        <label style={{ fontSize: 12 }}>Criticality
          <select value={editForm.criticality} onChange={(e) => setEditForm({ ...editForm, criticality: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
            {["Critical", "High", "Medium", "Low"].map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
        </label>
        <label style={{ fontSize: 12 }}>Hosting
          <select value={editForm.hosting} onChange={(e) => setEditForm({ ...editForm, hosting: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
            {["SaaS", "Cloud", "On-Prem"].map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
        </label>
        <label style={{ fontSize: 12 }}>Business Value
          <select value={editForm.businessValue} onChange={(e) => setEditForm({ ...editForm, businessValue: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
            <option value="1">Low</option><option value="2">Medium</option><option value="3">High</option>
          </select>
        </label>
        <label style={{ fontSize: 12 }}>Technical Health
          <select value={editForm.techHealth} onChange={(e) => setEditForm({ ...editForm, techHealth: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
            <option value="1">Poor</option><option value="2">Adequate</option><option value="3">Good</option>
          </select>
        </label>
        <label style={{ fontSize: 12 }}>Est. Annual TCO (£)
          <input type="number" value={editForm.tco} onChange={(e) => setEditForm({ ...editForm, tco: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }} />
        </label>
        <label style={{ fontSize: 12 }}>Architecture Style
          <select value={editForm.architectureStyle} onChange={(e) => setEditForm({ ...editForm, architectureStyle: e.target.value })}
            style={{ display: "block", width: "100%", marginTop: 4, padding: "6px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
            {["Traditional", "AI Agent", "Hybrid"].map((v) => <option key={v} value={v}>{v}</option>)}
          </select>
        </label>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <button onClick={saveEdit} disabled={editSaving}
          style={{ padding: "7px 16px", background: COLORS.ink, color: "#fff", border: "none",
            borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
          {editSaving ? "Saving…" : "Save to Neo4j"}
        </button>
        <button onClick={() => setEditingAppId(null)}
          style={{ padding: "7px 16px", background: "transparent", color: COLORS.inkSecondary,
            border: "none", fontSize: 12.5, cursor: "pointer" }}>Cancel</button>
        {editError && <span style={{ fontSize: 12, color: COLORS.risk }}>{editError}</span>}
      </div>
    </>
  );

  const VIEW_TITLES = {
    brief: "Executive Brief", portfolio: "Portfolio Overview", blocked: "Blocked Decisions",
    canvas: "Modelling Canvas",
    capboard: "Capability Board", dependencies: "Dependencies & Impact", health: "Portfolio Health",
    redundancy: "Redundancy", shortlist: "Decision Shortlist", ai: "AI Opportunity", aitime: "AI-TIME",
    obsolescence: "Tech Obsolescence", cloudmigration: "Cloud Migration", techradar: "Tech Radar",
    fieldreview: "Field Review", ontology: "Ontology Manager",

                          setConvertingStickyId(s.id); setShowConceptPicker(true);
                        }}
                        style={{ fontSize: 11, padding: "4px 8px", background: "rgba(255,255,255,0.6)", border: "none",
                          borderRadius: 6, cursor: "pointer", alignSelf: "flex-start", flexShrink: 0 }}>→ Convert to Concept</button>
                      <div onMouseDown={(e) => handleResizeMouseDown(e, s.id, "sticky", s.width || 160, s.height || 120)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: "2px solid rgba(28,42,58,0.35)", borderBottom: "2px solid rgba(28,42,58,0.35)" }} />
                    </div>
                  ))}

                  {canvasConcepts.map((c) => {
                    const style = CONCEPT_TYPE_STYLE[c.conceptType] || CONCEPT_TYPE_STYLE.Application;
                    const cw = c.width || CONCEPT_W, ch = c.height || CONCEPT_H;
                    return (
                    <div key={c.id}
                      onMouseDown={(e) => handleItemMouseDown(e, c.id)} onContextMenu={(e) => openContextMenu(e, "concept", c.id)}
                      style={{ position: "absolute", left: c.x, top: c.y, width: cw, minHeight: ch, zIndex: c.zIndex || 0,
                        background: "#fff", borderRadius: 12, padding: 12, overflow: "visible",
                        borderTop: `4px solid ${style.color}`,
                        borderLeft: `1px solid ${COLORS.border}`, borderRight: `1px solid ${COLORS.border}`, borderBottom: `1px solid ${COLORS.border}`,
                        boxShadow: "0 6px 18px rgba(10,14,26,0.14)", cursor: "grab" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <div style={{ width: 22, height: 22, borderRadius: 6, background: style.color,
                            display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{style.icon}</div>
                          <span style={{ fontSize: 10, fontWeight: 700, color: style.color, textTransform: "uppercase", letterSpacing: "0.03em" }}>{c.conceptType}</span>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          {c.pushed && <span style={{ fontSize: 9, background: "#DCEAE1", color: COLORS.accent, padding: "1px 6px", borderRadius: 5, fontWeight: 700 }}>PUSHED</span>}
                          <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteConcept(c.id, c.pushed)}
                            style={{ cursor: "pointer", fontSize: 12, color: "rgba(28,42,58,0.4)" }}>✕</span>
                        </div>
                      </div>
                      <div style={{ fontSize: 13, fontWeight: 600, margin: "4px 0" }}>{c.name}</div>
                      <div style={{ fontSize: 10.5, color: COLORS.inkSecondary, marginBottom: 6 }}>
                        {Object.values(c.attributes || {}).filter((v) => v).length} attribute{Object.values(c.attributes || {}).filter((v) => v).length === 1 ? "" : "s"} set
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onMouseDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setEditingConceptId(c.id); }}
                          style={{ fontSize: 10.5, padding: "3px 8px", background: "#EFEDE5", border: "none", borderRadius: 5, cursor: "pointer" }}>Edit</button>
                        {c.realId && (
                          <button onMouseDown={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); c.expanded ? collapseRelationships(c) : expandRelationships(c); }}
                            title={c.expanded ? "Remove the relationships this pulled in" : "Pull in this concept's real relationships from the graph"}
                            style={{ fontSize: 10.5, padding: "3px 8px", background: c.expanded ? "#F0C4B4" : "#DCEAE1",
                              color: c.expanded ? "#8A4A2E" : COLORS.accent, border: "none", borderRadius: 5, cursor: "pointer" }}>
                            {c.expanded ? "Collapse" : "Expand"}
                          </button>
                        )}
                      </div>

                      {/* Four connector handles (top/right/bottom/left) instead of one — lets a
                          diagram leave from whichever side actually makes sense visually. */}
                      {ANCHOR_SIDES.map((anchor) => {
                        const posStyle = anchor === "top" ? { top: -8, left: "50%", transform: "translateX(-50%)" }
                          : anchor === "bottom" ? { bottom: -8, left: "50%", transform: "translateX(-50%)" }
                          : anchor === "left" ? { left: -8, top: "50%", transform: "translateY(-50%)" }
                          : { right: -8, top: "50%", transform: "translateY(-50%)" };
                        return (
                          <div key={anchor} onMouseDown={(e) => handleHandleMouseDown(e, c.id, anchor)}
                            title="Drag to another concept to connect them"
                            style={{ position: "absolute", ...posStyle, width: 15, height: 15, borderRadius: "50%",
                              background: style.color, border: "2px solid #fff", boxShadow: "0 1px 4px rgba(28,42,58,0.35)", cursor: "crosshair" }} />
                        );
                      })}

                      {/* Resize grip — bottom-right corner, separate mousedown from the card-move drag. */}
                      <div onMouseDown={(e) => handleResizeMouseDown(e, c.id, "concept", cw, ch)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: `2px solid ${COLORS.border}`, borderBottom: `2px solid ${COLORS.border}` }} />
                    </div>
                    );
                  })}

                  {canvasTexts.map((t) => (
                    <div key={t.id} onMouseDown={(e) => handleItemMouseDown(e, t.id)} onContextMenu={(e) => openContextMenu(e, "text", t.id)}
                      onDoubleClick={() => setEditingTextId(t.id)}
                      style={{ position: "absolute", left: t.x, top: t.y, width: t.width, height: t.height, zIndex: t.zIndex || 0,
                        display: "flex", flexDirection: "column",
                        justifyContent: t.valign === "middle" ? "center" : t.valign === "bottom" ? "flex-end" : "flex-start",
                        cursor: "grab", padding: 6, border: `1px dashed transparent` }}>
                      <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteText(t.id)}
                        style={{ position: "absolute", top: -4, right: -4, cursor: "pointer", fontSize: 11,
                          color: "rgba(28,42,58,0.4)", background: "#F3F4F7", borderRadius: "50%", width: 16, height: 16,
                          display: "flex", alignItems: "center", justifyContent: "center" }}>✕</span>
                      <div style={{ fontSize: t.fontSize, color: t.color, fontWeight: t.bold ? 700 : 400,
                        fontStyle: t.italic ? "italic" : "normal", textAlign: t.align, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {t.content}
                      </div>
                      <div onMouseDown={(e) => handleResizeMouseDown(e, t.id, "text", t.width, t.height)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: "2px solid rgba(28,42,58,0.25)", borderBottom: "2px solid rgba(28,42,58,0.25)" }} />
                    </div>
                  ))}

                  {shapes.map((s) => {
                    const def = SHAPE_INDEX[s.shapeKey];
                    const color = SHAPE_CATEGORY_COLOR[s.category] || COLORS.inkSecondary;
                    const sw = s.width || SHAPE_W, sh = s.height || SHAPE_H;
                    const isBasic = def && def.renderMode === "basic";
                    return (
                      <div key={s.id} onMouseDown={(e) => handleItemMouseDown(e, s.id)} onContextMenu={(e) => openContextMenu(e, "shape", s.id)}
                        style={{ position: "absolute", left: s.x, top: s.y, width: sw, height: sh, zIndex: s.zIndex || 0,
                          display: "flex", flexDirection: isBasic ? undefined : "column", alignItems: "center", justifyContent: "center",
                          cursor: "grab", padding: isBasic ? 0 : 6 }}>
                        <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteShape(s.id)}
                          style={{ position: "absolute", top: -2, right: -2, cursor: "pointer", fontSize: 11,
                            color: "rgba(28,42,58,0.4)", background: "#F3F4F7", borderRadius: "50%", width: 16, height: 16,
                            display: "flex", alignItems: "center", justifyContent: "center", zIndex: 2 }}>✕</span>

                        {isBasic ? (
                          <>
                            <svg width={sw} height={sh} style={{ position: "absolute", left: 0, top: 0 }}>
                              {renderBasicShapeSvg(s.shapeKey, sw, sh, color)}
                            </svg>
                            <input value={s.label} onMouseDown={(e) => e.stopPropagation()}
                              onChange={(e) => updateShapeLabel(s.id, e.target.value)}
                              style={{ position: "relative", width: "80%", textAlign: "center", fontSize: 11.5, fontWeight: 500,
                                color: COLORS.ink, background: "transparent", border: "none", outline: "none", zIndex: 1 }} />
                          </>
                        ) : (
                          <>
                            <div style={{ color, flexShrink: 0, transform: `scale(${Math.min(sw, sh) / 76})`, transformOrigin: "center" }}>{def ? def.icon : null}</div>
                            <input value={s.label} onMouseDown={(e) => e.stopPropagation()}
                              onChange={(e) => updateShapeLabel(s.id, e.target.value)}
                              style={{ width: "100%", textAlign: "center", fontSize: 10.5, fontWeight: 500, color: COLORS.ink,
                                background: "transparent", border: "none", outline: "none", marginTop: 4 }} />
                          </>
                        )}

                        {ANCHOR_SIDES.map((anchor) => {
                          const posStyle = anchor === "top" ? { top: -7, left: "50%", transform: "translateX(-50%)" }
                            : anchor === "bottom" ? { bottom: -7, left: "50%", transform: "translateX(-50%)" }
                            : anchor === "left" ? { left: -7, top: "50%", transform: "translateY(-50%)" }
                            : { right: -7, top: "50%", transform: "translateY(-50%)" };
                          return (
                            <div key={anchor} onMouseDown={(e) => handleShapeHandleMouseDown(e, s.id, anchor)}
                              title="Drag to another shape to connect them"
                              style={{ position: "absolute", ...posStyle, width: 13, height: 13, borderRadius: "50%",
                                background: color, border: "2px solid #fff", boxShadow: "0 1px 4px rgba(28,42,58,0.35)", cursor: "crosshair" }} />
                          );
                        })}
                        <div onMouseDown={(e) => handleResizeMouseDown(e, s.id, "shape", sw, sh)}
                          title="Drag to resize"
                          style={{ position: "absolute", right: 2, bottom: 2, width: 12, height: 12, cursor: "nwse-resize",
                            borderRight: "2px solid rgba(28,42,58,0.2)", borderBottom: "2px solid rgba(28,42,58,0.2)" }} />
                      </div>
                    );
                  })}
                </div>
              </div>

              {contextMenu && (() => {
                const menuItemStyle = { display: "block", width: "100%", textAlign: "left", padding: "7px 12px",
                  fontSize: 12.5, background: "transparent", border: "none", cursor: "pointer", color: COLORS.ink, borderRadius: 6 };
                return (
                  <div style={{ position: "fixed", left: contextMenu.x, top: contextMenu.y, background: COLORS.card,
                    border: `1px solid ${COLORS.border}`, boxShadow: "0 16px 40px rgba(10,14,26,0.2)", borderRadius: 12,
                    padding: 4, zIndex: 100, width: 190 }}>
                    {(contextMenu.kind === "concept" || contextMenu.kind === "text") && (
                      <>
                        <button style={menuItemStyle} onClick={() => {
                            if (contextMenu.kind === "concept") setEditingConceptId(contextMenu.id);
                            else setEditingTextId(contextMenu.id);
                            closeContextMenu();
                          }}>Edit</button>
                        <div style={{ height: 1, background: COLORS.border, margin: "3px 0" }} />
                      </>
                    )}
                    <button style={menuItemStyle} onClick={() => { bringToFront(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Bring to Front</button>
                    <button style={menuItemStyle} onClick={() => { bringForward(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Bring Forward</button>
                    <button style={menuItemStyle} onClick={() => { sendBackward(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Send Backward</button>
                    <button style={menuItemStyle} onClick={() => { sendToBack(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Send to Back</button>
                    <div style={{ height: 1, background: COLORS.border, margin: "3px 0" }} />
                    <button style={{ ...menuItemStyle, color: COLORS.risk }} onClick={contextMenuDelete}>Delete</button>
                  </div>
                );
              })()}

              {pendingEdgeTarget && (() => {
                const srcConcept = canvasConcepts.find((c) => c.id === connectingFrom);
                const tgtConcept = canvasConcepts.find((c) => c.id === pendingEdgeTarget);
                const validRels = schemaRelationships.filter((r) =>
                  srcConcept && tgtConcept && r.source === srcConcept.conceptType && r.target === tgtConcept.conceptType
                );
                const validVerbs = validRels.map((r) => r.verb);
                const effectiveVerb = validVerbs.includes(pendingVerb) ? pendingVerb : (validVerbs[0] || "");
                // Only computed when the direct pairing has no valid verb — this is the
                // "self-healing" path: check whether swapping direction works, and if
                // not, surface what actually IS connectable from/to each side so the
                // user can course-correct instead of hitting a dead end.
                const reverseRels = validVerbs.length === 0 && srcConcept && tgtConcept
                  ? schemaRelationships.filter((r) => r.source === tgtConcept.conceptType && r.target === srcConcept.conceptType)
                  : [];
                const outboundTargets = validVerbs.length === 0 && srcConcept
                  ? [...new Set(schemaRelationships.filter((r) => r.source === srcConcept.conceptType).map((r) => `${r.verb} → ${humanizeLabel(r.target)}`))]
                  : [];
                const inboundSources = validVerbs.length === 0 && tgtConcept
                  ? [...new Set(schemaRelationships.filter((r) => r.target === tgtConcept.conceptType).map((r) => `${humanizeLabel(r.source)} → ${r.verb}`))]
                  : [];
                const rect = canvasRef.current ? canvasRef.current.getBoundingClientRect() : { left: 0, top: 0 };
                const panelLeft = srcConcept && tgtConcept
                  ? rect.left + canvasOffset.x + ((srcConcept.x + tgtConcept.x) / 2 + CONCEPT_W / 2) * canvasScale
                  : rect.left + 40;
                const panelTop = srcConcept && tgtConcept
                  ? rect.top + canvasOffset.y + ((srcConcept.y + tgtConcept.y) / 2 + CONCEPT_H / 2) * canvasScale
                  : rect.top + 40;
                const panelWidth = validVerbs.length === 0 && (outboundTargets.length || inboundSources.length) ? 360 : 280;
                return (
                  <div style={{ position: "fixed", left: Math.min(panelLeft, window.innerWidth - panelWidth - 20), top: Math.max(panelTop - 60, 80),
                    background: COLORS.card, border: `1px solid ${COLORS.border}`,
                    boxShadow: "0 16px 40px rgba(10,14,26,0.18)", borderRadius: 14, padding: 16, zIndex: 50, width: panelWidth,
                    maxHeight: "70vh", overflowY: "auto" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>
                      {srcConcept && tgtConcept ? `${humanizeLabel(srcConcept.conceptType)} → ${humanizeLabel(tgtConcept.conceptType)}` : "Choose a verb"}
                    </div>
                    {validVerbs.length === 0 ? (
                      <>
                        <div style={{ fontSize: 12, color: COLORS.ink, lineHeight: 1.5, marginBottom: 12 }}>
                          Your ontology doesn't define <b>{srcConcept && humanizeLabel(srcConcept.conceptType)}</b> → <b>{tgtConcept && humanizeLabel(tgtConcept.conceptType)}</b>.
                        </div>

                        {reverseRels.length > 0 && (
                          <div style={{ background: `${COLORS.accent}14`, border: `1px solid ${COLORS.accent}44`, borderRadius: 10,
                            padding: 10, marginBottom: 12 }}>
                            <div style={{ fontSize: 11.5, color: COLORS.ink, lineHeight: 1.5, marginBottom: 8 }}>
                              But the reverse direction is — <b>{humanizeLabel(tgtConcept.conceptType)}</b> can {reverseRels.map((r) => `"${r.verb}"`).join(" or ")} <b>{humanizeLabel(srcConcept.conceptType)}</b>.
                            </div>
                            <button onClick={reverseEdgeDirection}
                              style={{ width: "100%", padding: "7px", background: COLORS.accent, color: "#fff",
                                border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                              ↺ Reverse & Connect
                            </button>
                          </div>
                        )}

                        {(outboundTargets.length > 0 || inboundSources.length > 0) && (
                          <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 12 }}>
                            {outboundTargets.length > 0 && (
                              <div style={{ marginBottom: 10 }}>
                                <b style={{ color: COLORS.ink, fontSize: 11.5 }}>{humanizeLabel(srcConcept.conceptType)} can connect to:</b>
                                <ul style={{ margin: "4px 0 0", paddingLeft: 16, lineHeight: 1.5 }}>
                                  {outboundTargets.map((t) => <li key={t}>{t}</li>)}
                                </ul>
                              </div>
                            )}
                            {inboundSources.length > 0 && (
                              <div>
                                <b style={{ color: COLORS.ink, fontSize: 11.5 }}>{humanizeLabel(tgtConcept.conceptType)} can be connected from:</b>
                                <ul style={{ margin: "4px 0 0", paddingLeft: 16, lineHeight: 1.5 }}>
                                  {inboundSources.map((s) => <li key={s}>{s}</li>)}
                                </ul>
                              </div>
                            )}
                          </div>
                        )}

                        {reverseRels.length === 0 && outboundTargets.length === 0 && inboundSources.length === 0 && (
                          <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, lineHeight: 1.5, marginBottom: 12 }}>
                            Neither type has any defined relationship in either direction — this may be a genuine
                            gap in bdcore_schema.yaml rather than just the wrong pairing.
                          </div>
                        )}

                        <button onClick={cancelEdge}
                          style={{ width: "100%", padding: "7px", background: "transparent", color: COLORS.inkSecondary,
                            border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Close</button>
                      </>
                    ) : (
                      <>
                        <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 8 }}>
                          {validVerbs.length} verb{validVerbs.length === 1 ? "" : "s"} valid for this pairing in your ontology.
                        </div>
                        <select value={effectiveVerb} onChange={(e) => setPendingVerb(e.target.value)}
                          style={{ width: "100%", padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5, marginBottom: 10 }}>
                          {validVerbs.map((v) => <option key={v} value={v}>{v}</option>)}
                        </select>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => confirmEdge(effectiveVerb)} style={{ flex: 1, padding: "7px", background: COLORS.ink, color: "#fff",
                            border: "none", borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Confirm</button>
                          <button onClick={cancelEdge}
                            style={{ flex: 1, padding: "7px", background: "transparent", color: COLORS.inkSecondary,
                              border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })()}

              {editingConceptId && (() => {
                const c = canvasConcepts.find((x) => x.id === editingConceptId);
                if (!c) return null;
                const updateConcept = (patch) => setCanvasConcepts((prev) => prev.map((x) => x.id === c.id ? { ...x, ...patch } : x));
                const setAttr = (schemaName, value) => {
                  const key = toSnakeCase(schemaName);
                  updateConcept({ attributes: { ...c.attributes, [key]: value } });
                };
                const availableAttrs = schemaAttributes[c.conceptType] || [];
                return (
                  <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: 340, background: COLORS.card,
                    borderLeft: `1px solid ${COLORS.border}`, boxShadow: "-12px 0 32px rgba(10,14,26,0.12)", padding: 22,
                    zIndex: 60, overflowY: "auto" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>Edit Concept</div>
                      <span onClick={() => setEditingConceptId(null)} style={{ cursor: "pointer", color: COLORS.inkSecondary }}>✕</span>
                    </div>
                    <label style={{ fontSize: 12, display: "block", marginBottom: 12 }}>Concept Type
                      <select value={c.conceptType} onChange={(e) => updateConcept({ conceptType: e.target.value, attributes: {} })}
                        disabled={c.pushed}
                        style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
                        {groupConceptTypesByCategory(CANVAS_CONCEPT_TYPES).map((group) => (
                          <optgroup key={group.key} label={group.label}>
                            {group.types.map((t) => <option key={t} value={t}>{humanizeLabel(t)}</option>)}
                          </optgroup>
                        ))}
                      </select>
                    </label>
                    <label style={{ fontSize: 12, display: "block", marginBottom: 18 }}>Name
                      <input value={c.name} onChange={(e) => updateConcept({ name: e.target.value })}
                        style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }} />
                    </label>
                    <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 2 }}>Attributes</div>
                    <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 10 }}>
                      Pulled directly from your schema for {c.conceptType} — leave any blank to skip them.
                    </div>
                    {availableAttrs.length === 0 ? (
                      <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, marginBottom: 16 }}>
                        No attribute definitions found for this type — make sure load_schema.py has been run.
                      </div>
                    ) : availableAttrs.map((attr) => {
                      const key = toSnakeCase(attr.name);
                      const isMulti = attr.type === "multi_enum";
                      const value = isMulti ? (Array.isArray((c.attributes || {})[key]) ? (c.attributes || {})[key] : []) : ((c.attributes || {})[key] || "");
                      const toggleMultiValue = (opt) => {
                        const current = Array.isArray((c.attributes || {})[key]) ? (c.attributes || {})[key] : [];
                        const next = current.includes(opt) ? current.filter((v) => v !== opt) : [...current, opt];
                        setAttr(attr.name, next);
                      };
                      return (
                        <label key={attr.name} style={{ fontSize: 11.5, display: "block", marginBottom: 10 }}>
                          {humanizeLabel(attr.name)}
                          {isMulti && attr.options ? (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 4 }}>
                              {attr.options.map((o) => (
                                <span key={o} onClick={() => toggleMultiValue(o)}
                                  style={{ fontSize: 11, padding: "3px 9px", borderRadius: 6, cursor: "pointer",
                                    border: `1px solid ${value.includes(o) ? COLORS.ink : COLORS.border}`,
                                    background: value.includes(o) ? COLORS.ink : "#fff",
                                    color: value.includes(o) ? "#fff" : COLORS.ink }}>
                                  {o}
                                </span>
                              ))}
                            </div>
                          ) : attr.type === "enum" && attr.options ? (
                            <select value={value} onChange={(e) => setAttr(attr.name, e.target.value)}
                              style={{ display: "block", width: "100%", marginTop: 3, padding: "6px 7px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12 }}>
                              <option value="">—</option>
                              {attr.options.map((o) => <option key={o} value={o}>{o}</option>)}
                            </select>
                          ) : (
                            <input value={value} onChange={(e) => setAttr(attr.name, e.target.value)}
                              style={{ display: "block", width: "100%", marginTop: 3, padding: "6px 7px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12 }} />
                          )}
                        </label>
                      );
                    })}
                    {c.pushed && (
                      <div style={{ fontSize: 11.5, color: COLORS.accent, background: "#DCEAE1", padding: "8px 10px", borderRadius: 6, marginTop: 8 }}>
                        Already pushed to the graph. Concept type is locked; name/attributes here are canvas-only until re-pushed.
                      </div>
                    )}
                  </div>
                );
              })()}

              {editingTextId && (() => {
                const t = canvasTexts.find((x) => x.id === editingTextId);
                if (!t) return null;
                const update = (patch) => setCanvasTexts((prev) => prev.map((x) => x.id === t.id ? { ...x, ...patch } : x));

                      </div>
                    </label>

            </div>
          )}

          {view === "profile" && (() => {
            const app = apps.find((a) => a.id === profileAppId);
            if (!app) return <div style={{ fontSize: 13, color: COLORS.inkSecondary }}>Application not found — try refreshing.</div>;
            const stageIdx = currentLifecycleStage(app);
            const daysSinceGoLive = app.activeDate ? Math.round((new Date() - new Date(app.activeDate)) / 86400000) : null;
            const br = computeBlastRadius(app, apps, depLinks, depNodes, processes, orgsByProcess, controls);
            const dispo = computeDisposition(app);
            return (
              <div style={{ maxWidth: 820 }}>

                </div>

                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",
                  borderRadius: 18, padding: 22, marginBottom: 20 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                    <div>
                      <div style={{ fontSize: 13, color: COLORS.inkSecondary, fontWeight: 500 }}>{app.category} · {app.hosting}</div>
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => setShowRationalization(!showRationalization)}
                        style={{ padding: "8px 14px", background: showRationalization ? "#2C3B4E" : COLORS.card,
                          color: showRationalization ? "#fff" : COLORS.ink, border: `1px solid ${COLORS.border}`,
                          borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>

                          borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>

                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <span style={{ background: app.status === "Retiring" ? "#FBE0D8" : "#DCEAE1",

                    <span style={{ background: DISPOSITION_INFO[dispo.code].color, color: "#fff",
