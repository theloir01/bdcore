                          <span key={c} onClick={() => setStickies((prev) => prev.map((x) => x.id === s.id ? { ...x, color: c } : x))}
                            style={{ width: 12, height: 12, borderRadius: "50%", background: c, cursor: "pointer",
                              border: c === s.color ? `1.5px solid ${COLORS.ink}` : "1.5px solid rgba(28,42,58,0.15)" }} />
                        ))}
                      </div>
                      <textarea value={s.text}
                        onChange={(e) => setStickies((prev) => prev.map((x) => x.id === s.id ? { ...x, text: e.target.value } : x))}
                        style={{ background: "transparent", border: "none", resize: "none", fontSize: 12.5, fontFamily: "inherit",
                          width: "100%", flex: 1, outline: "none" }} />
                      <button onMouseDown={(e) => e.stopPropagation()} onClick={() => {
                          const rect = canvasRef.current.getBoundingClientRect();
                          setConceptPickerPos({
                            left: rect.left + canvasOffset.x + (s.x + (s.width || 160) + 12) * canvasScale,
                            top: rect.top + canvasOffset.y + s.y * canvasScale,
                          });
                          setConvertingStickyId(s.id); setShowConceptPicker(true);
                        }}
                        style={{ fontSize: 11, padding: "4px 8px", background: "rgba(255,255,255,0.6)", border: "none",
                          borderRadius: 6, cursor: "pointer", alignSelf: "flex-start", flexShrink: 0 }}>→ Convert to Concept</button>
                      <div onMouseDown={(e) => handleResizeMouseDown(e, s.id, "sticky", s.width || 160, s.height || 120)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: "2px solid rgba(28,42,58,0.35)", borderBottom: "2px solid rgba(28,42,58,0.35)" }} />
                    </div>
                  ))}

                  {canvasConcepts.map((c) => {
                    const style = CONCEPT_TYPE_STYLE[c.conceptType] || CONCEPT_TYPE_STYLE.Application;
                    const cw = c.width || CONCEPT_W, ch = c.height || CONCEPT_H;
                    return (
                    <div key={c.id}
                      onMouseDown={(e) => handleItemMouseDown(e, "concept", c.id)} onContextMenu={(e) => openContextMenu(e, "concept", c.id)}
                      style={{ position: "absolute", left: c.x, top: c.y, width: cw, minHeight: ch, zIndex: c.zIndex || 0,
                        background: "#fff", borderRadius: 12, padding: 12, overflow: "visible",
                        borderTop: `4px solid ${style.color}`,
                        borderLeft: c.highlightColor ? `4px solid ${c.highlightColor}` : `1px solid ${COLORS.border}`,
                        borderRight: `1px solid ${COLORS.border}`, borderBottom: `1px solid ${COLORS.border}`,
                        outline: selectedIds.has(`concept:${c.id}`) ? `2px solid ${COLORS.accent}` : "none", outlineOffset: 2,
                        boxShadow: "0 6px 18px rgba(10,14,26,0.14)", cursor: "grab" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <div style={{ width: 22, height: 22, borderRadius: 6, background: style.color,
                            display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{style.icon}</div>
                          <span style={{ fontSize: 10, fontWeight: 700, color: style.color, textTransform: "uppercase", letterSpacing: "0.03em" }}>{c.conceptType}</span>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          {c.highlightLabel && <span style={{ fontSize: 9, background: `${c.highlightColor}18`, color: c.highlightColor,
                            padding: "1px 6px", borderRadius: 5, fontWeight: 700 }}>{c.highlightLabel}</span>}
                          {c.pushed && <span style={{ fontSize: 9, background: "#DCEAE1", color: COLORS.accent, padding: "1px 6px", borderRadius: 5, fontWeight: 700 }}>PUSHED</span>}
                          <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteConcept(c.id, c.pushed)}
                            style={{ cursor: "pointer", fontSize: 12, color: "rgba(28,42,58,0.4)" }}>✕</span>
                        </div>
                      </div>
                      <div style={{ fontSize: 13, fontWeight: 600, margin: "4px 0" }}>{c.name}</div>
                      <div style={{ fontSize: 10.5, color: COLORS.inkSecondary, marginBottom: 6 }}>
                        {Object.values(c.attributes || {}).filter((v) => v).length} attribute{Object.values(c.attributes || {}).filter((v) => v).length === 1 ? "" : "s"} set
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onMouseDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setEditingConceptId(c.id); }}
                          style={{ fontSize: 10.5, padding: "3px 8px", background: "#EFEDE5", border: "none", borderRadius: 5, cursor: "pointer" }}>Edit</button>
                        {c.realId && (
                          <button onMouseDown={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); c.expanded ? collapseRelationships(c) : expandRelationships(c); }}
                            title={c.expanded ? "Remove the relationships this pulled in" : "Pull in this concept's real relationships from the graph"}
                            style={{ fontSize: 10.5, padding: "3px 8px", background: c.expanded ? "#F0C4B4" : "#DCEAE1",
                              color: c.expanded ? "#8A4A2E" : COLORS.accent, border: "none", borderRadius: 5, cursor: "pointer" }}>
                            {c.expanded ? "Collapse" : "Expand"}
                          </button>
                        )}
                      </div>

                      {/* Four connector handles (top/right/bottom/left) instead of one — lets a
                          diagram leave from whichever side actually makes sense visually. */}
                      {ANCHOR_SIDES.map((anchor) => {
                        const posStyle = anchor === "top" ? { top: -8, left: "50%", transform: "translateX(-50%)" }
                          : anchor === "bottom" ? { bottom: -8, left: "50%", transform: "translateX(-50%)" }
                          : anchor === "left" ? { left: -8, top: "50%", transform: "translateY(-50%)" }
                          : { right: -8, top: "50%", transform: "translateY(-50%)" };
                        return (
                          <div key={anchor} onMouseDown={(e) => handleHandleMouseDown(e, c.id, anchor)}
                            title="Drag to another concept to connect them"
                            style={{ position: "absolute", ...posStyle, width: 15, height: 15, borderRadius: "50%",
                              background: style.color, border: "2px solid #fff", boxShadow: "0 1px 4px rgba(28,42,58,0.35)", cursor: "crosshair" }} />
                        );
                      })}

                      {/* Resize grip — bottom-right corner, separate mousedown from the card-move drag. */}
                      <div onMouseDown={(e) => handleResizeMouseDown(e, c.id, "concept", cw, ch)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: `2px solid ${COLORS.border}`, borderBottom: `2px solid ${COLORS.border}` }} />
                    </div>
                    );
                  })}

                  {canvasTexts.map((t) => (
                    <div key={t.id} onMouseDown={(e) => handleItemMouseDown(e, "text", t.id)} onContextMenu={(e) => openContextMenu(e, "text", t.id)}
                      onDoubleClick={() => setEditingTextId(t.id)}
                      style={{ position: "absolute", left: t.x, top: t.y, width: t.width, height: t.height, zIndex: t.zIndex || 0,
                        display: "flex", flexDirection: "column",
                        justifyContent: t.valign === "middle" ? "center" : t.valign === "bottom" ? "flex-end" : "flex-start",
                        outline: selectedIds.has(`text:${t.id}`) ? `2px solid ${COLORS.accent}` : "none", outlineOffset: 2,
                        cursor: "grab", padding: 6, border: `1px dashed transparent` }}>
                      <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteText(t.id)}
                        style={{ position: "absolute", top: -4, right: -4, cursor: "pointer", fontSize: 11,
                          color: "rgba(28,42,58,0.4)", background: "#F3F4F7", borderRadius: "50%", width: 16, height: 16,
                          display: "flex", alignItems: "center", justifyContent: "center" }}>✕</span>
                      <div style={{ fontSize: t.fontSize, color: t.color, fontWeight: t.bold ? 700 : 400,
                        fontStyle: t.italic ? "italic" : "normal", textAlign: t.align, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {t.content}
                      </div>
                      <div onMouseDown={(e) => handleResizeMouseDown(e, t.id, "text", t.width, t.height)}
                        title="Drag to resize"
                        style={{ position: "absolute", right: 2, bottom: 2, width: 14, height: 14, cursor: "nwse-resize",
                          borderRight: "2px solid rgba(28,42,58,0.25)", borderBottom: "2px solid rgba(28,42,58,0.25)" }} />
                    </div>
                  ))}

                  {shapes.map((s) => {
                    const def = getShapeDef(s.shapeKey);
                    const color = SHAPE_CATEGORY_COLOR[s.category] || COLORS.inkSecondary;
                    const sw = s.width || SHAPE_W, sh = s.height || SHAPE_H;
                    const isBasic = def && def.renderMode === "basic";
                    return (
                      <div key={s.id} onMouseDown={(e) => handleItemMouseDown(e, "shape", s.id)} onContextMenu={(e) => openContextMenu(e, "shape", s.id)}
                        style={{ position: "absolute", left: s.x, top: s.y, width: sw, height: sh, zIndex: s.zIndex || 0,
                          display: "flex", flexDirection: isBasic ? undefined : "column", alignItems: "center", justifyContent: "center",
                          outline: selectedIds.has(`shape:${s.id}`) ? `2px solid ${COLORS.accent}` : "none", outlineOffset: 2,
                          boxShadow: s.highlightColor ? `0 0 0 3px ${s.highlightColor}` : "none", borderRadius: isBasic ? 0 : 8,
                          cursor: "grab", padding: isBasic ? 0 : 6 }}>
                        <span onMouseDown={(e) => e.stopPropagation()} onClick={() => deleteShape(s.id)}
                          style={{ position: "absolute", top: -2, right: -2, cursor: "pointer", fontSize: 11,
                            color: "rgba(28,42,58,0.4)", background: "#F3F4F7", borderRadius: "50%", width: 16, height: 16,
                            display: "flex", alignItems: "center", justifyContent: "center", zIndex: 2 }}>✕</span>
                        {s.highlightLabel && (
                          <span style={{ position: "absolute", top: -10, left: -2, fontSize: 8.5, fontWeight: 700,
                            background: s.highlightColor, color: "#fff", padding: "1px 5px", borderRadius: 4, whiteSpace: "nowrap", zIndex: 2 }}>
                            {s.highlightLabel}
                          </span>
                        )}

                        {isBasic ? (
                          <>
                            <svg width={sw} height={sh} style={{ position: "absolute", left: 0, top: 0 }}>
                              {renderBasicShapeSvg(s.shapeKey, sw, sh, color)}
                            </svg>
                            <input value={s.label} onMouseDown={(e) => e.stopPropagation()}
                              onChange={(e) => updateShapeLabel(s.id, e.target.value)}
                              style={{ position: "relative", width: "80%", textAlign: "center", fontSize: 11.5, fontWeight: 500,
                                color: COLORS.ink, background: "transparent", border: "none", outline: "none", zIndex: 1 }} />
                          </>
                        ) : (
                          <>
                            {def && def.renderMode === "svg" ? (
                              def.type === "png" ? (
                                <img src={def.content} alt={def.label} draggable={false}
                                  style={{ width: Math.min(sw, sh) - 8, height: Math.min(sw, sh) - 8, flexShrink: 0, objectFit: "contain" }} />
                              ) : (
                                <div style={{ width: Math.min(sw, sh) - 8, height: Math.min(sw, sh) - 8, flexShrink: 0 }}
                                  dangerouslySetInnerHTML={{ __html: def.content }} />
                              )
                            ) : (
                              <div style={{ color, flexShrink: 0, transform: `scale(${Math.min(sw, sh) / 76})`, transformOrigin: "center" }}>{def ? def.icon : null}</div>
                            )}
                            <input value={s.label} onMouseDown={(e) => e.stopPropagation()}
                              onChange={(e) => updateShapeLabel(s.id, e.target.value)}
                              style={{ width: "100%", textAlign: "center", fontSize: 10.5, fontWeight: 500, color: COLORS.ink,
                                background: "transparent", border: "none", outline: "none", marginTop: 4 }} />
                          </>
                        )}

                        {ANCHOR_SIDES.map((anchor) => {
                          const posStyle = anchor === "top" ? { top: -7, left: "50%", transform: "translateX(-50%)" }
                            : anchor === "bottom" ? { bottom: -7, left: "50%", transform: "translateX(-50%)" }
                            : anchor === "left" ? { left: -7, top: "50%", transform: "translateY(-50%)" }
                            : { right: -7, top: "50%", transform: "translateY(-50%)" };
                          return (
                            <div key={anchor} onMouseDown={(e) => handleShapeHandleMouseDown(e, s.id, anchor)}
                              title="Drag to another shape to connect them"
                              style={{ position: "absolute", ...posStyle, width: 13, height: 13, borderRadius: "50%",
                                background: color, border: "2px solid #fff", boxShadow: "0 1px 4px rgba(28,42,58,0.35)", cursor: "crosshair" }} />
                          );
                        })}
                        <div onMouseDown={(e) => handleResizeMouseDown(e, s.id, "shape", sw, sh)}
                          title="Drag to resize"
                          style={{ position: "absolute", right: 2, bottom: 2, width: 12, height: 12, cursor: "nwse-resize",
                            borderRight: "2px solid rgba(28,42,58,0.2)", borderBottom: "2px solid rgba(28,42,58,0.2)" }} />
                      </div>
                    );
                  })}
                </div>
              </div>

              {contextMenu && (() => {
                const menuItemStyle = { display: "block", width: "100%", textAlign: "left", padding: "7px 12px",
                  fontSize: 12.5, background: "transparent", border: "none", cursor: "pointer", color: COLORS.ink, borderRadius: 6 };
                return (
                  <div style={{ position: "fixed", left: contextMenu.x, top: contextMenu.y, background: COLORS.card,
                    border: `1px solid ${COLORS.border}`, boxShadow: "0 16px 40px rgba(10,14,26,0.2)", borderRadius: 12,
                    padding: 4, zIndex: 100, width: 190 }}>
                    {(contextMenu.kind === "concept" || contextMenu.kind === "text") && (
                      <>
                        <button style={menuItemStyle} onClick={() => {
                            if (contextMenu.kind === "concept") setEditingConceptId(contextMenu.id);
                            else setEditingTextId(contextMenu.id);
                            closeContextMenu();
                          }}>Edit</button>
                        <div style={{ height: 1, background: COLORS.border, margin: "3px 0" }} />
                      </>
                    )}
                    <button style={menuItemStyle} onClick={() => { bringToFront(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Bring to Front</button>
                    <button style={menuItemStyle} onClick={() => { bringForward(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Bring Forward</button>
                    <button style={menuItemStyle} onClick={() => { sendBackward(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Send Backward</button>
                    <button style={menuItemStyle} onClick={() => { sendToBack(contextMenu.kind, contextMenu.id); closeContextMenu(); }}>Send to Back</button>
                    <div style={{ height: 1, background: COLORS.border, margin: "3px 0" }} />
                    <button style={{ ...menuItemStyle, color: COLORS.risk }} onClick={contextMenuDelete}>Delete</button>
                  </div>
                );
              })()}

              {pendingEdgeTarget && (() => {
                const srcConcept = canvasConcepts.find((c) => c.id === connectingFrom);
                const tgtConcept = canvasConcepts.find((c) => c.id === pendingEdgeTarget);
                const validRels = schemaRelationships.filter((r) =>
                  srcConcept && tgtConcept && r.source === srcConcept.conceptType && r.target === tgtConcept.conceptType
                );
                const validVerbs = validRels.map((r) => r.verb);
                const effectiveVerb = validVerbs.includes(pendingVerb) ? pendingVerb : (validVerbs[0] || "");
                // Only computed when the direct pairing has no valid verb — this is the
                // "self-healing" path: check whether swapping direction works, and if
                // not, surface what actually IS connectable from/to each side so the
                // user can course-correct instead of hitting a dead end.
                const reverseRels = validVerbs.length === 0 && srcConcept && tgtConcept
                  ? schemaRelationships.filter((r) => r.source === tgtConcept.conceptType && r.target === srcConcept.conceptType)
                  : [];
                const outboundTargets = validVerbs.length === 0 && srcConcept
                  ? [...new Set(schemaRelationships.filter((r) => r.source === srcConcept.conceptType).map((r) => `${r.verb} → ${humanizeLabel(r.target)}`))]
                  : [];
                const inboundSources = validVerbs.length === 0 && tgtConcept
                  ? [...new Set(schemaRelationships.filter((r) => r.target === tgtConcept.conceptType).map((r) => `${humanizeLabel(r.source)} → ${r.verb}`))]
                  : [];
                const rect = canvasRef.current ? canvasRef.current.getBoundingClientRect() : { left: 0, top: 0 };
                const panelLeft = srcConcept && tgtConcept
                  ? rect.left + canvasOffset.x + ((srcConcept.x + tgtConcept.x) / 2 + CONCEPT_W / 2) * canvasScale
                  : rect.left + 40;
                const panelTop = srcConcept && tgtConcept
                  ? rect.top + canvasOffset.y + ((srcConcept.y + tgtConcept.y) / 2 + CONCEPT_H / 2) * canvasScale
                  : rect.top + 40;
                const panelWidth = validVerbs.length === 0 && (outboundTargets.length || inboundSources.length) ? 360 : 280;
                return (
                  <div style={{ position: "fixed", left: Math.min(panelLeft, window.innerWidth - panelWidth - 20), top: Math.max(panelTop - 60, 80),
                    background: COLORS.card, border: `1px solid ${COLORS.border}`,
                    boxShadow: "0 16px 40px rgba(10,14,26,0.18)", borderRadius: 14, padding: 16, zIndex: 50, width: panelWidth,
                    maxHeight: "70vh", overflowY: "auto" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>
                      {srcConcept && tgtConcept ? `${humanizeLabel(srcConcept.conceptType)} → ${humanizeLabel(tgtConcept.conceptType)}` : "Choose a verb"}
                    </div>
                    {validVerbs.length === 0 ? (
                      <>
                        <div style={{ fontSize: 12, color: COLORS.ink, lineHeight: 1.5, marginBottom: 12 }}>
                          Your ontology doesn't define <b>{srcConcept && humanizeLabel(srcConcept.conceptType)}</b> → <b>{tgtConcept && humanizeLabel(tgtConcept.conceptType)}</b>.
                        </div>

                        {reverseRels.length > 0 && (
                          <div style={{ background: `${COLORS.accent}14`, border: `1px solid ${COLORS.accent}44`, borderRadius: 10,
                            padding: 10, marginBottom: 12 }}>
                            <div style={{ fontSize: 11.5, color: COLORS.ink, lineHeight: 1.5, marginBottom: 8 }}>
                              But the reverse direction is — <b>{humanizeLabel(tgtConcept.conceptType)}</b> can {reverseRels.map((r) => `"${r.verb}"`).join(" or ")} <b>{humanizeLabel(srcConcept.conceptType)}</b>.
                            </div>
                            <button onClick={reverseEdgeDirection}
                              style={{ width: "100%", padding: "7px", background: COLORS.accent, color: "#fff",
                                border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                              ↺ Reverse & Connect
                            </button>
                          </div>
                        )}

                        {(outboundTargets.length > 0 || inboundSources.length > 0) && (
                          <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 12 }}>
                            {outboundTargets.length > 0 && (
                              <div style={{ marginBottom: 10 }}>
                                <b style={{ color: COLORS.ink, fontSize: 11.5 }}>{humanizeLabel(srcConcept.conceptType)} can connect to:</b>
                                <ul style={{ margin: "4px 0 0", paddingLeft: 16, lineHeight: 1.5 }}>
                                  {outboundTargets.map((t) => <li key={t}>{t}</li>)}
                                </ul>
                              </div>
                            )}
                            {inboundSources.length > 0 && (
                              <div>
                                <b style={{ color: COLORS.ink, fontSize: 11.5 }}>{humanizeLabel(tgtConcept.conceptType)} can be connected from:</b>
                                <ul style={{ margin: "4px 0 0", paddingLeft: 16, lineHeight: 1.5 }}>
                                  {inboundSources.map((s) => <li key={s}>{s}</li>)}
                                </ul>
                              </div>
                            )}
                          </div>
                        )}

                        {reverseRels.length === 0 && outboundTargets.length === 0 && inboundSources.length === 0 && (
                          <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, lineHeight: 1.5, marginBottom: 12 }}>
                            Neither type has any defined relationship in either direction — this may be a genuine
                            gap in bdcore_schema.yaml rather than just the wrong pairing.
                          </div>
                        )}

                        <button onClick={cancelEdge}
                          style={{ width: "100%", padding: "7px", background: "transparent", color: COLORS.inkSecondary,
                            border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Close</button>
                      </>
                    ) : (
                      <>
                        <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 8 }}>
                          {validVerbs.length} verb{validVerbs.length === 1 ? "" : "s"} valid for this pairing in your ontology.
                        </div>
                        <select value={effectiveVerb} onChange={(e) => setPendingVerb(e.target.value)}
                          style={{ width: "100%", padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5, marginBottom: 10 }}>
                          {validVerbs.map((v) => <option key={v} value={v}>{v}</option>)}
                        </select>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => confirmEdge(effectiveVerb)} style={{ flex: 1, padding: "7px", background: COLORS.ink, color: "#fff",
                            border: "none", borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Confirm</button>
                          <button onClick={cancelEdge}
                            style={{ flex: 1, padding: "7px", background: "transparent", color: COLORS.inkSecondary,
                              border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })()}

              {editingConceptId && (() => {
                const c = canvasConcepts.find((x) => x.id === editingConceptId);
                if (!c) return null;
                const updateConcept = (patch) => setCanvasConcepts((prev) => prev.map((x) => x.id === c.id ? { ...x, ...patch } : x));
                const setAttr = (schemaName, value) => {
                  const key = toSnakeCase(schemaName);
                  updateConcept({ attributes: { ...c.attributes, [key]: value } });
                };
                const availableAttrs = schemaAttributes[c.conceptType] || [];
                return (
                  <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: 340, background: COLORS.card,
                    borderLeft: `1px solid ${COLORS.border}`, boxShadow: "-12px 0 32px rgba(10,14,26,0.12)", padding: 22,
                    zIndex: 60, overflowY: "auto" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>Edit Concept</div>
                      <span onClick={() => setEditingConceptId(null)} style={{ cursor: "pointer", color: COLORS.inkSecondary }}>✕</span>
                    </div>
                    <label style={{ fontSize: 12, display: "block", marginBottom: 12 }}>Concept Type
                      <select value={c.conceptType} onChange={(e) => updateConcept({ conceptType: e.target.value, attributes: {} })}
                        disabled={c.pushed}
                        style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }}>
                        {groupConceptTypesByCategory(CANVAS_CONCEPT_TYPES).map((group) => (
                          <optgroup key={group.key} label={group.label}>
                            {group.types.map((t) => <option key={t} value={t}>{humanizeLabel(t)}</option>)}
                          </optgroup>
                        ))}
                      </select>
                    </label>
                    <label style={{ fontSize: 12, display: "block", marginBottom: 18 }}>Name
                      <input value={c.name} onChange={(e) => updateConcept({ name: e.target.value })}
                        style={{ display: "block", width: "100%", marginTop: 4, padding: "7px 8px", border: `1px solid ${COLORS.border}`, borderRadius: 6, fontSize: 12.5 }} />
                    </label>
                    <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 2 }}>Attributes</div>
                    <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 10 }}>
                      Pulled directly from your schema for {c.conceptType} — leave any blank to skip them.
                    </div>
                    {availableAttrs.length === 0 ? (
                      <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, marginBottom: 16 }}>
                        No attribute definitions found for this type — make sure load_schema.py has been run.
                      </div>

                  <div>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 6 }}>Status</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {statuses.map((s) => (
                        <button key={s} onClick={() => setDecisionStatusFilter(s)}
                          style={{ padding: "5px 11px", fontSize: 11.5, fontWeight: 600, borderRadius: 7, cursor: "pointer",
                            border: `1px solid ${decisionStatusFilter === s ? COLORS.ink : COLORS.border}`,
                            background: decisionStatusFilter === s ? COLORS.ink : COLORS.card,
                            color: decisionStatusFilter === s ? "#fff" : COLORS.ink }}>{s}</button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 6 }}>Type</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {types.map((t) => (
                        <button key={t} onClick={() => setDecisionTypeFilter(t)}
                          style={{ padding: "5px 11px", fontSize: 11.5, fontWeight: 600, borderRadius: 7, cursor: "pointer",
                            border: `1px solid ${decisionTypeFilter === t ? COLORS.ink : COLORS.border}`,
                            background: decisionTypeFilter === t ? COLORS.ink : COLORS.card,
                            color: decisionTypeFilter === t ? "#fff" : COLORS.ink }}>{t}</button>
                      ))}
                    </div>
                  </div>
                </div>

                {filtered.length === 0 ? (
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary }}>No decisions match these filters.</div>
                ) : (
                  <div style={{ columnCount: 2, columnGap: 20 }}>
                    {filtered.map((d) => (
                      <div key={d.id} className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 18,
                        padding: 20, marginBottom: 16, borderLeft: `4px solid ${STATUS_COLOR[d.status] || COLORS.border}`,
                        breakInside: "avoid", WebkitColumnBreakInside: "avoid" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                      <div>
                        <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{d.name}</div>
                        <div style={{ fontSize: 11.5, color: COLORS.inkSecondary }}>
                          {d.type} {d.decisionMaker && `· ${d.decisionMaker}`} {d.decisionDate && `· ${d.decisionDate}`}
                        </div>
                      </div>
                      <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 6,
                        background: `${STATUS_COLOR[d.status] || COLORS.border}22`, color: STATUS_COLOR[d.status] || COLORS.ink, flexShrink: 0 }}>
                        {d.status}
                      </span>
                    </div>

                    {d.supersededBy.length > 0 && (
                      <div style={{ fontSize: 12, color: "#7B5EA7", fontWeight: 600, marginBottom: 10 }}>
                        ← Superseded by: {d.supersededBy.map((s) => s.name).join(", ")}
                      </div>
                    )}
                    {d.supersedes.length > 0 && (
                      <div style={{ fontSize: 12, color: COLORS.inkSecondary, marginBottom: 10 }}>
                        → Supersedes: {d.supersedes.map((s) => s.name).join(", ")}
                      </div>
                    )}

                    {d.rationale && (
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 3 }}>Context</div>
                        <div style={{ fontSize: 13, lineHeight: 1.5 }}>{d.rationale}</div>
                      </div>
                    )}
                    {d.optionsConsidered && (
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 3 }}>Options Considered</div>
                        <div style={{ fontSize: 13, lineHeight: 1.5 }}>{d.optionsConsidered}</div>
                      </div>
                    )}
                    {d.chosenOption && (
                      <div style={{ marginBottom: 10, background: "#F6F4EF", borderRadius: 8, padding: "8px 12px" }}>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 3 }}>Decision</div>
                        <div style={{ fontSize: 13, lineHeight: 1.5, fontWeight: 500 }}>{d.chosenOption}</div>
                      </div>
                    )}
                    {d.consequences && (
                      <div style={{ marginBottom: d.affects.length > 0 ? 10 : 0 }}>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 3 }}>Consequences</div>
                        <div style={{ fontSize: 13, lineHeight: 1.5 }}>{d.consequences}</div>
                      </div>
                    )}
                    {d.affects.length > 0 && (
                      <div>
                        <div style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSecondary, textTransform: "uppercase", marginBottom: 5 }}>Affects</div>
                        {d.affects.map((a, i) => (
                          <span key={i} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6, display: "inline-block", marginBottom: 4 }}>
                            {a.verb.toLowerCase().replace(/_/g, " ")} {a.name}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })()}

          {view === "maturity" && (
            <div>
              <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginBottom: 20, maxWidth: 780, lineHeight: 1.6 }}>
                A CMMI-style maturity model across the six dimensions you specified — Governance, Policies, Process,
                People, Applications, Metrics — scored 1 (Initial) to 5 (Optimizing) per capability. These are
                illustrative starting scores grounded in what we already know about each capability from elsewhere
                in this tool, not a real assessment — the point is to show the tool can hold and visualise this,
                ready for you to overwrite with genuine scores via Ontology Manager or the schema-driven edit form.
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 20 }}>
                {capCoverage.map((cap) => {
                  const scores = MATURITY_DIMS.map(([key]) => maturityToNumber(cap.maturity[key]));
                  const avg = scores.reduce((s, v) => s + v, 0) / (scores.filter((v) => v > 0).length || 1);
                  const cx = 110, cy = 105, maxR = 82;
                  return (
                    <div key={cap.capability} className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`,
                      boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)", borderRadius: 18, padding: 18 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                        <div style={{ fontSize: 13.5, fontWeight: 600, maxWidth: 180 }}>{cap.capability}</div>
                        <div style={{ fontSize: 18, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Capability.color }}>{avg.toFixed(1)}</div>
                      </div>
                      <svg viewBox="0 0 220 210" width="100%" height="200">
                        {[1, 2, 3, 4, 5].map((level) => {
                          const pts = MATURITY_DIMS.map((_, i) => radarPoint(cx, cy, (level / 5) * maxR, i, 6));
                          return <polygon key={level} points={pts.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={COLORS.border} strokeWidth="1" />;
                        })}
                        {MATURITY_DIMS.map((_, i) => {
                          const p = radarPoint(cx, cy, maxR, i, 6);
                          return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke={COLORS.border} strokeWidth="1" />;
                        })}
                        <polygon
                          points={MATURITY_DIMS.map(([key], i) => {
                            const p = radarPoint(cx, cy, (maturityToNumber(cap.maturity[key]) / 5) * maxR, i, 6);
                            return `${p.x},${p.y}`;
                          }).join(" ")}
                          fill={`${CONCEPT_TYPE_STYLE.Capability.color}33`} stroke={CONCEPT_TYPE_STYLE.Capability.color} strokeWidth="2" />
                        {MATURITY_DIMS.map(([key, label], i) => {
                          const p = radarPoint(cx, cy, maxR + 20, i, 6);
                          return <text key={key} x={p.x} y={p.y + 3} fontSize="9.5" textAnchor="middle" fill={COLORS.inkSecondary}>{label}</text>;
                        })}
                      </svg>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {view === "journeytrace" && (() => {
            const journey = journeys.find((j) => j.id === selectedJourneyId) || journeys[0];
            return (
              <div style={{ maxWidth: 900 }}>
                <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginBottom: 18, lineHeight: 1.6 }}>
                  The chain your customer described — journey → stages → capabilities & processes → applications →
                  technology — wasn't a new idea to build, it was already fully wired into your relationship
                  vocabulary. This just walks it and shows where it breaks.
                </div>
                <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
                  {journeys.map((j) => (
                    <button key={j.id} onClick={() => setSelectedJourneyId(j.id)}
                      style={{ padding: "7px 14px", fontSize: 12.5, fontWeight: 600, borderRadius: 8, cursor: "pointer",
                        border: `1px solid ${(journey && journey.id === j.id) ? CONCEPT_TYPE_STYLE.Journey.color : COLORS.border}`,
                        background: (journey && journey.id === j.id) ? CONCEPT_TYPE_STYLE.Journey.color : COLORS.card,
                        color: (journey && journey.id === j.id) ? "#fff" : COLORS.ink }}>
                      {j.name}
                    </button>
                  ))}
                </div>

                {!journey ? (
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary }}>No journeys found.</div>
                ) : (
                  <div>
                    {journey.stages.map((stage, i) => {
                      const noCapability = stage.capabilities.length === 0 && stage.processes.length === 0;
                      const noApp = stage.capabilities.length > 0 && stage.applications.length === 0;
                      return (
                        <div key={stage.id} style={{ display: "flex", gap: 16 }}>
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                            <div style={{ width: 30, height: 30, borderRadius: "50%", background: CONCEPT_TYPE_STYLE.JourneyStage.color,
                              color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12.5, fontWeight: 700 }}>
                              {i + 1}
                            </div>
                            {i < journey.stages.length - 1 && <div style={{ width: 2, flex: 1, background: COLORS.border, minHeight: 30 }} />}
                          </div>
                          <div style={{ flex: 1, paddingBottom: 24 }}>
                            <div style={{ fontSize: 14.5, fontWeight: 600, marginBottom: 2 }}>{stage.name}</div>
                            <div style={{ fontSize: 11, color: COLORS.inkSecondary, marginBottom: 10 }}>{stage.type}</div>
                            <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 14 }}>
                              {noCapability ? (
                                <div style={{ fontSize: 12.5, color: COLORS.risk, fontWeight: 600 }}>⚠ No capability or process linked to this stage</div>
                              ) : (
                                <>
                                  {stage.capabilities.length > 0 && (
                                    <div style={{ marginBottom: 8 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Capability.color, textTransform: "uppercase" }}>Capabilities: </span>
                                      {stage.capabilities.map((c) => (
                                        <span key={c} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{c}</span>
                                      ))}
                                    </div>
                                  )}
                                  {stage.processes.length > 0 && (
                                    <div style={{ marginBottom: 8 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Process.color, textTransform: "uppercase" }}>Processes: </span>
                                      {stage.processes.map((p) => (
                                        <span key={p} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{p}</span>
                                      ))}
                                    </div>
                                  )}
                                  {noApp ? (
                                    <div style={{ fontSize: 12, color: "#D97706", fontWeight: 600 }}>⚠ Capability linked, but no application supports it</div>
                                  ) : stage.applications.length > 0 && (
                                    <div style={{ marginBottom: stage.technologies.length > 0 ? 8 : 0 }}>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: CONCEPT_TYPE_STYLE.Application.color, textTransform: "uppercase" }}>Applications: </span>
                                      {stage.applications.map((a) => {
                                        const full = apps.find((x) => x.name === a);
                                        return (
                                          <span key={a} onClick={() => full && (setProfileAppId(full.id), setView("profile"))}
                                            style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6,
                                              cursor: full ? "pointer" : "default", textDecoration: full ? "underline" : "none" }}>{a}</span>
                                        );
                                      })}
                                    </div>
                                  )}
                                  {stage.technologies.length > 0 && (
                                    <div>
                                      <span style={{ fontSize: 10.5, fontWeight: 700, color: "#5B6E4F", textTransform: "uppercase" }}>Technology: </span>
                                      {stage.technologies.map((t) => (
                                        <span key={t} style={{ fontSize: 11.5, background: "#F6F4EF", padding: "2px 8px", borderRadius: 6, marginRight: 6 }}>{t}</span>
                                      ))}
                                    </div>
                                  )}
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })()}

        </div>
      )}

      <div style={{ fontSize: 11.5, color: COLORS.inkSecondary, marginTop: 20, lineHeight: 1.6 }}>
        Connects directly to Neo4j Aura's Query API over HTTPS. Credentials are held only in this page's memory.
        6R disposition is calculated from business value, technical health, and hosting model using simple rules
        shown in each application's detail — a real assessment would involve architect judgement, this is a starting point.
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(APMDashboardLive));
</script>

<script>
  (function () {
    var root = document.getElementById('root');
    var missing = [];
    if (typeof React === 'undefined') missing.push('React');
    if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof Babel === 'undefined') missing.push('Babel');
    if (typeof marked === 'undefined') missing.push('marked');
    if (typeof DOMPurify === 'undefined') missing.push('DOMPurify');
    if (missing.length) {
      root.innerHTML =
        '<div style="font-family: sans-serif; padding: 40px; max-width: 700px; color: #1C2A3A;">' +
        '<h2 style="color:#9B3A2E;">' + missing.length + ' script(s) failed to load</h2>' +
        '<p style="line-height:1.6;">Missing: ' + missing.join(', ') + '</p>' +
        '<p style="color:#5B6B7A; font-size: 13px; line-height: 1.6;">These load from the vendor/ folder next to ' +
        'this HTML file, not from a CDN, so this almost always means the vendor/ folder isn\'t sitting alongside ' +
        'the file on whatever is serving it \u2014 check that it was copied/cloned along with the .html file, and that ' +
        'the server (or Finder/Explorer, if opening the file directly) has it in the same directory. Developer ' +
        'Tools \u2192 Network tab will show exactly which request 404\u2019d.</p></div>';
      return;
    }
    try {
      var src = document.getElementById('app-source').textContent;
      var output = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], sourceType: 'script' }).code;
      var runner = new Function('React', 'ReactDOM', output);
      runner(React, ReactDOM);
    } catch (err) {
      root.innerHTML =
        '<div style="font-family: sans-serif; padding: 40px; max-width: 700px; color: #1C2A3A;">' +
        '<h2 style="color:#9B3A2E;">Build error</h2>' +
        '<pre style="white-space: pre-wrap; background: #F6F4EF; padding: 16px; border-radius: 4px; ' +
        'font-size: 12.5px; border: 1px solid #DDD9CE;">' + (err.stack || err.message) + '</pre></div>';
    }
  })();
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.hasChildNodes()) {
      root.innerHTML = '<div style="font-family: sans-serif; padding: 40px; color:#9B3A2E;">' +
        'Still blank with no error caught \u2014 open Developer Tools \u2192 Console and share what\'s there.</div>';
    }
  }, 4000);
</script>
</body>
</html>
