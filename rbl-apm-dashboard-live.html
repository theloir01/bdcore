      setCanvasList(remaining);
      if (activeCanvasId === c.id) {
        const sibling = remaining.find((x) => x.workspaceId === c.workspaceId) || remaining[0];
        if (sibling) { setActiveCanvasId(sibling.id); loadCanvasData(sibling.id); }
        else { setActiveCanvasId(null); setStickies([]); setCanvasConcepts([]); setCanvasEdges([]); setCanvasTexts([]); setShapes([]); setShapeEdges([]); setFreeArrows([]); }
      }
    } catch (e) {
      setCanvasStatus(`Couldn't delete canvas: ${e.message}`);
    }
  };

  const deleteWorkspace = async (ws) => {
    const childCanvases = canvasList.filter((c) => c.workspaceId === ws.id);
    const warning = childCanvases.length > 0
      ? `Delete workspace "${ws.name}" and all ${childCanvases.length} canvas${childCanvases.length === 1 ? "" : "es"} inside it? This can't be undone.`
      : `Delete workspace "${ws.name}"?`;
    if (!(await askConfirm(warning, { danger: true, confirmLabel: "Delete" }))) return;
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader, `MATCH (c:Canvas {workspaceId: $id}) DETACH DELETE c`, { id: ws.id });
      await runCypher(apiUrl, authHeader, `MATCH (w:Workspace {id: $id}) DETACH DELETE w`, { id: ws.id });
      const childIds = new Set(childCanvases.map((c) => c.id));
      setCanvasList((prev) => prev.filter((c) => !childIds.has(c.id)));
      setWorkspaces((prev) => prev.filter((w) => w.id !== ws.id));
      if (childIds.has(activeCanvasId)) {
        setActiveCanvasId(null); setStickies([]); setCanvasConcepts([]); setCanvasEdges([]); setCanvasTexts([]); setShapes([]); setShapeEdges([]); setFreeArrows([]);
      }
    } catch (e) {
      setCanvasStatus(`Couldn't delete workspace: ${e.message}`);
    }
  };

  const pushToGraph = useCallback(async () => {
    const toPush = canvasConcepts.filter((c) => !c.pushed);
    if (toPush.length === 0) { setCanvasStatus("Nothing new to push."); setTimeout(() => setCanvasStatus(""), 1500); return; }
    setCanvasStatus("Pushing to graph…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const idMap = {};
      for (const c of toPush) {
        if (!CANVAS_CONCEPT_TYPES.includes(c.conceptType)) continue; // whitelist guard
        const realId = newCanvasId("canvas");
        const props = { id: realId, name: c.name, ...c.attributes };
        await runCypher(apiUrl, authHeader,
          `CREATE (n:Instance:${c.conceptType} $props)`,
          { props }
        );
        await logAudit({ action: "created", entityType: c.conceptType, entityId: realId, entityName: c.name, summary: "Created via Modelling Canvas push" });
        idMap[c.id] = realId;
      }
      const updatedConcepts = canvasConcepts.map((c) =>
        idMap[c.id] ? { ...c, pushed: true, realId: idMap[c.id] } : c
      );
      const updatedEdges = [...canvasEdges];
      let relPushedCount = 0;
      for (let i = 0; i < updatedEdges.length; i++) {
        const e = updatedEdges[i];
        if (e.pushed) continue;
        const srcConcept = updatedConcepts.find((c) => c.id === e.sourceId);
        const tgtConcept = updatedConcepts.find((c) => c.id === e.targetId);
        const srcRealId = srcConcept && (srcConcept.realId || (srcConcept.pushed ? srcConcept.realId : null));
        const tgtRealId = tgtConcept && (tgtConcept.realId || (tgtConcept.pushed ? tgtConcept.realId : null));
        if (!srcRealId || !tgtRealId) continue;
        const relType = sanitizeVerbJS(e.verb);
        await runCypher(apiUrl, authHeader,
          `MATCH (a:Instance {id: $srcId}), (b:Instance {id: $tgtId}) MERGE (a)-[r:${relType}]->(b) SET r.type = $verb`,
          { srcId: srcRealId, tgtId: tgtRealId, verb: e.verb }
        );
        updatedEdges[i] = { ...e, pushed: true };
        relPushedCount++;
      }
      if (relPushedCount > 0) {
        await logAudit({
          action: "updated", entityType: "Relationship",
          entityName: `${relPushedCount} relationship${relPushedCount === 1 ? "" : "s"} linked`,
          summary: "Linked via Modelling Canvas push",
        });
      }
      setCanvasConcepts(updatedConcepts);
      setCanvasEdges(updatedEdges);
      await saveCanvas(stickies, updatedConcepts, updatedEdges);
      setCanvasStatus(`Pushed ${toPush.length} concept${toPush.length === 1 ? "" : "s"} to the graph.`);
      handleRefresh();
    } catch (e) {
      setCanvasStatus(`Push failed: ${e.message}`);
    }
  }, [uri, username, password, canvasConcepts, canvasEdges, stickies, saveCanvas]);

  const loadImportOptions = async () => {
    setImportLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${importType}) RETURN n.id AS id, n.name AS name ORDER BY n.name`
      );
      setImportOptions(rows);
    } catch (e) {
      setCanvasStatus(`Browse failed: ${e.message}`);
    } finally {
      setImportLoading(false);
    }
  };

  const importFromGraph = async (opt) => {
    setShowImportPanel(false);
    setCanvasStatus("Importing…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const nodeRows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${importType} {id: $id}) RETURN properties(n) AS props`,
        { id: opt.id }
      );
      if (!nodeRows[0]) { setCanvasStatus("Not found."); return; }
      const { id, name, ...rest } = nodeRows[0].props;

      let mainConcept = canvasConcepts.find((c) => c.realId === opt.id);
      if (!mainConcept) {
        const center = canvasCenter();
        const mainName = name || opt.name;
        const mainH = estimateConceptHeight(mainName, CONCEPT_W, CONCEPT_H);
        const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - mainH / 2, allCanvasItems(), CONCEPT_W, mainH);
        mainConcept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: mainH, conceptType: importType, name: mainName, attributes: rest, pushed: true, realId: opt.id, zIndex: zCounterRef.current++ };
        setCanvasConcepts((prev) => [...prev, mainConcept]);
        setCanvasStatus(`Imported ${opt.name}. Click "Expand" on its card to pull in its relationships.`);
        setTimeout(() => setCanvasStatus(""), 3000);
      } else {
        setCanvasStatus(`${opt.name} is already on the canvas.`);
        setTimeout(() => setCanvasStatus(""), 2000);
      }
    } catch (e) {
      setCanvasStatus(`Import failed: ${e.message}`);
    }
  };

  // Opt-in, separate from import itself — pulls in a concept's 1-hop
  // relationships (both directions) only when the person explicitly asks for
  // it via the "Expand" button, rather than automatically on every import.
  const expandRelationships = async (concept) => {
    if (!concept.realId) return;
    setCanvasStatus("Expanding relationships…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const relRows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance {id: $id})-[r]->(m:Instance)
         RETURN type(r) AS verb, properties(m) AS m, [l IN labels(m) WHERE l <> 'Instance'][0] AS mType, 'out' AS direction
         UNION
         MATCH (n:Instance {id: $id})<-[r]-(m:Instance)
         RETURN type(r) AS verb, properties(m) AS m, [l IN labels(m) WHERE l <> 'Instance'][0] AS mType, 'in' AS direction`,
        { id: concept.realId }
      );

      const existingItems = allCanvasItems();
      const newConcepts = [];
      const newEdges = [];
      const angleStep = relRows.length ? (2 * Math.PI) / relRows.length : 0;

      relRows.forEach((row, i) => {
        let related = canvasConcepts.find((c) => c.realId === row.m.id) || newConcepts.find((c) => c.realId === row.m.id);
        if (!related) {
          const angle = i * angleStep;
          const { id: mId, name: mName, ...mRest } = row.m;
          const relatedName = mName || "Unnamed";
          const relatedH = estimateConceptHeight(relatedName, CONCEPT_W, CONCEPT_H);
          const desiredX = concept.x + Math.cos(angle) * 260, desiredY = concept.y + Math.sin(angle) * 260;
          const pos = findFreePosition(desiredX, desiredY,
            [...existingItems, ...newConcepts.map((c) => ({ x: c.x, y: c.y, w: CONCEPT_W, h: c.height || CONCEPT_H }))], CONCEPT_W, relatedH);
          related = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: relatedH, conceptType: row.mType, name: relatedName, attributes: mRest, pushed: true, realId: row.m.id, expandedFrom: concept.id, zIndex: zCounterRef.current++ };
          newConcepts.push(related);
        }
        const verb = desanitizeVerb(row.verb);
        const sourceId = row.direction === "out" ? concept.id : related.id;
        const targetId = row.direction === "out" ? related.id : concept.id;
        const dup = canvasEdges.some((e) => e.sourceId === sourceId && e.targetId === targetId && e.verb === verb) ||
          newEdges.some((e) => e.sourceId === sourceId && e.targetId === targetId && e.verb === verb);
        if (!dup) newEdges.push({ id: newCanvasId("edge"), sourceId, targetId, verb, pushed: true, expandedFrom: concept.id });
      });

      // Build the merged arrays synchronously (rather than two separate setState
      // calls) so they can be handed straight to autoOrganizeCanvas below — React
      // hasn't necessarily re-rendered with a setCanvasConcepts call yet, so reading
      // canvasConcepts/canvasEdges back out of state here wouldn't see the new nodes.
      const mergedConcepts = canvasConcepts
        .map((c) => c.id === concept.id ? { ...c, expanded: true } : c)
        .concat(newConcepts);
      const mergedEdges = [...canvasEdges, ...newEdges];
      setCanvasConcepts(mergedConcepts);
      setCanvasEdges(mergedEdges);
      // Newly expanded nodes land in a radial scatter above — auto-organize into a
      // clean tree with elbow-routed edges instead, same as the AI "draw on canvas"
      // flow does after its own bulk adds.
      if (newConcepts.length) autoOrganizeCanvas(mergedConcepts, mergedEdges);
      setCanvasStatus(relRows.length === 0
        ? `${concept.name} has no relationships to expand.`
        : `Expanded ${concept.name}: ${relRows.length} relationship${relRows.length === 1 ? "" : "s"} added.`);
      setTimeout(() => setCanvasStatus(""), 2500);
    } catch (e) {
      setCanvasStatus(`Expand failed: ${e.message}`);
    }
  };

  // Undoes exactly what expandRelationships added for this concept, using the
  // expandedFrom tag — not a general "delete nearby stuff" operation.
  const collapseRelationships = (concept) => {
    setCanvasEdges((prevEdges) => {
      const remaining = prevEdges.filter((e) => e.expandedFrom !== concept.id);
      // Concepts tagged as created by this expansion get removed outright. But a
      // concept that already existed on canvas for some other reason — reused
      // via the dedup check in expandRelationships rather than freshly created —
      // never got tagged, so it wouldn't be caught by that filter alone. Catch it
      // here instead: if removing this expansion's edges leaves it with nothing
      // connecting it to anything, it's an orphan of this collapse either way.
      setCanvasConcepts((prevConcepts) => prevConcepts
        .filter((c) => c.expandedFrom !== concept.id)
        .filter((c) =>
          c.id === concept.id ||
          editingConceptId === c.id ||
          remaining.some((e) => e.sourceId === c.id || e.targetId === c.id)
        )
        .map((c) => c.id === concept.id ? { ...c, expanded: false } : c)
      );
      return remaining;
    });
  };

  const screenToCanvas = (clientX, clientY) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return {
      x: (clientX - rect.left - canvasOffset.x) / canvasScale,
      y: (clientY - rect.top - canvasOffset.y) / canvasScale,
    };
  };

  // Combined bounding boxes of every existing canvas object, for collision-aware placement.
  // Auto-arrange into a tree — a general utility on whatever's currently on
  // the canvas, not bespoke logic tied to any one feature. Levels nodes via
  // BFS from root (zero in-degree) concepts; disconnected pieces and cycles
  // just become extra roots rather than breaking the layout.
  const autoOrganizeCanvas = (overrideConcepts, overrideEdges, overrideShapes, overrideStickies) => {
    const concepts = overrideConcepts || canvasConcepts;
    const edges = overrideEdges || canvasEdges;
    const nodeIds = concepts.map((c) => c.id);
    if (nodeIds.length === 0) return;
    // What else is already on the canvas that this tree needs to be laid out
    // around, rather than through — otherwise a fixed (CENTER_X, 80) origin
    // plants the tree wherever that happens to be regardless of what's there
    // (this is what made a "pull concepts + sketch ideation stickies" plan
    // draw its tree straight through the stickies it had just placed).
    const obstacles = [
      ...(overrideShapes || shapes).map((s) => ({ x: s.x, y: s.y, w: s.width || SHAPE_W, h: s.height || SHAPE_H })),
      ...(overrideStickies || stickies).map((s) => ({ x: s.x, y: s.y, w: s.width || 160, h: s.height || 120 })),
    ];
    // Undirected adjacency — "drives" pointing one way and "invests in" pointing
    // the other shouldn't change which row something lands in. What matters for
    // layout is how many hops something is from where you started, not which
    // way the arrow happens to point.
    const neighbors = {};
    nodeIds.forEach((id) => { neighbors[id] = []; });
    edges.forEach((e) => {
      if (neighbors[e.sourceId] && neighbors[e.targetId]) {
        neighbors[e.sourceId].push(e.targetId);
        neighbors[e.targetId].push(e.sourceId);
      }
    });
    // Anchor = the node placed first (lowest zIndex), since that's the thing
    // the person actually started from and expanded outward from — not
    // whichever node happens to have no incoming edges.
    const sorted = [...concepts].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
    const anchor = sorted[0].id;

    const level = { [anchor]: 0 };
    const queue = [anchor];
    const visited = new Set();
    while (queue.length) {
      const id = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      (neighbors[id] || []).forEach((neighborId) => {
        if (!(neighborId in level)) { level[neighborId] = level[id] + 1; queue.push(neighborId); }
      });
    }
    // Anything not reachable from the anchor (a separate, disconnected cluster)
    // still needs a row — treat it as its own extra top row rather than
    // breaking the layout.
    nodeIds.forEach((id) => { if (!(id in level)) level[id] = 0; });

    const byLevel = {};
    nodeIds.forEach((id) => { (byLevel[level[id]] = byLevel[level[id]] || []).push(id); });

    const LEVEL_HEIGHT = 220, NODE_SPACING = 260, CENTER_X = 500, BASE_Y = 80;
    // Default origin when nothing else is on the canvas (the common case,
    // and identical to the old fixed-origin behavior — no regression for a
    // canvas that's just a concept tree). With obstacles, treat the tree's
    // own overall footprint as one item and find it a genuinely free spot
    // via the same ring-search used for every other object on the canvas,
    // rather than always landing at the same fixed spot regardless.
    let originDX = 0, originDY = 0;
    if (obstacles.length > 0) {
      const levelCount = Object.keys(byLevel).length;
      const maxRowWidth = Math.max(...Object.values(byLevel).map((ids) => ids.length * NODE_SPACING));
      const treeOrigin = findFreePosition(CENTER_X - maxRowWidth / 2, BASE_Y, obstacles, maxRowWidth, levelCount * LEVEL_HEIGHT);
      originDX = treeOrigin.x - (CENTER_X - maxRowWidth / 2);
      originDY = treeOrigin.y - BASE_Y;
    }
    const newPos = {};
    Object.keys(byLevel).map(Number).sort((a, b) => a - b).forEach((l) => {
      const ids = byLevel[l];
      const startX = CENTER_X - (ids.length * NODE_SPACING) / 2 + originDX;
      ids.forEach((id, i) => { newPos[id] = { x: startX + i * NODE_SPACING, y: BASE_Y + l * LEVEL_HEIGHT + originDY }; });
    });
    setCanvasConcepts((prev) => (overrideConcepts || prev).map((c) => newPos[c.id] ? { ...c, x: newPos[c.id].x, y: newPos[c.id].y } : c));

    // Route edges to match the new tree — a straight line makes sense on a
    // freely-positioned canvas, but once everything's aligned into neat rows,
    // an org-chart-style elbow (down, across, down) reads much more clearly
    // than a fan of diagonals. This writes real waypoints using the same
    // manual-bend field the hover handles use — it doesn't change the global
    // default, only what Organize itself produces.
    const STUB = 40;
    // Multiple edges sharing the same parent (or the same child) mustn't all
    // leave/arrive at that box's exact center — that's what made every arrow
    // into or out of a busy node converge on one pixel. Spread each group
    // evenly across the box's width instead, ordered by where the other end
    // sits, so siblings fan out left-to-right without crossing.
    const crossLevelEdges = edges.filter((e) => {
      const sl = level[e.sourceId], tl = level[e.targetId];
      return sl !== undefined && tl !== undefined && newPos[e.sourceId] && newPos[e.targetId] && sl !== tl;
    });
    const edgeHigherIsSource = {};
    const exitGroups = {}, entryGroups = {};
    crossLevelEdges.forEach((e) => {
      const higherIsSource = level[e.sourceId] < level[e.targetId];
      edgeHigherIsSource[e.id] = higherIsSource;
      const higherId = higherIsSource ? e.sourceId : e.targetId;
      const lowerId = higherIsSource ? e.targetId : e.sourceId;
      (exitGroups[higherId] = exitGroups[higherId] || []).push(e);
      (entryGroups[lowerId] = entryGroups[lowerId] || []).push(e);
    });
    const otherEndId = (e, nodeId) => (e.sourceId === nodeId ? e.targetId : e.sourceId);
    [exitGroups, entryGroups].forEach((groups) => {
      Object.keys(groups).forEach((nodeId) => {
        groups[nodeId].sort((a, b) => newPos[otherEndId(a, nodeId)].x - newPos[otherEndId(b, nodeId)].x);
      });
    });
    const fanX = (groups, nodeId, edgeId, baseX) => {
      const group = groups[nodeId];
      if (!group || group.length <= 1) return baseX;
      const idx = group.findIndex((g) => g.id === edgeId);
      const usable = Math.min(CONCEPT_W - 32, (group.length - 1) * 28);
      return baseX - usable / 2 + idx * (usable / (group.length - 1));
    };
    setCanvasEdges((prev) => (overrideEdges || prev).map((e) => {
      const srcLevel = level[e.sourceId], tgtLevel = level[e.targetId];
      const srcPos = newPos[e.sourceId], tgtPos = newPos[e.targetId];
      if (srcLevel === undefined || tgtLevel === undefined || !srcPos || !tgtPos || srcLevel === tgtLevel) {
        return e; // same-row or partially-outside-selection edges are left as straight lines
      }
      const higherIsSource = edgeHigherIsSource[e.id];
      const higher = higherIsSource ? srcPos : tgtPos, lower = higherIsSource ? tgtPos : srcPos;
      const higherId = higherIsSource ? e.sourceId : e.targetId;
      const lowerId = higherIsSource ? e.targetId : e.sourceId;
      const higherAnchor = "bottom", lowerAnchor = "top";
      const hCenterX = fanX(exitGroups, higherId, e.id, higher.x + CONCEPT_W / 2), hBottomY = higher.y + CONCEPT_H;
      const lCenterX = fanX(entryGroups, lowerId, e.id, lower.x + CONCEPT_W / 2), lTopY = lower.y;
      const midY = hBottomY + (lTopY - hBottomY - STUB) / 2 + STUB / 2;
      // Waypoint order must follow the edge's actual source→target direction —
      // not always "higher node first" — or edges where the source happens to
      // be the physically lower node zigzag: jump to the other node's X, then
      // jump back, before finally heading to the target.
      const waypoints = higherIsSource
        ? [{ x: hCenterX, y: midY }, { x: lCenterX, y: midY }]
        : [{ x: lCenterX, y: midY }, { x: hCenterX, y: midY }];
      return { ...e, waypoints,
        sourceAnchor: higherIsSource ? higherAnchor : lowerAnchor,
        targetAnchor: higherIsSource ? lowerAnchor : higherAnchor };
    }));
  };

  const allCanvasItems = () => [
    ...stickies.map((s) => ({ x: s.x, y: s.y, w: s.width || 160, h: s.height || 120 })),
    ...canvasConcepts.map((c) => ({ x: c.x, y: c.y, w: c.width || CONCEPT_W, h: c.height || CONCEPT_H })),
    ...canvasTexts.map((t) => ({ x: t.x, y: t.y, w: t.width || 220, h: t.height || 80 })),
    ...shapes.map((s) => ({ x: s.x, y: s.y, w: s.width || 100, h: s.height || 90 })),
  ];
  const canvasCenter = () => {
    const rect = canvasRef.current.getBoundingClientRect();
    return screenToCanvas(rect.left + rect.width / 2, rect.top + rect.height / 2);
  };

  const addSticky = () => {
    const center = canvasCenter();
    const pos = findFreePosition(center.x - 80, center.y - 60, allCanvasItems(), 160, 120);
    setStickies((prev) => [...prev, {
      id: newCanvasId("sticky"), x: pos.x, y: pos.y, width: 160, height: 120, zIndex: zCounterRef.current++,
      text: "New idea", color: STICKY_COLORS[stickies.length % STICKY_COLORS.length],
    }]);
  };

  const addConcept = (conceptType, dropPoint) => {
    const center = dropPoint || canvasCenter();
    const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - CONCEPT_H / 2, allCanvasItems(), CONCEPT_W, CONCEPT_H);
    const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: CONCEPT_H, conceptType, name: `New ${conceptType}`, attributes: {}, pushed: false, zIndex: zCounterRef.current++ };
    setCanvasConcepts((prev) => [...prev, concept]);
    setEditingConceptId(concept.id);
  };

  const addText = () => {
    const center = canvasCenter();
    const pos = findFreePosition(center.x - 110, center.y - 40, allCanvasItems(), 220, 80);
    const text = {
      id: newCanvasId("text"), x: pos.x, y: pos.y, width: 220, height: 80, content: "Text", zIndex: zCounterRef.current++,
      fontSize: 16, color: COLORS.ink, bold: false, italic: false, align: "left", valign: "top",
    };
    setCanvasTexts((prev) => [...prev, text]);
    setEditingTextId(text.id);
  };

  const SHAPE_W = 92, SHAPE_H = 76;
  const SHAPE_CATEGORY_COLOR = { Basic: "#4A5A78", Cloud: "#2C7A8C", Network: "#5A6B99", Security: "#F0384D", Generic: "#7A6A73", BPM: "#0EA968" };

  // Built-in shapes (SHAPE_INDEX, a module-level constant) plus whatever
  // vendor icon packs this graph has imported — one flat lookup so addShape
  // and the on-canvas renderer don't need to know which world a shapeKey
  // came from. Icon keys already carry a random suffix (see
  // submitImportPalette), so collisions across packs aren't a real risk.
  const customShapeIndex = {};
  customPalettes.forEach((p) => (p.icons || []).forEach((ic) => { customShapeIndex[ic.key] = { ...normalizeIcon(ic), renderMode: "svg" }; }));
  const getShapeDef = (key) => SHAPE_INDEX[key] || customShapeIndex[key];

  const addShape = (category, shapeKey, dropPoint) => {
    const def = getShapeDef(shapeKey);
    if (!def) return;
    const center = dropPoint || canvasCenter();
    const pos = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, allCanvasItems(), SHAPE_W, SHAPE_H);
    setShapes((prev) => [...prev, {
      id: newCanvasId("shape"), x: pos.x, y: pos.y, width: SHAPE_W, height: SHAPE_H, zIndex: zCounterRef.current++,
      category, shapeKey, label: def.label,
    }]);
    setShowShapePalette(false);
  };

  const deleteCustomPalette = async (paletteId) => {
    const palette = customPalettes.find((p) => p.id === paletteId);
    if (!palette) return;
    if (!(await askConfirm(`Delete the "${palette.name}" palette? This removes it for everyone connected to this graph. Any shapes already placed from it on a canvas will show as a blank labelled box from then on, not disappear.`, { danger: true, confirmLabel: "Delete" }))) return;
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader, `MATCH (p:ShapePalette {id: $id}) DETACH DELETE p`, { id: paletteId });
      setCustomPalettes((prev) => prev.filter((p) => p.id !== paletteId));
      if (shapePaletteCategory === paletteId) setShapePaletteCategory("Basic");
    } catch (e) {
      setCanvasStatus(`Couldn't delete palette: ${e.message}`);
    }
  };

  // Reads each selected file and stages it for review before anything is
  // saved — a rejected/unreadable file shows inline as an error row instead
  // of silently vanishing or blocking the rest of the batch. A .zip (the
  // real shape a vendor's own download comes in — AWS's Architecture Icons
  // package is exactly this: nested folders, mixed .svg/.png, every icon
  // repeated at several sizes) goes through extractIconsFromZip, which
  // already collapses those duplicates to one entry per icon; individual
  // .svg/.png files selected directly are staged one-for-one.
  const readSvgFile = (f) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const clean = sanitizeSvgIcon(String(reader.result));
      const label = labelFromIconFileName(f.name);
      resolve(clean
        ? { key: `${toSnakeCase(label)}_${newCanvasId("icon").slice(-6)}`, label, type: "svg", content: clean, fileName: f.name }
        : { fileName: f.name, error: "Not a valid SVG, or didn't survive sanitizing — skipped." });
    };
    reader.onerror = () => resolve({ fileName: f.name, error: "Couldn't be read — skipped." });
    reader.readAsText(f);
  });
  const readPngFile = (f) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const label = labelFromIconFileName(f.name);
      resolve({ key: `${toSnakeCase(label)}_${newCanvasId("icon").slice(-6)}`, label, type: "png", content: String(reader.result), fileName: f.name });
    };
    reader.onerror = () => resolve({ fileName: f.name, error: "Couldn't be read — skipped." });
    reader.readAsDataURL(f);
  });
  const handleImportPaletteFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const zipFile = files.find((f) => /\.zip$/i.test(f.name));
    if (zipFile) {
      setImportPaletteStatus(`Reading ${zipFile.name}… large icon packs can take a few seconds.`);
      try {
        const { icons, totalFiles } = await extractIconsFromZip(zipFile);
        setImportPaletteStaged((prev) => [...prev, ...icons]);
        setImportPaletteStatus(
          totalFiles === 0
            ? `No .svg or .png files found inside ${zipFile.name}.`
            : `Found ${totalFiles} image file${totalFiles === 1 ? "" : "s"} in the zip, collapsed to ${icons.length} unique icon${icons.length === 1 ? "" : "s"} (duplicate sizes and formats removed automatically).`
        );
      } catch (e) {
        setImportPaletteStatus(`Couldn't read ${zipFile.name}: ${e.message}`);
      }
      return;
    }
    const results = await Promise.all(files.map((f) => (/\.png$/i.test(f.name) ? readPngFile(f) : readSvgFile(f))));
    setImportPaletteStaged((prev) => [...prev, ...results]);
  };

  const submitImportPalette = async () => {
    const validIcons = importPaletteStaged.filter((s) => s.content);
    if (!validIcons.length) { setImportPaletteStatus("No valid icons to import yet."); return; }
    const iconsToSave = validIcons.map((s) => ({ key: s.key, label: s.label, type: s.type, content: s.content }));
    setImportPaletteBusy(true);
    setImportPaletteStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      if (importPaletteTargetId) {
        const existing = customPalettes.find((p) => p.id === importPaletteTargetId);
        const mergedIcons = [...(existing ? existing.icons : []), ...iconsToSave];
        await runCypher(apiUrl, authHeader,
          `MATCH (p:ShapePalette {id: $id}) SET p.icons = $icons`,
          { id: importPaletteTargetId, icons: JSON.stringify(mergedIcons) }
        );
        setCustomPalettes((prev) => prev.map((p) => p.id === importPaletteTargetId ? { ...p, icons: mergedIcons } : p));
        setShapePaletteCategory(importPaletteTargetId);
      } else {
        const name = importPaletteName.trim();
        if (!name) { setImportPaletteStatus("Give the palette a name first."); setImportPaletteBusy(false); return; }
        const id = newCanvasId("palette");
        await runCypher(apiUrl, authHeader,
          `CREATE (p:ShapePalette {id: $id, name: $name, createdAt: $now, icons: $icons})`,
          { id, name, now: new Date().toISOString(), icons: JSON.stringify(iconsToSave) }
        );
        setCustomPalettes((prev) => [...prev, { id, name, icons: iconsToSave }]);
        setShapePaletteCategory(id);
      }
      setShowImportPalette(false);
      setImportPaletteStaged([]);
      setImportPaletteName("");
      setImportPaletteTargetId("");
      setImportPaletteStatus("");
      setShowShapePalette(true);
    } catch (e) {
      setImportPaletteStatus(`Couldn't save: ${e.message}`);
    } finally {
      setImportPaletteBusy(false);
    }
  };

  // Drag-and-drop placement, Visio-style: a palette item (concept type or
  // shape) is draggable, and dropping it on the canvas places it exactly
  // where the cursor lands — via the same screenToCanvas conversion the
  // rest of the canvas already uses for pan/zoom-aware coordinates —
  // instead of always dumping new items at the viewport center and making
  // the user drag them into place afterward. Click-to-place from the
  // palette buttons still works exactly as before; this is additive.
  const PALETTE_DRAG_MIME = "application/x-bdcore-palette-item";
  const handlePaletteDragStart = (e, payload) => {
    e.dataTransfer.setData(PALETTE_DRAG_MIME, JSON.stringify(payload));
    e.dataTransfer.effectAllowed = "copy";
  };
  const handleCanvasDragOver = (e) => {
    if (!e.dataTransfer.types.includes(PALETTE_DRAG_MIME)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    if (!canvasDragOver) setCanvasDragOver(true);
  };
  const handleCanvasDragLeave = (e) => {
    if (e.target === canvasRef.current) setCanvasDragOver(false);
  };
  const handleCanvasDrop = (e) => {
    const raw = e.dataTransfer.getData(PALETTE_DRAG_MIME);
    setCanvasDragOver(false);
    if (!raw) return;
    e.preventDefault();
    let payload;
    try { payload = JSON.parse(raw); } catch { return; }
    const point = screenToCanvas(e.clientX, e.clientY);
    if (payload.kind === "concept") {
      addConcept(payload.conceptType, point);
      setShowConceptPicker(false);
    } else if (payload.kind === "shape") {
      addShape(payload.category, payload.shapeKey, point);
    }
  };

  // Turns a /canvas-chat plan (pulled real entities + new concepts/shapes/
  // stickies + connections) into actual canvas objects. Builds everything in
  // local arrays first rather than calling setState per item — React state
  // updates are async/batched, so checking collision against "what's already
  // on the canvas" via the live state mid-batch would miss items added
  // moments earlier in the same plan, causing overlaps.
  // seed lets a caller that just switched to a different (guaranteed-empty)
  // canvas hand over its known-fresh starting arrays explicitly, instead of
  // this function reading canvasConcepts/shapes/stickies etc. off the
  // closure — those are whatever canvas was open when THIS async chain
  // started, which a just-awaited switchCanvas/loadCanvasData does NOT
  // retroactively update (setState from that call only affects future
  // renders, not variables this closure already captured), so without a
  // seed the plan would land on top of the previous canvas's content.
  const executeCanvasPlan = async (plan, seed) => {
    const localConcepts = [...(seed ? seed.concepts : canvasConcepts)];
    const localShapes = [...(seed ? seed.shapes : shapes)];
    const localStickies = [...(seed ? seed.stickies : stickies)];
    const localCanvasEdges = [...(seed ? seed.edges : canvasEdges)];
    const localShapeEdges = [...(seed ? seed.shapeEdges : shapeEdges)];
    const idMap = {}, kindMap = {}; // tempId or "pull:i:j" -> real canvas id / which array it's in

    const occupied = () => [
      ...localConcepts.map((c) => ({ x: c.x, y: c.y, w: c.width || CONCEPT_W, h: c.height || CONCEPT_H })),
      ...localShapes.map((s) => ({ x: s.x, y: s.y, w: s.width || SHAPE_W, h: s.height || SHAPE_H })),
      ...localStickies.map((s) => ({ x: s.x, y: s.y, w: s.width || 160, h: s.height || 120 })),
    ];
    const center = canvasCenter();
    const apiUrl = deriveQueryApiUrl(uri, dbName);
    const authHeader = "Basic " + btoa(`${username}:${password}`);

    // 1. Real entities pulled from the graph — same shape as manual "Add From Graph"
    for (let i = 0; i < (plan.pulled || []).length; i++) {
      const rows = plan.pulled[i].rows || [];
      for (let j = 0; j < rows.length; j++) {
        const row = rows[j];
        if (!row.id || !row.name || !row.type) continue;
        const existing = localConcepts.find((c) => c.realId === row.id);
        if (existing) { idMap[`pull:${i}:${j}`] = existing.id; kindMap[`pull:${i}:${j}`] = "concept"; continue; }
        try {
          const nodeRows = await runCypher(apiUrl, authHeader, `MATCH (n:Instance:${row.type} {id: $id}) RETURN properties(n) AS props`, { id: row.id });
          if (!nodeRows[0]) continue;
          const { id: _id, name: realName, ...rest } = nodeRows[0].props;
          const finalName = realName || row.name;
          const h = estimateConceptHeight(finalName, CONCEPT_W, CONCEPT_H);
          const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - h / 2, occupied(), CONCEPT_W, h);
          const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: h,
            conceptType: row.type, name: finalName, attributes: rest, pushed: true, realId: row.id, zIndex: zCounterRef.current++ };
          localConcepts.push(concept);
          idMap[`pull:${i}:${j}`] = concept.id;
          kindMap[`pull:${i}:${j}`] = "concept";
        } catch (e) { /* skip this one, don't block the rest of the plan */ }
      }
    }

    // 2. New concepts/shapes/stickies — BPM shapes get a deliberate left-to-right
    // sequence since they're meant to read as a flow, not a scatter
    let bpmX = null, bpmY = null;
    let stickyStackOrigin = null, stickyStackCount = 0;
    (plan.create || []).forEach((item) => {
      if (item.kind === "concept" && CANVAS_CONCEPT_TYPES.includes(item.conceptType)) {
        const name = item.name || `New ${item.conceptType}`;
        const h = estimateConceptHeight(name, CONCEPT_W, CONCEPT_H);
        const pos = findFreePosition(center.x - CONCEPT_W / 2, center.y - h / 2, occupied(), CONCEPT_W, h);
        const attrs = {};
        Object.entries(item.attributes || {}).forEach(([k, v]) => { attrs[toSnakeCase(k)] = v; });
        const concept = { id: newCanvasId("concept"), x: pos.x, y: pos.y, width: CONCEPT_W, height: h,
          conceptType: item.conceptType, name, attributes: attrs, pushed: false, zIndex: zCounterRef.current++ };
        localConcepts.push(concept);
        idMap[item.tempId] = concept.id; kindMap[item.tempId] = "concept";
      } else if (item.kind === "shape" && SHAPE_INDEX[item.shapeKey]) {
        const def = SHAPE_INDEX[item.shapeKey];
        let pos;
        if (item.category === "BPM") {
          if (bpmX === null) { const s = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, occupied(), SHAPE_W, SHAPE_H); bpmX = s.x; bpmY = s.y; }
          else { bpmX += SHAPE_W + 60; }
          pos = { x: bpmX, y: bpmY };
        } else {
          pos = findFreePosition(center.x - SHAPE_W / 2, center.y - SHAPE_H / 2, occupied(), SHAPE_W, SHAPE_H);
        }
        const shape = { id: newCanvasId("shape"), x: pos.x, y: pos.y, width: SHAPE_W, height: SHAPE_H,
          zIndex: zCounterRef.current++, category: item.category, shapeKey: item.shapeKey, label: item.label || def.label };
        localShapes.push(shape);
        idMap[item.tempId] = shape.id; kindMap[item.tempId] = "shape";
      } else if (item.kind === "sticky") {
        // Multiple stickies from the same plan (e.g. several ideation options)
        // stack into one tidy column off to the side, instead of each
        // independently ring-searching out from the same center point and
        // landing in a scatter. The column sits clear of where a concept
        // tree from this same plan will end up (autoOrganizeCanvas below
        // treats this column as an obstacle it lays the tree out around).
        let desiredX, desiredY;
        if (stickyStackOrigin === null) {
          const seed = findFreePosition(center.x + 420, center.y - 200, occupied(), 160, 120);
          stickyStackOrigin = seed;
          desiredX = seed.x; desiredY = seed.y;
        } else {
          stickyStackCount += 1;
          desiredX = stickyStackOrigin.x;
          desiredY = stickyStackOrigin.y + stickyStackCount * 140;
        }
        const pos = findFreePosition(desiredX, desiredY, occupied(), 160, 120);
        const sticky = { id: newCanvasId("sticky"), x: pos.x, y: pos.y, width: 160, height: 120,
          zIndex: zCounterRef.current++, text: item.text || "New idea", color: STICKY_COLORS[localStickies.length % STICKY_COLORS.length] };
        localStickies.push(sticky);
        idMap[item.tempId] = sticky.id; kindMap[item.tempId] = "sticky";
      }
    });

    // 3. Connections — concepts only connect to concepts (governed verb),
    // shapes only connect to shapes (free label); silently skipped if the
    // plan tried to cross the two, since there's no connector for that yet
    (plan.connections || []).forEach((conn) => {
      const fromId = idMap[conn.from], toId = idMap[conn.to];
      const fromKind = kindMap[conn.from], toKind = kindMap[conn.to];
      if (!fromId || !toId || fromKind !== toKind || fromId === toId) return;
      if (fromKind === "concept" && conn.kind === "concept") {
        localCanvasEdges.push({ id: newCanvasId("edge"), sourceId: fromId, targetId: toId, verb: conn.verb || "relates to",
          pushed: false, sourceAnchor: "right", targetAnchor: "left", waypoints: [] });
      } else if (fromKind === "shape" && conn.kind === "shape") {
        localShapeEdges.push({ id: newCanvasId("sedge"), sourceId: fromId, targetId: toId, label: conn.label || "",
          sourceAnchor: "right", targetAnchor: "left", waypoints: [] });
      }
    });

    // 4. Recolor — always an existing (or just-pulled/just-created) object,
    // never a brand-new one, so "id" resolves through idMap first (covers a
    // tempId from this same plan's "create", or a pull:i:j reference) and
    // falls back to the literal id, which is what a pre-existing canvas
    // object (from the snapshot the model was shown) looks like.
    const isValidColor = (c) => c === null || (typeof c === "string" && /^#[0-9a-fA-F]{3,8}$/.test(c));
    (plan.recolor || []).forEach((item) => {
      if (!isValidColor(item.color)) return;
      const targetId = idMap[item.id] || item.id;
      const label = item.label || null;
      let idx = localStickies.findIndex((s) => s.id === targetId);
      if (idx !== -1) { if (item.color) localStickies[idx] = { ...localStickies[idx], color: item.color }; return; }
      idx = localConcepts.findIndex((c) => c.id === targetId);
      if (idx !== -1) { localConcepts[idx] = { ...localConcepts[idx], highlightColor: item.color, highlightLabel: item.color ? label : null }; return; }
      idx = localShapes.findIndex((s) => s.id === targetId);
      if (idx !== -1) { localShapes[idx] = { ...localShapes[idx], highlightColor: item.color, highlightLabel: item.color ? label : null }; }
    });

    setShapes(localShapes);
    setStickies(localStickies);
    setShapeEdges(localShapeEdges);
    setCanvasConcepts(localConcepts);
    setCanvasEdges(localCanvasEdges);
    // Pass the fresh local arrays explicitly rather than relying on state —
    // React hasn't necessarily re-rendered with the setState calls above yet
    // (same reason shapes/stickies are passed too, so the tree lays out
    // around the stickies this same plan just placed, not an empty canvas).
    autoOrganizeCanvas(localConcepts, localCanvasEdges, localShapes, localStickies);
  };

  // What the AI sees of the canvas today — just enough per object to answer
  // "recolor" requests (real-world risk data for anything pulled from the
  // graph) and to avoid re-creating something that's already there, without
  // shipping the entire portfolio on every request.
  const buildCanvasSnapshot = () => [
    ...canvasConcepts.map((c) => {
      const real = c.realId ? appsWithDisposition.find((a) => a.id === c.realId) : null;
      return {
        id: c.id, kind: "concept", conceptType: c.conceptType, name: c.name, attributes: c.attributes,
        ...(real ? { realData: {
          criticality: real.criticality, status: real.status, hosting: real.hosting,
          disposition: real.disposition ? real.disposition.code : null, risks: real.risks,
          businessValue: real.businessValue, techHealth: real.techHealth,
          aiReadiness: real.aiReadiness, aiRelevance: real.aiRelevance,
        } } : {}),
      };
    }),
    ...shapes.map((s) => ({ id: s.id, kind: "shape", category: s.category, shapeKey: s.shapeKey, label: s.label })),
    ...stickies.map((s) => ({ id: s.id, kind: "sticky", text: s.text })),
  ];

  // Shared by the manual "Draw on canvas" box and escalateToCanvas's
  // auto-fired ideation prompt — snapshot is passed in rather than always
  // read fresh, since a just-created canvas's state hasn't necessarily
  // flushed yet when its first request goes out. seed (see executeCanvasPlan)
  // is only passed by escalateToCanvas, for the same reason.
  const runCanvasChatRequest = async (requestText, canvasSnapshot, seed) => {
    // Prior turns only — the current request is sent separately as "request",
    // matching what chat_server.py expects — so a follow-up like "which of
    // those would you recommend?" has the actual conversation to resolve
    // "those" against, on top of the live canvas snapshot it's sent every time.
    const historyForRequest = canvasChatLog
      .filter((m) => !m.error)
      .map((m) => ({ role: m.role, content: m.content }));
    setCanvasChatLog((prev) => [...prev, { role: "user", content: requestText }]);
    setCanvasChatOpen(true);
    setCanvasChatLoading(true);
    try {
      const res = await fetch("http://localhost:5050/canvas-chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ request: requestText, canvas: canvasSnapshot, history: historyForRequest }),
      });
      if (!res.ok) throw new Error(`Chat backend returned ${res.status}`);
      const data = await res.json();
      if (data.error) { setCanvasChatLog((prev) => [...prev, { role: "assistant", content: data.error, error: true }]); return; }
      await executeCanvasPlan(data, seed);
      // A compact "what actually happened" chip, separate from the reply's own
      // prose — the mechanical tally, not the narrative, so the reply can stay
      // focused on what the changes actually mean rather than how they were made.
      const meta = {
        pulled: (data.pulled || []).reduce((sum, p) => sum + (p.rows ? p.rows.length : 0), 0),
        created: (data.create || []).length,
        connected: (data.connections || []).length,
        recolored: (data.recolor || []).length,
      };
      const hasChanges = meta.pulled || meta.created || meta.connected || meta.recolored;
      setCanvasChatLog((prev) => [...prev, { role: "assistant", content: data.reply || "Done.", meta: hasChanges ? meta : null }]);
    } catch (e) {
      setCanvasChatLog((prev) => [...prev, { role: "assistant",
        content: `Couldn't reach the chat backend: ${e.message}. Is chat_server.py running on port 5050?`, error: true }]);
    } finally {
      setCanvasChatLoading(false);
    }
  };

  const sendCanvasChatMessage = async () => {
    const requestText = canvasChatInput.trim();
    if (!requestText || canvasChatLoading) return;
    setCanvasChatInput("");
    await runCanvasChatRequest(requestText, buildCanvasSnapshot());
  };

  // "Ideate on Canvas" from an Action Center item — opens a small dialog to
  // name the new canvas and choose its workspace (existing or new) before
  // anything is created, rather than silently auto-naming and picking the
  // first workspace.
  const openEscalateDialog = (item) => {
    setEscalateDialog({
      item, canvasName: `Fix: ${item.title}`.slice(0, 80),
      workspaceMode: workspaces.length > 0 ? "existing" : "new",
      workspaceId: workspaces[0] ? workspaces[0].id : null,
      newWorkspaceName: "New Workspace",
    });
  };

  // Creates the chosen workspace (if new) and canvas, then fires an AI-drawn
  // first pass at it, seeded with the item's own real entity names so the
  // model has something concrete to pull in rather than a vague request.
  // Generic across every Action Center category on purpose — a hand-tuned
  // prompt per category would read better in the best case, but creates 9
  // things to keep in sync with whatever those categories become; the
  // pull+create machinery already handles "pull in X and sketch options"
  // well regardless of what X is. The empty seed passed to
  // runCanvasChatRequest matters just as much as the dialog itself — without
  // it this draws onto whatever canvas was open before escalating, since a
  // just-awaited switchCanvas doesn't retroactively fix up this closure's
  // already-captured canvasConcepts/stickies/etc.
  const confirmEscalate = async () => {
    const d = escalateDialog;
    if (!d) return;
    setEscalateDialog(null);
    let workspaceId = d.workspaceMode === "existing" ? d.workspaceId : null;
    if (!workspaceId) workspaceId = await createWorkspace((d.newWorkspaceName || "New Workspace").trim() || "New Workspace");
    if (!workspaceId) return;
    const canvasId = await createCanvasInWorkspace(workspaceId, (d.canvasName || "").trim() || `Fix: ${d.item.title}`.slice(0, 80));
    if (!canvasId) return;
    const entities = d.item.entities || [];
    const entityText = entities.length
      ? `Pull in ${entities.slice(0, 5).join(", ")}${entities.length > 5 ? `, and ${entities.length - 5} more` : ""}. `
      : "";
    const prompt = `${entityText}Sketch 2-3 concrete options for addressing this: ${d.item.title} — ${d.item.description}`;
    await runCanvasChatRequest(prompt, [], { concepts: [], shapes: [], stickies: [], edges: [], shapeEdges: [] });
  };

  const deleteShape = (id) => {
    setShapes((prev) => prev.filter((s) => s.id !== id));
    setShapeEdges((prev) => prev.filter((e) => e.sourceId !== id && e.targetId !== id));
  };
  const deleteShapeEdge = (id) => setShapeEdges((prev) => prev.filter((e) => e.id !== id));
  const updateShapeLabel = (id, label) => setShapes((prev) => prev.map((s) => s.id === id ? { ...s, label } : s));

  const handleShapeHandleMouseDown = (e, shapeId, anchor) => {
    e.stopPropagation();
    const shape = shapes.find((s) => s.id === shapeId);
    const start = shape ? getAnchorPoint(shape, shape.width || SHAPE_W, shape.height || SHAPE_H, anchor) : screenToCanvas(e.clientX, e.clientY);
    setShapeConnectDrag({ sourceId: shapeId, sourceAnchor: anchor, x: start.x, y: start.y });
  };
  // Shape connections skip the ontology verb picker entirely — they're not
  // relationships in the graph, just a labeled line on a diagram — so this
  // just prompts for optional free text instead of opening a picker panel.
  const completeShapeConnect = async (targetId, targetAnchor) => {
    if (!shapeConnectDrag || shapeConnectDrag.sourceId === targetId) { setShapeConnectDrag(null); return; }
    const label = (await askPrompt("Label this connection (optional):", "")) || "";
    setShapeEdges((prev) => [...prev, { id: newCanvasId("sedge"), sourceId: shapeConnectDrag.sourceId, targetId, label,
      sourceAnchor: shapeConnectDrag.sourceAnchor, targetAnchor, waypoints: [] }]);
    setShapeConnectDrag(null);
  };

  // Freehand arrow: explicit Finish/Cancel rather than double-click detection —
  // a double-click involves two click events firing before the dblclick event,
  // which would either duplicate the final point or need extra bookkeeping to
  // suppress it. A Finish button sidesteps that whole class of timing issue.
  const startArrowDraw = () => { setArrowDrawMode(true); setArrowDraftPoints([]); setArrowPreviewPoint(null); };
  const addArrowDraftPoint = (point) => setArrowDraftPoints((prev) => [...prev, point]);
  const finishArrowDraw = () => {
    if (arrowDraftPoints.length >= 2) {
      setFreeArrows((prev) => [...prev, { id: newCanvasId("arrow"), points: arrowDraftPoints }]);
    }
    setArrowDrawMode(false); setArrowDraftPoints([]); setArrowPreviewPoint(null);
  };
  const cancelArrowDraw = () => { setArrowDrawMode(false); setArrowDraftPoints([]); setArrowPreviewPoint(null); };
  const deleteArrow = (id) => setFreeArrows((prev) => prev.filter((a) => a.id !== id));
  // Layering — z-index wasn't tracked at all before, stacking was just
  // accidental DOM order across four separate arrays. This treats every
  // canvas object as one combined stack regardless of type.
  const getAllLayeredObjects = () => [
    ...stickies.map((o) => ({ kind: "sticky", id: o.id, zIndex: o.zIndex || 0 })),
    ...canvasConcepts.map((o) => ({ kind: "concept", id: o.id, zIndex: o.zIndex || 0 })),
    ...canvasTexts.map((o) => ({ kind: "text", id: o.id, zIndex: o.zIndex || 0 })),
    ...shapes.map((o) => ({ kind: "shape", id: o.id, zIndex: o.zIndex || 0 })),
  ];
  const setObjectZIndex = (kind, id, z) => {
    const updater = (prev) => prev.map((o) => o.id === id ? { ...o, zIndex: z } : o);
    if (kind === "sticky") setStickies(updater);

    else if (kind === "text") setCanvasTexts(updater);
    else if (kind === "shape") setShapes(updater);

  const sendToBack = (kind, id) => {
    const all = getAllLayeredObjects();
    setObjectZIndex(kind, id, Math.min(0, ...all.map((o) => o.zIndex)) - 1);

  const bringForward = (kind, id) => {
    const all = getAllLayeredObjects().sort((a, b) => a.zIndex - b.zIndex);

    setObjectZIndex(next.kind, next.id, all[idx].zIndex);

  const sendBackward = (kind, id) => {
    const all = getAllLayeredObjects().sort((a, b) => a.zIndex - b.zIndex);
    const idx = all.findIndex((o) => o.kind === kind && o.id === id);
    if (idx <= 0) return;

    setObjectZIndex(kind, id, prevObj.zIndex);
    setObjectZIndex(prevObj.kind, prevObj.id, all[idx].zIndex);
  };
  const openContextMenu = (e, kind, id) => {
    e.preventDefault();
    e.stopPropagation();
    setContextMenu({ x: e.clientX, y: e.clientY, kind, id });

  const closeContextMenu = () => setContextMenu(null);
  const contextMenuDelete = () => {
    if (!contextMenu) return;
    const { kind, id } = contextMenu;
    if (kind === "sticky") deleteSticky(id);
    else if (kind === "text") deleteText(id);
    else if (kind === "shape") deleteShape(id);

  const handleArrowPointMouseDown = (e, arrowId, pointIndex) => {
    e.stopPropagation();

  const handleArrowLineMouseDown = (e, arrowId) => {
    e.stopPropagation();

    setDraggingWholeArrow({ arrowId, startMouse: point, startPoints: arrow.points });

  const handleArrowSegmentMouseDown = (e, arrowId, segmentIndex, midpoint) => {

  // Same mechanism as free arrows, applied to concept/shape edges — lets a

  const handleEdgeWaypointMouseDown = (e, kind, edgeId, pointIndex) => {

    e.stopPropagation();

  const deleteSticky = (id) => setStickies((prev) => prev.filter((s) => s.id !== id));

  const deleteConcept = async (id, pushed) => {
    if (pushed && !(await askConfirm("This concept was already pushed to Neo4j. Removing it here only removes it from the canvas — the real node stays in the graph. Continue?"))) return;
    setCanvasConcepts((prev) => prev.filter((c) => c.id !== id));
    setCanvasEdges((prev) => prev.filter((e) => e.sourceId !== id && e.targetId !== id));

  const deleteEdge = (id) => setCanvasEdges((prev) => prev.filter((e) => e.id !== id));

  const findCanvasItem = (kind, id) => {

  const deleteSelected = async () => {
    if (selectedIds.size === 0) return;

    selectedIds.forEach((key) => {
      const [kind, id] = key.split(":");
      if (idsByKind[kind]) idsByKind[kind].add(id);

    const pushedCount = canvasConcepts.filter((c) => idsByKind.concept.has(c.id) && c.pushed).length;
    if (pushedCount > 0 && !(await askConfirm(
      `${pushedCount} of the selected concepts were already pushed to Neo4j. Removing them here only removes them from the canvas — the real nodes stay in the graph. Continue?`
    ))) return;
    if (idsByKind.sticky.size) setStickies((prev) => prev.filter((s) => !idsByKind.sticky.has(s.id)));
    if (idsByKind.text.size) setCanvasTexts((prev) => prev.filter((t) => !idsByKind.text.has(t.id)));
    if (idsByKind.concept.size) {
      setCanvasConcepts((prev) => prev.filter((c) => !idsByKind.concept.has(c.id)));
      setCanvasEdges((prev) => prev.filter((e) => !idsByKind.concept.has(e.sourceId) && !idsByKind.concept.has(e.targetId)));
    }
    if (idsByKind.shape.size) {
      setShapes((prev) => prev.filter((s) => !idsByKind.shape.has(s.id)));
      setShapeEdges((prev) => prev.filter((e) => !idsByKind.shape.has(e.sourceId) && !idsByKind.shape.has(e.targetId)));
    }
    if (editingConceptId && idsByKind.concept.has(editingConceptId)) setEditingConceptId(null);
    if (editingTextId && idsByKind.text.has(editingTextId)) setEditingTextId(null);
    setSelectedIds(new Set());
  };

  // Single entry point for the type picker regardless of what opened it — the
  // "+ Concept" button (no sticky context) and "Convert to Concept" on a sticky
  // (uses that sticky's position/text) now share the exact same experience,
  // instead of the sticky path silently defaulting to Application.
  const handleConceptTypeChosen = (conceptType) => {
    if (convertingStickyId) {
      const sticky = stickies.find((s) => s.id === convertingStickyId);
      if (sticky) {
        const trimmed = (sticky.text || "").trim();
        const conceptName = trimmed && trimmed !== "New idea" ? sticky.text : `New ${conceptType}`;
        const concept = { id: newCanvasId("concept"), x: sticky.x, y: sticky.y, width: CONCEPT_W, height: CONCEPT_H, conceptType, name: conceptName, attributes: {}, pushed: false, zIndex: zCounterRef.current++ };
        setStickies((prev) => prev.filter((s) => s.id !== convertingStickyId));
        setCanvasConcepts((prev) => [...prev, concept]);
        setEditingConceptId(concept.id);
      }
      setConvertingStickyId(null);
    } else {
      addConcept(conceptType);
    }
    setShowConceptPicker(false);
  };

  const handleCanvasMouseDown = (e) => {
    if (contextMenu) setContextMenu(null);
    if (e.target !== canvasRef.current && !e.target.dataset.canvasBg) return;
    if (arrowDrawMode) { addArrowDraftPoint(screenToCanvas(e.clientX, e.clientY)); return; }
    if (e.shiftKey) {
      // Shift-drag on empty canvas = rubber-band select, instead of the plain-drag pan

      // preventDefault — Shift+mousedown is also the browser's native "extend text
      // selection" gesture; without this it fights our own selection with a highlight.
      e.preventDefault();

      setDragState({ type: "marquee" });
      return;
    }
    if (selectedIds.size > 0) setSelectedIds(new Set());
    setDragState({ type: "pan", startMouse: { x: e.clientX, y: e.clientY }, startOffset: canvasOffset });
  };
  const handleItemMouseDown = (e, kind, id) => {
    e.stopPropagation();
    const point = screenToCanvas(e.clientX, e.clientY);

        next.has(key) ? next.delete(key) : next.add(key);

      });

    }

        : ed
      ));

    }
    if (draggingWholeArrow) {
      const point = screenToCanvas(e.clientX, e.clientY);

      setFreeArrows((prev) => prev.map((a) => a.id === draggingWholeArrow.arrowId
        ? { ...a, points: draggingWholeArrow.startPoints.map((p) => ({ x: p.x + dx, y: p.y + dy })) }
        : a
      ));
      return;
    }
    if (draggingArrowPoint) {
      const point = screenToCanvas(e.clientX, e.clientY);
      setFreeArrows((prev) => prev.map((a) => a.id === draggingArrowPoint.arrowId

        : a
      ));

    }

      return;

    }
    if (shapeConnectDrag) {

    }

      const point = screenToCanvas(e.clientX, e.clientY);

      else if (resizeState.kind === "text") setCanvasTexts((prev) => prev.map((t) => t.id === resizeState.id ? { ...t, width: newW, height: newH } : t));

    }

    } else if (dragState.type === "item") {

        }

      // deltas, then one setState per array" shape as autoOrganizeCanvas —

      const newPosByKey = {};

      setCanvasConcepts((prev) => prev.map((c) => newPosByKey[`concept:${c.id}`] ? { ...c, ...newPosByKey[`concept:${c.id}`] } : c));
      setCanvasTexts((prev) => prev.map((t) => newPosByKey[`text:${t.id}`] ? { ...t, ...newPosByKey[`text:${t.id}`] } : t));
      setShapes((prev) => prev.map((s) => newPosByKey[`shape:${s.id}`] ? { ...s, ...newPosByKey[`shape:${s.id}`] } : s));
    }
  };

    if (marquee) {
      const x1 = Math.min(marquee.x1, marquee.x2), x2 = Math.max(marquee.x1, marquee.x2);
      const y1 = Math.min(marquee.y1, marquee.y2), y2 = Math.max(marquee.y1, marquee.y2);

        const w = o.width || defaultW, h = o.height || defaultH;

      };

      stickies.forEach((s) => { if (intersects(s, 160, 120)) next.add(`sticky:${s.id}`); });
      canvasConcepts.forEach((c) => { if (intersects(c, CONCEPT_W, CONCEPT_H)) next.add(`concept:${c.id}`); });
      canvasTexts.forEach((t) => { if (intersects(t, 160, 60)) next.add(`text:${t.id}`); });

      setMarquee(null);
      setDragState(null);
      return;
    }

    if (draggingWholeArrow) { setDraggingWholeArrow(null); return; }
    if (draggingArrowPoint) { setDraggingArrowPoint(null); return; }
    if (connectDrag) {
      const hit = canvasConcepts.find((c) =>
        c.id !== connectDrag.sourceId &&
        connectDrag.x >= c.x && connectDrag.x <= c.x + (c.width || CONCEPT_W) &&
        connectDrag.y >= c.y && connectDrag.y <= c.y + (c.height || CONCEPT_H)
      );
      if (hit) {
        setConnectingFrom(connectDrag.sourceId);
        setPendingEdgeTarget(hit.id);
        setPendingSourceAnchor(connectDrag.sourceAnchor || "right");
        setPendingTargetAnchor(closestAnchor(hit, hit.width || CONCEPT_W, hit.height || CONCEPT_H, { x: connectDrag.x, y: connectDrag.y }));
      }
      setConnectDrag(null);
      return;
    }
    if (shapeConnectDrag) {
      const hit = shapes.find((s) =>
        s.id !== shapeConnectDrag.sourceId &&
        shapeConnectDrag.x >= s.x && shapeConnectDrag.x <= s.x + (s.width || SHAPE_W) &&
        shapeConnectDrag.y >= s.y && shapeConnectDrag.y <= s.y + (s.height || SHAPE_H)
      );
      if (hit) completeShapeConnect(hit.id, closestAnchor(hit, hit.width || SHAPE_W, hit.height || SHAPE_H, { x: shapeConnectDrag.x, y: shapeConnectDrag.y }));

    // browser's own focus never landed either. Do it manually here instead.

      const target = dragStartTargetRef.current;
      if (target && (target.tagName === "TEXTAREA" || target.tagName === "INPUT")) target.focus();
    }
    setDragState(null);
  };
  const handleCanvasWheel = (e) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    const cursorX = e.clientX - rect.left, cursorY = e.clientY - rect.top;
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.min(2.5, Math.max(0.3, canvasScale * factor));

      x: cursorX - (cursorX - prev.x) * (newScale / canvasScale),
      y: cursorY - (cursorY - prev.y) * (newScale / canvasScale),
    }));
    setCanvasScale(newScale);
  };

  const [pendingEdgeTarget, setPendingEdgeTarget] = useState(null);
  const [pendingVerb, setPendingVerb] = useState("");
  const [pendingSourceAnchor, setPendingSourceAnchor] = useState(null);
  const [pendingTargetAnchor, setPendingTargetAnchor] = useState(null);
  const CONCEPT_W = 212, CONCEPT_H = 118; // wider/taller than the strict minimum — most 2-line titles fit without pushing the real card past this, keeping layout/collision/arrow-trim math roughly accurate
  const handleHandleMouseDown = (e, conceptId, anchor) => {
    e.stopPropagation();
    const concept = canvasConcepts.find((c) => c.id === conceptId);
    const start = concept ? getAnchorPoint(concept, concept.width || CONCEPT_W, concept.height || CONCEPT_H, anchor) : screenToCanvas(e.clientX, e.clientY);
    setConnectDrag({ sourceId: conceptId, sourceAnchor: anchor, x: start.x, y: start.y });
  };

    e.stopPropagation();
    const point = screenToCanvas(e.clientX, e.clientY);
    setResizeState({ id, kind, startMouse: point, startSize: { w: currentW, h: currentH } });
  };

  // value because React state updates are async. Passing verb directly sidesteps
  // that whole class of bug rather than relying on state timing.
  const confirmEdge = (verb) => {
    if (!connectingFrom || !pendingEdgeTarget || !verb) return;
    setCanvasEdges((prev) => [...prev, { id: newCanvasId("edge"), sourceId: connectingFrom, targetId: pendingEdgeTarget, verb, pushed: false,
      sourceAnchor: pendingSourceAnchor, targetAnchor: pendingTargetAnchor, waypoints: [] }]);
    setConnectingFrom(null); setPendingEdgeTarget(null); setPendingVerb(""); setPendingSourceAnchor(null); setPendingTargetAnchor(null);
  };
  const cancelEdge = () => {
    setConnectingFrom(null); setPendingEdgeTarget(null); setConnectDrag(null); setPendingVerb("");
    setPendingSourceAnchor(null); setPendingTargetAnchor(null);
  };

  // too) without dropping the pending connection — used when the ontology only
  // defines the relationship the other way round, so "reverse it" is one click
  // instead of cancel-and-redraw-the-arrow-backwards.
  const reverseEdgeDirection = () => {
    setConnectingFrom(pendingEdgeTarget); setPendingEdgeTarget(connectingFrom);
    setPendingSourceAnchor(pendingTargetAnchor); setPendingTargetAnchor(pendingSourceAnchor);
    setPendingVerb("");
  };

  // The same score/severity gauge the Blast Radius modal's hero band uses,
  // shrunk down to sit directly on an Inventory card or table row — click
  // it to pop the full modal open, same as the old text button did.
  const BlastRadiusGauge = ({ appId, size = "card" }) => {
    const br = blastRadiusByAppId[appId];
    if (!br) return null;
    const gaugeColor = br.severity === "Severe" ? COLORS.risk : br.severity === "Moderate" ? COLORS.warning : COLORS.accent;
    const dim = size === "card" ? 42 : 26;
    return (
      <div onClick={(e) => { e.stopPropagation(); setBlastRadiusAppId(appId); }} title={`${br.severity} blast radius — click for detail`}
        style={{ display: "inline-flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer" }}>
        <div style={{ width: dim, height: dim, borderRadius: "50%", border: `${size === "card" ? 3 : 2}px solid ${gaugeColor}`,
          display: "flex", alignItems: "center", justifyContent: "center", fontSize: size === "card" ? 14 : 10.5,
          fontWeight: 700, color: gaugeColor, flexShrink: 0 }}>
          {br.score}

              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginBottom: 28 }}>

                </div>
                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",
                  borderTop: `3px solid ${redundancyGroups.length ? COLORS.risk : COLORS.accent}`, padding: "16px 18px", borderRadius: 18 }}>
                  <div style={{ fontSize: 26, fontWeight: 600 }}>{redundancyGroups.length}</div>

                </div>

                  fontSize: 13.5, color: COLORS.inkSecondary }}>

                redundancyGroups.map((g, i) => (

                    <SortableTable

                      columns={[

          {view === "obsolescence" && (

                <div className="ds-card" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 2px rgba(10,14,26,0.05), 0 10px 26px rgba(10,14,26,0.07)",
                  borderTop: `3px solid ${atRiskTech.length ? COLORS.risk : COLORS.accent}`, padding: "16px 18px", borderRadius: 18 }}>
                  <div style={{ fontSize: 26, fontWeight: 600 }}>{atRiskTech.length}</div>
                  <div style={{ fontSize: 13, color: COLORS.inkSecondary, marginTop: 4 }}>Technologies Approaching or Past End-of-Life</div>

                  borderTop: `3px solid ${totalAppsExposed ? COLORS.risk : COLORS.accent}`, padding: "16px 18px", borderRadius: 18 }}>

                      const isMulti = attr.type === "multi_enum";
                      const value = isMulti ? (Array.isArray(omEditForm[key]) ? omEditForm[key] : []) : (omEditForm[key] || "");

          {view === "help" && (() => {
