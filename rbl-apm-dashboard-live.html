    try {
      const appRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)
         OPTIONAL MATCH (r:Instance:Risk)-[:AFFECTS]->(a)
         OPTIONAL MATCH (a)-[:SUPPORTS]->(c:Instance:Capability)
         RETURN properties(a) AS app, collect(DISTINCT r.name) AS risks, collect(DISTINCT c.name) AS capabilities
         ORDER BY app.name`
      );
      const decisionRows = await runCypher(apiUrl, authHeader,
        `MATCH (d:Instance:Decision)
         OPTIONAL MATCH (d)-[r]->(affected:Instance) WHERE type(r) <> "SUPERSEDES" AND NOT affected:Decision
         WITH d, collect(DISTINCT {verb: type(r), name: affected.name}) AS affects
         OPTIONAL MATCH (d)-[:SUPERSEDES]->(older:Instance:Decision)
         WITH d, affects, collect(DISTINCT {id: older.id, name: older.name}) AS supersedes
         OPTIONAL MATCH (newer:Instance:Decision)-[:SUPERSEDES]->(d)
         WITH d, affects, supersedes, collect(DISTINCT {id: newer.id, name: newer.name}) AS supersededBy
         RETURN properties(d) AS d, affects, supersedes, supersededBy
         ORDER BY d.decision_date DESC`
      );
      const appLocationRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)
         OPTIONAL MATCH (a)-[:HOSTED_AT]->(directLoc:Instance:Location)
         OPTIONAL MATCH (a)-[:RUNS_ON]->(:Instance)-[:HOSTED_AT]->(techLoc:Instance:Location)
         WITH a, collect(DISTINCT directLoc.name) + collect(DISTINCT techLoc.name) AS allLocs
         RETURN a.id AS appId, [l IN allLocs WHERE l IS NOT NULL] AS locations`
      );
      const journeyRows = await runCypher(apiUrl, authHeader,
        `MATCH (j:Instance:Journey)
         OPTIONAL MATCH (j)-[:CONTAINS]->(js:Instance:JourneyStage)
         OPTIONAL MATCH (cap:Instance:Capability)-[:ENABLES]->(js)
         OPTIONAL MATCH (proc:Instance:Process)-[:SUPPORTS]->(js)
         OPTIONAL MATCH (app:Instance:Application)-[:SUPPORTS]->(cap)
         OPTIONAL MATCH (app)-[:RUNS_ON]->(tech)
         RETURN j.id AS journeyId, j.name AS journeyName, j.stereotype AS journeyType,
                js.id AS stageId, js.name AS stageName, js.sequence AS stageSeq, js.stereotype AS stageType,
                collect(DISTINCT cap.name) AS capabilities,
                collect(DISTINCT proc.name) AS processes,
                collect(DISTINCT app.name) AS applications,
                collect(DISTINCT tech.name) AS technologies
         ORDER BY j.name, js.sequence`
      );
      const capRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Instance:Capability)
         OPTIONAL MATCH (c)<-[:SUPPORTS]-(a:Instance:Application)
         RETURN properties(c) AS cap, count(a) AS count
         ORDER BY cap.name`
      );
      const depRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance)-[r]->(b:Instance)
         WHERE (a:Application OR a:SoftwareTechnology OR a:HardwareTechnology OR a:Data)
           AND (b:Application OR b:SoftwareTechnology OR b:HardwareTechnology OR b:Data)
         RETURN a.id AS sourceId, a.name AS sourceName,
                [l IN labels(a) WHERE l <> 'Instance'][0] AS sourceType,
                a.lifecycle AS sourceLifecycle, a.support_status AS sourceSupportStatus,
                a.tech_category AS sourceTechCategory, a.strategic_classification AS sourceStrategicClass,
                type(r) AS relType,
                b.id AS targetId, b.name AS targetName,
                [l IN labels(b) WHERE l <> 'Instance'][0] AS targetType,
                b.lifecycle AS targetLifecycle, b.support_status AS targetSupportStatus,
                b.tech_category AS targetTechCategory, b.strategic_classification AS targetStrategicClass`
      );
      // Which Flow/FlowStep instances each Application, SoftwareTechnology, or
      // HardwareTechnology carries — feeds the Blast Radius panel's "Flows
      // Affected" section (see computeBlastRadius) directly off real data,
      // same eager-load pattern as depRows just above since Blast Radius
      // already assumes everything it needs is preloaded.
      const flowRows = await runCypher(apiUrl, authHeader,
        `MATCH (carrier:Instance)-[:SUPPORTS]->(fs:Instance:FlowStep)<-[:CONTAINS]-(f:Instance:Flow)
         WHERE carrier:Application OR carrier:SoftwareTechnology OR carrier:HardwareTechnology
         RETURN carrier.id AS carrierId, f.id AS flowId, f.name AS flowName, f.stereotype AS flowStereotype,
                f.criticality AS flowCriticality, fs.id AS stepId, fs.name AS stepName, fs.sequence AS stepSequence
         ORDER BY f.name, fs.sequence`
      );
      const techRows = await runCypher(apiUrl, authHeader,
        `MATCH (t:Instance)
         WHERE t:SoftwareTechnology OR t:HardwareTechnology
         RETURN properties(t) AS tech, [l IN labels(t) WHERE l <> 'Instance'][0] AS techType`
      );
      const processRows = await runCypher(apiUrl, authHeader,
        `MATCH (p:Instance:Process)-[:REALISES]->(c:Instance:Capability)
         OPTIONAL MATCH (d:Instance:Data)-[:BELONGS_TO]->(c)
         OPTIONAL MATCH (app:Instance:Application)-[:SUPPORTS]->(c)
         RETURN properties(p) AS process, properties(c) AS capability,
                collect(DISTINCT d.quality) AS dataQualities,
                collect(DISTINCT app.name) AS supportingApps
         ORDER BY process.name`
      );
      const orgProcessRows = await runCypher(apiUrl, authHeader,
        `MATCH (o:Instance:Organisation)-[:PERFORMS]->(p:Instance:Process)
         RETURN o.name AS org, p.id AS processId`
      );
      const blockedRows = await runCypher(apiUrl, authHeader,
        `MATCH (a:Instance:Application)-[:BLOCKS]->(i:Instance:Initiative)
         RETURN properties(i) AS initiative, a.id AS appId, a.name AS appName`
      );
      const controlRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Instance:Control)-[:CONSTRAINS]->(n)
         RETURN c.name AS control, c.stereotype AS controlType, n.id AS targetId,
                [l IN labels(n) WHERE l <> 'Instance'][0] AS targetType`
      );
      const workspaceRows = await runCypher(apiUrl, authHeader,
        `MATCH (w:Workspace) RETURN w.id AS id, w.name AS name ORDER BY w.name`
      );
      const canvasSummaryRows = await runCypher(apiUrl, authHeader,
        `MATCH (c:Canvas) RETURN c.id AS id, c.name AS name, c.workspaceId AS workspaceId, c.updatedAt AS updatedAt ORDER BY c.name`
      );
      const shapePaletteRows = await runCypher(apiUrl, authHeader,
        `MATCH (p:ShapePalette) RETURN p.id AS id, p.name AS name, p.icons AS icons ORDER BY p.name`
      );
      setCustomPalettes(shapePaletteRows.map((r) => {
        let icons = [];
        try { icons = JSON.parse(r.icons || "[]"); } catch (e) { icons = []; }
        return { id: r.id, name: r.name, icons };
      }));
      let finalWorkspaces = workspaceRows;
      let finalCanvases = canvasSummaryRows;
      if (finalWorkspaces.length === 0) {
        // First time under the workspace/canvas model — migrate any pre-existing
        // single canvas into a default workspace rather than losing it, or start
        // fresh with an empty default if there was nothing there yet.
        const legacyRows = await runCypher(apiUrl, authHeader,
          `OPTIONAL MATCH (c:CanvasState {id: 'main'}) RETURN c.data AS data`
        );
        const legacyData = legacyRows[0] && legacyRows[0].data;
        const wsId = newCanvasId("workspace");
        const canvasId = newCanvasId("pcanvas");
        await runCypher(apiUrl, authHeader, `CREATE (w:Workspace {id: $wsId, name: $wsName})`, { wsId, wsName: "My Workspace" });
        await runCypher(apiUrl, authHeader,
          `CREATE (c:Canvas {id: $canvasId, name: $canvasName, workspaceId: $wsId, data: $data, updatedAt: $now})`,
          { canvasId, canvasName: "Canvas 1", wsId,
            data: legacyData || JSON.stringify({ stickies: [], concepts: [], edges: [], texts: [] }),
            now: new Date().toISOString() }
        );
        finalWorkspaces = [{ id: wsId, name: "My Workspace" }];
        finalCanvases = [{ id: canvasId, name: "Canvas 1", workspaceId: wsId, updatedAt: new Date().toISOString() }];
      }
      setWorkspaces(finalWorkspaces);
      setCanvasList(finalCanvases);
      setOpenWorkspaces((prev) => {
        const next = { ...prev };
        finalWorkspaces.forEach((w) => { if (!(w.id in next)) next[w.id] = true; });
        return next;
      });
      const schemaRows = await runCypher(apiUrl, authHeader,
        `MATCH (ct:ConceptType)-[:HAS_ATTRIBUTE]->(ad:AttributeDefinition)
         RETURN ct.name AS conceptType, collect({name: ad.name, type: ad.type, options: ad.options}) AS attributes
         ORDER BY ct.name`
      );
      const relTypeRows = await runCypher(apiUrl, authHeader,
        `MATCH (r:RelationshipType)-[:HAS_SOURCE]->(s:ConceptType)
         MATCH (r)-[:HAS_TARGET]->(t:ConceptType)
         RETURN r.verb AS verb, s.name AS source, t.name AS target`
      );

      const appLocationMap = {};
      appLocationRows.forEach((r) => { appLocationMap[r.appId] = [...new Set(r.locations || [])]; });

      const normalised = appRows.map((row) => ({
        id: row.app.id, name: row.app.name, vendor: row.app.vendor || null,
        owner: row.app.owner || null, category: row.app.category || "Uncategorised",
        architectureStyle: row.app.architecture_style || "Traditional",
        status: row.app.status || "—", hosting: row.app.hosting_model || "—",
        businessValue: Number(row.app.business_value) || null,
        techHealth: Number(row.app.technical_health) || null,
        criticality: row.app.criticality || "—",
        tco: row.app.tco != null ? Number(row.app.tco) : null,
        userCount: row.app.user_count != null ? Number(row.app.user_count) : null,
        plannedDate: row.app.planned_date || null, activeDate: row.app.active_date || null,
        sunsetDate: row.app.sunset_date || null, retiringDate: row.app.retiring_date || null,
        decommissionDate: row.app.decommission_date || null, renewalDate: row.app.renewal_date || null,
        serviceLevel: row.app.service_level || null, rto: row.app.rto || null, rpo: row.app.rpo || null,
        locations: appLocationMap[row.app.id] || [],
        risks: row.risks || [],
        capabilities: (row.capabilities || []).filter(Boolean),
        aiReadiness: row.app.ai_readiness || null, aiRelevance: row.app.ai_relevance || null,
        aiAvailability: row.app.ai_availability || null, aiTargetPattern: row.app.ai_target_pattern || null,
        aiPathfinderStatus: row.app.ai_pathfinder_status || null, reviewDate: row.app.review_date || null,
        organisation: row.app.organisation || null, verified_at: row.app.verified_at || null,
      }));

      const nodeMap = new Map();
      depRows.forEach((r) => {
        nodeMap.set(r.sourceId, { id: r.sourceId, name: r.sourceName, type: r.sourceType,
          lifecycle: r.sourceLifecycle, supportStatus: r.sourceSupportStatus });
        nodeMap.set(r.targetId, { id: r.targetId, name: r.targetName, type: r.targetType,
          lifecycle: r.targetLifecycle, supportStatus: r.targetSupportStatus });
      });

      const technologiesNormalised = techRows.map((row) => ({
        id: row.tech.id, name: row.tech.name, type: row.techType,
        techCategory: row.tech.tech_category || "Uncategorised",
        lifecycle: row.tech.lifecycle || "Current",
        strategicClassification: row.tech.strategic_classification || null,
        supportStatus: row.tech.support_status || null,
        tco: row.tech.tco != null ? Number(row.tech.tco) : null,
      }));

      const processNormalised = processRows.map((row) => ({
        id: row.process.id,
        name: row.process.name,
        automationLevel: row.process.automation_level || null,
        frequency: row.process.frequency || null,
        roles: row.process.roles || null,
        capabilityName: row.capability ? row.capability.name : null,
        capabilityImportance: row.capability ? row.capability.importance : null,
        dataQualities: (row.dataQualities || []).filter(Boolean),
        supportingApps: (row.supportingApps || []).filter(Boolean),
      }));
      const orgsByProcess = {};
      orgProcessRows.forEach((r) => {
        (orgsByProcess[r.processId] = orgsByProcess[r.processId] || []).push(r.org);
      });

      const capCoverageNormalised = capRows.map((r) => ({
        capability: r.cap.name, count: r.count,
        importance: r.cap.importance || null, marketDifferentiation: r.cap.market_differentiation || null,
        maturity: {
          governance: r.cap.governance_maturity || null, policies: r.cap.policies_maturity || null,
          process: r.cap.process_maturity || null, people: r.cap.people_maturity || null,
          applications: r.cap.applications_maturity || null, metrics: r.cap.metrics_maturity || null,
        },
      }));

      const journeysGrouped = {};
      journeyRows.forEach((r) => {
        if (!journeysGrouped[r.journeyId]) journeysGrouped[r.journeyId] = { id: r.journeyId, name: r.journeyName, type: r.journeyType, stages: [] };
        if (r.stageId) {
          journeysGrouped[r.journeyId].stages.push({
            id: r.stageId, name: r.stageName, sequence: r.stageSeq, type: r.stageType,
            capabilities: (r.capabilities || []).filter(Boolean),
            processes: (r.processes || []).filter(Boolean),
            applications: (r.applications || []).filter(Boolean),
            technologies: (r.technologies || []).filter(Boolean),
          });
        }
      });
      const journeysNormalised = Object.values(journeysGrouped).map((j) => ({ ...j, stages: j.stages.sort((a, b) => (a.sequence || 0) - (b.sequence || 0)) }));

      setApps(normalised);
      setCapCoverage(capCoverageNormalised);
      setJourneys(journeysNormalised);

      const decisionsNormalised = decisionRows.map((r) => ({
        id: r.d.id, name: r.d.name, status: r.d.status || "—", type: r.d.stereotype || "—",
        decisionMaker: r.d.decision_maker || null, decisionDate: r.d.decision_date || null,
        reviewDate: r.d.review_date || null, rationale: r.d.rationale || null,
        optionsConsidered: r.d.options_considered || null, chosenOption: r.d.chosen_option || null,
        consequences: r.d.consequences || null, confidence: r.d.confidence || null, impactLevel: r.d.impact_level || null,
        affects: (r.affects || []).filter((a) => a && a.name),
        supersedes: (r.supersedes || []).filter((s) => s && s.id),
        supersededBy: (r.supersededBy || []).filter((s) => s && s.id),
      }));
      setDecisions(decisionsNormalised);
      setDepNodes([...nodeMap.values()]);
      setDepLinks(depRows.map((r) => ({ sourceId: r.sourceId, targetId: r.targetId, relType: r.relType })));
      setFlowRows(flowRows);
      setProcesses(processNormalised);
      setOrgsByProcess(orgsByProcess);
      setTechnologies(technologiesNormalised);
      setBlockedDecisions(blockedRows.map((row) => ({
        id: row.initiative.id, name: (row.initiative.name || "").replace("[FICTIONAL] ", ""),
        fictional: (row.initiative.name || "").includes("[FICTIONAL]"),
        status: row.initiative.status, sponsor: row.initiative.sponsor,
        startDate: row.initiative.start_date, targetDate: row.initiative.target_date,
        cost: row.initiative.forecast_cost != null ? Number(row.initiative.forecast_cost) : null,
        description: row.initiative.description, appId: row.appId, appName: row.appName,
        owner: row.initiative.owner || null, verified_at: row.initiative.verified_at || null,
      })));
      setControls(controlRows);
      const schemaAttrs = {};
      schemaRows.forEach((row) => {
        schemaAttrs[row.conceptType] = (row.attributes || []).filter((a) => a.name && a.name !== "Name");
      });
      setSchemaAttributes(schemaAttrs);
      setSchemaRelationships(relTypeRows);
      setLastFetched(new Date());
      setStatus("connected");
    } catch (e) {
      setErrorMsg(e.message || String(e));
      setStatus("error");
    }
  }, []);

  // Auto-connect on load if credentials were saved from a previous session —
  // the whole point of remembering them is to skip the manual click too.
  useEffect(() => {
    if (uri && password) {
      fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
    }
  }, []);

  // Escape cancels an in-progress arrow (mouse-driven Finish/Cancel buttons
  // are the primary way, this is just a safety net) or clears the current
  // canvas selection. Delete/Backspace removes the selected canvas objects —
  // guarded on an editable element having focus, since Delete/Backspace also
  // needs to work as plain text-editing keys inside sticky/concept fields.
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key === "Escape") {
        if (arrowDrawMode) cancelArrowDraw();
        else if (selectedIds.size > 0) setSelectedIds(new Set());
        return;
      }
      if (e.key === "Delete" || e.key === "Backspace") {
        if (view !== "canvas" || selectedIds.size === 0) return;
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || (document.activeElement && document.activeElement.isContentEditable)) return;
        e.preventDefault();
        deleteSelected();
      }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [arrowDrawMode, selectedIds, view]);

  // Autoscroll the chat to the newest message — without this, new answers
  // land below the visible area and the person has to manually scroll down
  // every single turn, which doesn't feel like a live conversation.
  useEffect(() => {
    if (chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
  }, [chatMessages, chatLoading]);
  useEffect(() => {
    if (canvasChatScrollRef.current) canvasChatScrollRef.current.scrollTop = canvasChatScrollRef.current.scrollHeight;
  }, [canvasChatLog, canvasChatLoading]);

  // Fetches fresh on every visit rather than caching — same reasoning as
  // loadOmInstances re-fetching on every Ontology Manager type click: a
  // coverage report showing stale counts after someone just fixed an
  // ownership gap elsewhere in the app would be actively misleading.
  useEffect(() => {
    if (view === "ownership") loadOwnershipCoverage();
  }, [view]);
  useEffect(() => {
    if (view === "auditlog") loadAuditLog();
  }, [view]);
  useEffect(() => {
    if (view === "initiatives") loadInitiatives();
  }, [view]);
  useEffect(() => {
    if (view === "dataflow") { loadDataFlows(); setDataFlowFocusId(null); }
  }, [view]);
  // A stale "Impact & Risk" tab left open from the last profile visited
  // would otherwise silently carry over to whichever application this
  // click just opened — reset to the tab every profile starts on, unless
  // whoever navigated here asked for a specific tab (see pendingProfileTabRef,
  // set just before setProfileAppId by callers like the Blast Radius modal's
  // "Open full application profile" link).
  useEffect(() => {
    setProfileTab(pendingProfileTabRef.current || "overview");
    pendingProfileTabRef.current = null;
  }, [profileAppId]);
  useEffect(() => {
    if ((view === "ontology" || view === "canvas") && organisationOptions.length === 0 && uri && password) {
      loadOrganisationOptions();
    }
  }, [view]);
  useEffect(() => {
    if (view === "businessunits") loadBusinessUnits();
  }, [view]);
  useEffect(() => {
    if (view === "valuedelivered") loadValueSnapshots();
  }, [view]);
  useEffect(() => {
    if (status === "connected" && apps.length > 0) maybeRecordValueSnapshot();
  }, [status, apps.length]);

  // Once the workspace/canvas list loads, open whatever canvas comes first —
  // otherwise the person lands on an empty tree with nothing selected.
  useEffect(() => {
    if (canvasList.length > 0 && !activeCanvasId) {
      const first = canvasList[0];
      setActiveCanvasId(first.id);
      loadCanvasData(first.id);
    }
  }, [canvasList]);

  const loadOmInstances = async (type) => {
    setOmLoading(true);
    setOmEditingId(null);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${type}) RETURN properties(n) AS props ORDER BY n.name`
      );
      setOmInstances(rows.map((r) => r.props));
    } catch (e) {
      setOmStatus(`Couldn't load ${type}: ${e.message}`);
      setOmInstances([]);
    } finally {
      setOmLoading(false);
    }
  };

  // One query across every :Instance node rather than 23 separate ones
  // (one per concept type) — Owner is a base attribute every type shares,
  // so coverage can be computed for the whole graph in a single round trip.
  const loadOwnershipCoverage = async () => {
    setOwnershipLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance) RETURN labels(n) AS labels, n.id AS id, n.name AS name, n.owner AS owner`
      );
      const byType = {};
      rows.forEach((r) => {
        const type = (r.labels || []).find((l) => CANVAS_CONCEPT_TYPES.includes(l));
        if (!type) return;
        if (!byType[type]) byType[type] = { total: 0, owned: 0, missing: [] };
        byType[type].total++;
        if (r.owner && String(r.owner).trim()) byType[type].owned++;
        else byType[type].missing.push({ id: r.id, name: r.name });
      });
      setOwnershipStats(byType);
      setOwnershipError("");
    } catch (e) {
      setOwnershipError(`Couldn't load ownership coverage: ${e.message}`);
      setOwnershipStats({});
    } finally {
      setOwnershipLoading(false);
    }
  };

  // Newest-first, capped at 500 — a governance log people skim/filter rather
  // than paginate through; a graph running long enough to blow past that cap
  // has bigger housekeeping questions than what this page can answer anyway.
  const loadAuditLog = async () => {
    setAuditLogLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (a:AuditLogEntry) RETURN properties(a) AS props ORDER BY a.timestamp DESC LIMIT 500`
      );
      setAuditLog(rows.map((r) => r.props));
      setAuditLogError("");
    } catch (e) {
      setAuditLogError(`Couldn't load the audit log: ${e.message}`);
      setAuditLog([]);
    } finally {
      setAuditLogLoading(false);
    }
  };

  const loadInitiatives = async () => {
    setInitiativesLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:Initiative) RETURN properties(n) AS props ORDER BY n.name`
      );
      setInitiatives(rows.map((r) => r.props));
      setInitiativesError("");
    } catch (e) {
      setInitiativesError(`Couldn't load initiatives: ${e.message}`);
      setInitiatives([]);
    } finally {
      setInitiativesLoading(false);
    }
  };

  // Interface is the real integration model here (see bdcore_schema.yaml's
  // own comment on it retiring a bare free-text "integrates with" edge in
  // favour of a real node with governed protocol/format/frequency
  // attributes) — an app PROVIDES an interface, another app USES it, and the
  // interface itself PROVIDES the data that actually flows through it. This
  // one query walks that whole chain to produce provider -> consumer flow
  // rows directly, which is exactly the shape the diagram below needs.
  const loadDataFlows = async () => {
    setDataFlowLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (provider:Instance:Application)-[:PROVIDES]->(i:Instance:Interface)<-[:USES]-(consumer:Instance:Application)
         OPTIONAL MATCH (i)-[:PROVIDES]->(d:Instance:Data)
         RETURN provider.id AS providerId, provider.name AS providerName,
                consumer.id AS consumerId, consumer.name AS consumerName,
                i.id AS interfaceId, i.name AS interfaceName, i.protocol AS protocol,
                i.frequency AS frequency, i.direction AS direction,
                collect(DISTINCT d.name) AS dataNames`
      );
      setDataFlows(rows);
      setDataFlowError("");
    } catch (e) {
      setDataFlowError(`Couldn't load data flows: ${e.message}`);
      setDataFlows([]);
    } finally {
      setDataFlowLoading(false);
    }
  };

  // Every ref-type attribute in the schema today points at Organisation (see
  // bdcore_schema.yaml's base_attributes and Organisation.ParentOrganisation)
  // — fetched once, lazily, so the Ontology Manager and canvas edit forms can
  // offer a real picker instead of a free-text field for it (see the "ref"
  // branch in both attribute forms below).
  const loadOrganisationOptions = async () => {
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:Organisation) RETURN n.id AS id, n.name AS name ORDER BY n.name`
      );
      setOrganisationOptions(rows);
    } catch (e) {
      // Non-critical — the ref field just falls back to empty options (still
      // usable as a plain field would be, no error surfaced for this alone).
    }
  };

  // Applications and Capabilities are the two types ArchiBuddy's own
  // business-unit segmentation covers — grouped client-side by whichever
  // Organisation each is tagged with (see the base Organisation ref
  // attribute every concept type carries), including an explicit
  // "unassigned" bucket rather than silently dropping untagged records.
  const loadBusinessUnits = async () => {
    setBusinessUnitsLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance)
         WHERE n:Application OR n:Capability
         OPTIONAL MATCH (org:Instance:Organisation {id: n.organisation})
         RETURN [l IN labels(n) WHERE l <> 'Instance'][0] AS type, n.id AS id, n.name AS name,
                n.tco AS tco, n.criticality AS criticality, n.importance AS importance,
                org.id AS orgId, org.name AS orgName`
      );
      setBusinessUnitRows(rows);
      setBusinessUnitsError("");
    } catch (e) {
      setBusinessUnitsError(`Couldn't load business unit data: ${e.message}`);
      setBusinessUnitRows([]);
    } finally {
      setBusinessUnitsLoading(false);
    }
  };

  // Attribute options manager — deliberately separate from instance editing.
  // This changes the SCHEMA (every instance of the type, present and
  // future), not one record, so it lives as its own modal rather than
  // inside the per-instance Add/Edit panel where that distinction would be
  // easy to miss.
  const selectEnumAttr = async (attr) => {
    setEnumManagerAttrName(attr.name);
    setEnumManagerDraft([...(attr.options || [])]);
    setEnumManagerRemoveConfirm(null);
    setEnumManagerStatus("");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const snakeKey = toSnakeCase(attr.name);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${omSelectedType}) WHERE n.${snakeKey} IS NOT NULL RETURN n.${snakeKey} AS val, count(n) AS cnt`
      );
      const counts = {};
      rows.forEach((r) => { counts[r.val] = r.cnt; });
      setEnumManagerCounts(counts);
    } catch (e) {
      setEnumManagerCounts({});
    }
  };

  const removeEnumOption = (value) => {
    if ((enumManagerCounts[value] || 0) > 0 && enumManagerRemoveConfirm !== value) {
      setEnumManagerRemoveConfirm(value);
      return;
    }
    setEnumManagerDraft((prev) => prev.filter((v) => v !== value));
    setEnumManagerRemoveConfirm(null);
  };

  const addEnumOption = () => {
    const val = enumManagerNewOption.trim();
    if (!val || enumManagerDraft.includes(val)) return;
    setEnumManagerDraft((prev) => [...prev, val]);
    setEnumManagerNewOption("");
  };

  const saveEnumOptions = async () => {
    setEnumManagerStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const before = (schemaAttributes[omSelectedType] || []).find((a) => a.name === enumManagerAttrName);
      await runCypher(apiUrl, authHeader,
        `MATCH (a:AttributeDefinition {concept_type: $type, name: $name}) SET a.options = $options`,
        { type: omSelectedType, name: enumManagerAttrName, options: enumManagerDraft }
      );
      await logAudit({
        action: "updated", entityType: "Attribute", entityName: `${omSelectedType} · ${humanizeLabel(enumManagerAttrName)}`,
        summary: `Options: ${(before && before.options || []).join(", ") || "—"} → ${enumManagerDraft.join(", ") || "—"}`,
      });
      // Patch the local schema cache too, so the Add/Edit form reflects this
      // immediately without needing a full reconnect.
      setSchemaAttributes((prev) => ({
        ...prev,
        [omSelectedType]: (prev[omSelectedType] || []).map((a) =>
          a.name === enumManagerAttrName ? { ...a, options: enumManagerDraft } : a
        ),
      }));
      setEnumManagerStatus("Saved.");
    } catch (e) {
      setEnumManagerStatus(`Couldn't save: ${e.message}`);
    }
  };

  const addCustomAttrOption = () => {
    const val = newAttrOptionDraft.trim();
    if (!val || newAttrOptions.includes(val)) return;
    setNewAttrOptions((prev) => [...prev, val]);
    setNewAttrOptionDraft("");
  };
  const removeCustomAttrOption = (val) => setNewAttrOptions((prev) => prev.filter((v) => v !== val));
  // "Back to list" (stay in the modal) vs. "Close" (leave the modal entirely) —
  // both clear the add-attribute form, only the latter also clears which enum
  // attribute (if any) was being edited and closes the overlay.
  const backToAttributeList = () => {
    setAddingAttribute(false);
    setNewAttrName(""); setNewAttrType("string"); setNewAttrOptions([]); setNewAttrOptionDraft("");
    setNewAttrRequired(false); setAttributeManagerStatus("");
  };
  const closeAttributeManager = () => {
    setShowEnumManager(false);
    setEnumManagerAttrName(null);
    backToAttributeList();
  };
  // Mirrors exactly what load_schema.py's create_concept_types() does for each
  // attribute in the YAML — same MERGE-on-{concept_type,name} key, same
  // HAS_ATTRIBUTE relationship — so an attribute added here looks, to every
  // other part of the app (the dynamic Add/Edit forms, the canvas, the AI
  // chat's schema description), identical to one that shipped in the YAML.
  const createCustomAttribute = async () => {
    const name = newAttrName.trim();
    if (!name) { setAttributeManagerStatus("Give it a name first."); return; }
    const isEnumLike = newAttrType === "enum" || newAttrType === "multi_enum";
    const alreadyExists = (schemaAttributes[omSelectedType] || []).some((a) => a.name.toLowerCase() === name.toLowerCase());
    if (alreadyExists) { setAttributeManagerStatus(`${omSelectedType} already has an attribute called "${name}".`); return; }
    if (isEnumLike && newAttrOptions.length === 0) { setAttributeManagerStatus("Add at least one option first."); return; }
    setAttributeManagerStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader,
        `MERGE (a:AttributeDefinition {concept_type: $type, name: $name})
         SET a.type = $attrType, a.options = $options, a.required = $required
         WITH a
         MATCH (c:ConceptType {name: $type})
         MERGE (c)-[:HAS_ATTRIBUTE]->(a)`,
        { type: omSelectedType, name, attrType: newAttrType, options: isEnumLike ? newAttrOptions : null, required: newAttrRequired }
      );
      await logAudit({
        action: "created", entityType: "Attribute", entityName: `${omSelectedType} · ${name}`,
        summary: `Type: ${newAttrType}${isEnumLike ? `, Options: ${newAttrOptions.join(", ")}` : ""}${newAttrRequired ? ", Required" : ""}`,
      });
      // Same local-cache patch as saveEnumOptions — the new field shows up in
      // the Add/Edit form immediately, no reconnect needed.
      setSchemaAttributes((prev) => ({
        ...prev,
        [omSelectedType]: [...(prev[omSelectedType] || []), { name, type: newAttrType, options: isEnumLike ? newAttrOptions : null }],
      }));
      setAttributeManagerStatus(`Added "${name}" to ${omSelectedType}.`);
      setNewAttrName(""); setNewAttrType("string"); setNewAttrOptions([]); setNewAttrOptionDraft(""); setNewAttrRequired(false);
    } catch (e) {
      setAttributeManagerStatus(`Couldn't save: ${e.message}`);
    }
  };

  const omStartNew = () => { setOmEditingId("new"); setOmEditForm({ name: "" }); };
  const omStartEdit = (instance) => { setOmEditingId(instance.id); setOmEditForm({ ...instance }); };

  const omSaveInstance = async () => {
    if (!omEditForm.name || !omEditForm.name.trim()) { setOmStatus("Name is required."); return; }
    setOmStatus("Saving…");
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      // verified_at is destructured out (not just left in rest) so an edit
      // can't accidentally re-save whatever verification stamp the record
      // already had — the explicit "n.verified_at = null" below is the only
      // thing allowed to touch it on a save, same reasoning as the CSV
      // import's update path.
      const { id, verified_at, ...rest } = omEditForm;
      if (omEditingId === "new") {
        const newId = newCanvasId("om");
        await runCypher(apiUrl, authHeader, `CREATE (n:Instance:${omSelectedType} $props)`, { props: { id: newId, ...rest } });
        await logAudit({ action: "created", entityType: omSelectedType, entityId: newId, entityName: rest.name });
      } else {
        const before = omInstances.find((x) => x.id === omEditingId);
        await runCypher(apiUrl, authHeader,
          `MATCH (n:Instance:${omSelectedType} {id: $id}) SET n += $props, n.verified_at = null`,
          { id: omEditingId, props: rest }
        );
        const labels = {};
        Object.keys(rest).forEach((k) => { labels[k] = humanizeLabel(k); });
        await logAudit({
          action: "updated", entityType: omSelectedType, entityId: omEditingId, entityName: rest.name,
          summary: summarizeFieldChanges(before, rest, labels),
        });
      }
      setOmStatus("Saved.");
      setOmEditingId(null);
      loadOmInstances(omSelectedType);
      handleRefresh();
      setTimeout(() => setOmStatus(""), 1500);
    } catch (e) {
      setOmStatus(`Save failed: ${e.message}`);
    }
  };

  const omDeleteInstance = async (instance) => {
    if (!(await askConfirm(`Permanently delete "${instance.name}" (${omSelectedType}) from the graph? This removes the node and all its relationships — it can't be undone.`, { danger: true, confirmLabel: "Delete" }))) return;
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      await runCypher(apiUrl, authHeader, `MATCH (n:Instance:${omSelectedType} {id: $id}) DETACH DELETE n`, { id: instance.id });
      await logAudit({ action: "deleted", entityType: omSelectedType, entityId: instance.id, entityName: instance.name });
      setOmInstances((prev) => prev.filter((x) => x.id !== instance.id));
      handleRefresh();
    } catch (e) {
      setOmStatus(`Delete failed: ${e.message}`);
    }
  };

  // A verified record is an honest, business-owner-confirmed "this is still
  // accurate" — not a status that migrates with the data. Saving any other
  // change to the record (omSaveInstance's edit path, or a CSV re-import)
  // clears verified_at right back to unset, so a green badge always means
  // "confirmed since the last edit," never a stale leftover from before
  // someone changed the record without re-checking it.
  const omVerifyInstance = async (instance) => {
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const now = new Date().toISOString();
      await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance:${omSelectedType} {id: $id}) SET n.verified_at = $now`,
        { id: instance.id, now }
      );
      await logAudit({ action: "verified", entityType: omSelectedType, entityId: instance.id, entityName: instance.name });
      setOmInstances((prev) => prev.map((x) => (x.id === instance.id ? { ...x, verified_at: now } : x)));
    } catch (e) {
      setOmStatus(`Verify failed: ${e.message}`);
    }
  };

  const exportOmInstancesToCSV = () => {
    const attrs = schemaAttributes[omSelectedType] || [];
    // "Verified" is read-only here, deliberately — it's not in schemaAttributes
    // so re-importing this same file won't map a "Verified" column to
    // anything (see importOmInstancesFromCSV's headerMap), which is exactly
    // right: verification is a business-owner action taken in the app, not
    // something a spreadsheet edit should be able to grant.
    const headers = ["ID", "Name", "Verified", ...attrs.map((a) => humanizeLabel(a.name))];
    const rows = omInstances.map((inst) => [
      inst.id, inst.name, inst.verified_at ? new Date(inst.verified_at).toLocaleDateString() : "",
      ...attrs.map((a) => {
        const v = inst[toSnakeCase(a.name)];
        return Array.isArray(v) ? v.join("; ") : (v ?? "");
      }),
    ].map(csvEscape).join(","));
    const csv = [headers.map(csvEscape).join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${omSelectedType.toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  // A blank starting point for whoever has to fill this in, not just a list
  // of column names: the second row is a guide (valid enum options, expected
  // format) rather than a real record. It's safe to leave that row in when
  // re-uploading — Name is blank, so importOmInstancesFromCSV skips it as
  // just another incomplete row, the same as any other blank line would be.
  const omCsvColumnHint = (attr) => {
    if (attr.type === "enum") return `One of: ${(attr.options || []).join(", ")}`;
    if (attr.type === "multi_enum") return `One or more of: ${(attr.options || []).join(", ")} (separate with ;)`;
    if (attr.type === "number") return "Number, e.g. 42";
    if (attr.type === "currency") return "Number, e.g. 150000 (no currency symbol)";
    if (attr.type === "date") return "Date, e.g. 2026-01-31";
    if (attr.type === "ref") return "Organisation name, exactly as it appears in the graph";
    return "Free text";
  };
  const downloadOmCsvTemplate = () => {
    const attrs = schemaAttributes[omSelectedType] || [];
    const headers = ["ID", "Name", ...attrs.map((a) => humanizeLabel(a.name))];
    const hintRow = ["", "(leave this row's Name blank — it's a guide, and rows with no Name are skipped on import)", ...attrs.map(omCsvColumnHint)];
    const csv = [headers, hintRow].map((row) => row.map(csvEscape).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${omSelectedType.toLowerCase()}-import-template.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  // Bulk-loads a CSV exported from here (or hand-built to match its headers)
  // back into the graph for whichever type is currently selected. A row
  // whose "ID" column matches an instance already loaded in omInstances gets
  // updated in place; everything else is created fresh. Field-level problems
  // (an enum value that isn't a real option, a non-numeric number) drop just
  // that field rather than the whole row — real-world CSVs are messy, and a
  // row missing one field is still worth importing with the rest intact.
  // Only a missing Name skips the row entirely, since Name is required.
  const importOmInstancesFromCSV = (file) => {
    if (!file) return;
    setOmImportBusy(true);
    setOmStatus("Reading file…");
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const table = parseCSV(String(reader.result));
        if (table.length < 2) { setOmStatus("CSV has no data rows."); setOmImportBusy(false); return; }
        const [headerRow, ...dataRows] = table;
        const attrs = schemaAttributes[omSelectedType] || [];
        const headerMap = headerRow.map((h) => {
          const key = h.trim().toLowerCase();
          if (key === "id") return { kind: "id" };
          if (key === "name") return { kind: "name" };
          const attr = attrs.find((a) => humanizeLabel(a.name).toLowerCase() === key || a.name.toLowerCase() === key);
          return attr ? { kind: "attr", attr } : null; // unrecognized column — ignored, not an error
        });

        const existingIds = new Set(omInstances.map((inst) => inst.id));
        const toCreate = [], toUpdate = [], warnings = [];
        let skippedCount = 0;

        dataRows.forEach((cells, rowIdx) => {
          if (cells.every((c) => !c || !c.trim())) return; // blank line
          const props = {};
          let id = null, name = null;
          headerMap.forEach((mapped, colIdx) => {
            if (!mapped) return;
            const raw = (cells[colIdx] ?? "").trim();
            if (mapped.kind === "id") { id = raw || null; return; }
            if (mapped.kind === "name") { name = raw; return; }
            if (!raw) return; // blank cell — leave that attribute unset, not an error
            const { attr } = mapped;
            const key = toSnakeCase(attr.name);
            if (attr.type === "number" || attr.type === "currency") {
              const n = Number(raw.replace(/[^0-9.\-]/g, ""));
              if (Number.isNaN(n)) { warnings.push(`Row ${rowIdx + 2}: "${raw}" isn't a number for ${attr.name} — left blank.`); return; }
              props[key] = n;
            } else if (attr.type === "enum") {
              const match = (attr.options || []).find((o) => o.toLowerCase() === raw.toLowerCase());
              if (!match) { warnings.push(`Row ${rowIdx + 2}: "${raw}" isn't a valid ${attr.name} option — left blank.`); return; }
              props[key] = match;
            } else if (attr.type === "multi_enum") {
              const vals = raw.split(";").map((v) => v.trim()).filter(Boolean);
              const matched = vals.map((v) => (attr.options || []).find((o) => o.toLowerCase() === v.toLowerCase())).filter(Boolean);
              if (matched.length !== vals.length) warnings.push(`Row ${rowIdx + 2}: one or more ${attr.name} values weren't valid options — those were dropped.`);
              if (matched.length) props[key] = matched;
            } else if (attr.type === "ref") {
              // The edit form stores the target's id, not its name, so a CSV
              // (where nobody knows the id) needs the same name → id lookup
              // the dropdown does, or every imported ref would silently be
              // an unresolvable id-shaped string instead of a working link.
              const match = organisationOptions.find((o) => o.name.toLowerCase() === raw.toLowerCase());
              if (!match) { warnings.push(`Row ${rowIdx + 2}: no Organisation named "${raw}" for ${attr.name} — left blank.`); return; }
              props[key] = match.id;
            } else {
              props[key] = raw; // string / date — same as the rest of the app, no format validation
            }
          });
          if (!name) { warnings.push(`Row ${rowIdx + 2}: missing Name — row skipped.`); skippedCount++; return; }
          if (id && existingIds.has(id)) toUpdate.push({ id, name, ...props });
          else toCreate.push({ id: newCanvasId("import"), name, ...props });
        });

        const apiUrl = deriveQueryApiUrl(uri, dbName);
        const authHeader = "Basic " + btoa(`${username}:${password}`);
        if (toCreate.length) {
          await runCypher(apiUrl, authHeader,
            `UNWIND $rows AS row CREATE (n:Instance:${omSelectedType}) SET n = row`,
            { rows: toCreate }
          );
        }
        if (toUpdate.length) {
          // Same "any edit clears verification" rule as omSaveInstance —
          // a CSV re-import overwriting a record's fields is an edit too.
          await runCypher(apiUrl, authHeader,
            `UNWIND $rows AS row MATCH (n:Instance:${omSelectedType} {id: row.id}) SET n += row, n.verified_at = null`,
            { rows: toUpdate }
          );
        }

        if (toCreate.length || toUpdate.length) {
          await logAudit({
            action: "imported", entityType: omSelectedType, entityName: `CSV import — ${omSelectedType}`,
            summary: `${toCreate.length} created, ${toUpdate.length} updated` + (skippedCount > 0 ? `, ${skippedCount} skipped` : ""),
          });
        }
        if (warnings.length) console.warn(`[CSV import — ${omSelectedType}]`, warnings.join("\n"));
        setOmStatus(
          `Imported: ${toCreate.length} created, ${toUpdate.length} updated` +
          (skippedCount > 0 ? `, ${skippedCount} row${skippedCount === 1 ? "" : "s"} skipped (see console)` : "") + "."
        );
        loadOmInstances(omSelectedType);
        handleRefresh();
      } catch (e) {
        setOmStatus(`Import failed: ${e.message}`);
      } finally {
        setOmImportBusy(false);
      }
    };
    reader.readAsText(file);
  };

  const saveBrand = (next) => {
    const merged = { ...brand, ...next };
    setBrand(merged);
    localStorage.setItem("bdcore_brand", JSON.stringify(merged));
  };
  const resetBrand = () => { setBrand(DEFAULT_BRAND); localStorage.removeItem("bdcore_brand"); };

  const handleConnect = () => {
    if (!uri || !password) { setErrorMsg("Enter your Aura connection URI and password."); setStatus("error"); return; }
    localStorage.setItem("bdcore_neo4j_uri", uri);
    localStorage.setItem("bdcore_neo4j_username", username);
    localStorage.setItem("bdcore_neo4j_password", password);
    localStorage.setItem("bdcore_neo4j_dbname", dbName);
    fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
  };
  const handleRefresh = () => fetchData(deriveQueryApiUrl(uri, dbName), "Basic " + btoa(`${username}:${password}`));
  const forgetSavedLogin = () => {
    localStorage.removeItem("bdcore_neo4j_uri");
    localStorage.removeItem("bdcore_neo4j_username");
    localStorage.removeItem("bdcore_neo4j_password");
    localStorage.removeItem("bdcore_neo4j_dbname");
    setUri(""); setUsername("neo4j"); setPassword(""); setDbName("neo4j");
  };

  const appsWithDisposition = useMemo(
    () => apps.map((a) => ({ ...a, disposition: computeDisposition(a) })),
    [apps]
  );

  const allStatuses = useMemo(() => [...new Set(apps.map((a) => a.status))], [apps]);
  const allCriticalities = useMemo(() => [...new Set(apps.map((a) => a.criticality))], [apps]);
  const allDispositions = Object.keys(DISPOSITION_INFO);
  const allHostings = useMemo(() => [...new Set(apps.map((a) => a.hosting).filter(Boolean))], [apps]);

  const filteredApps = useMemo(() => appsWithDisposition.filter((a) => {
    if (statusFilter.size && !statusFilter.has(a.status)) return false;
    if (criticalityFilter.size && !criticalityFilter.has(a.criticality)) return false;
    if (dispositionFilter.size && !dispositionFilter.has(a.disposition.code)) return false;
    if (hostingFilter.size && !hostingFilter.has(a.hosting)) return false;
    if (search && !`${a.name} ${a.vendor}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [appsWithDisposition, statusFilter, criticalityFilter, dispositionFilter, hostingFilter, search]);

  // Sorting is layered on top of the existing filter pipeline rather than baked
  // into filteredApps itself — KPIs/CSV export/chip counts don't care about row
  // order, only the table display does.
  const [portfolioSortKey, setPortfolioSortKey] = useState("name");
  const [portfolioSortDir, setPortfolioSortDir] = useState("asc");
  const [appsViewMode, setAppsViewMode] = useState("cards");
  // Every Portfolio Overview section starts open — collapsing is purely a
  // scroll-management convenience, never a way to hide something by default.
  const [portfolioOpenSections, setPortfolioOpenSections] = useState({ inventory: true, chart: true, disposition: true, capability: true });
  const togglePortfolioSection = (key) => setPortfolioOpenSections((prev) => ({ ...prev, [key]: !prev[key] }));
  const SectionChevron = ({ sectionKey }) => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
      style={{ flexShrink: 0, color: COLORS.inkSecondary, transition: "transform 0.2s ease",
        transform: portfolioOpenSections[sectionKey] ? "rotate(0deg)" : "rotate(-90deg)" }}>
      <polyline points="6,9 12,15 18,9" />
    </svg>
  );
  // Computed once per filtered app (not per render of each card/row, and
  // before sorting so a sort-by-blast-radius can read from it) — every
  // Blast Radius gauge on the Inventory reads from this instead of each
  // calling computeBlastRadius itself, which walks the dependency graph.
  const blastRadiusByAppId = useMemo(() => {
    const map = {};
    filteredApps.forEach((a) => {
      map[a.id] = computeBlastRadius(a, apps, depLinks, depNodes, processes, orgsByProcess, controls, flowRows);
    });
    return map;
  }, [filteredApps, apps, depLinks, depNodes, processes, orgsByProcess, controls, flowRows]);

  const PORTFOLIO_SORT_VALUE = {
    name: (a) => a.name, vendor: (a) => a.vendor || "", status: (a) => a.status,
    hosting: (a) => a.hosting, criticality: (a) => CRIT_WEIGHT_BR[a.criticality] || 0,
    disposition: (a) => a.disposition.code, tco: (a) => a.tco || 0, risk: (a) => a.risks.length,
    blastRadius: (a) => (blastRadiusByAppId[a.id] || {}).score || 0,
  };
  const togglePortfolioSort = (key) => {
    if (portfolioSortKey === key) setPortfolioSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setPortfolioSortKey(key); setPortfolioSortDir(key === "tco" || key === "risk" || key === "criticality" || key === "blastRadius" ? "desc" : "asc"); }
  };
  const sortedFilteredApps = useMemo(() => {
    const getValue = PORTFOLIO_SORT_VALUE[portfolioSortKey];
    if (!getValue) return filteredApps;
    return [...filteredApps].sort((a, b) => {
      const av = getValue(a), bv = getValue(b);
      const cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv));
      return portfolioSortDir === "asc" ? cmp : -cmp;
    });
  }, [filteredApps, portfolioSortKey, portfolioSortDir]);

  const kpis = useMemo(() => ({
    total: filteredApps.length,
    production: filteredApps.filter((a) => a.status === "Production").length,
    atRisk: filteredApps.filter((a) => a.risks && a.risks.length > 0).length,
    totalTco: filteredApps.reduce((sum, a) => sum + (a.tco || 0), 0),
  }), [filteredApps]);

  const dispositionCounts = useMemo(() => {
    const counts = Object.fromEntries(allDispositions.map((d) => [d, 0]));
    appsWithDisposition.forEach((a) => { counts[a.disposition.code] = (counts[a.disposition.code] || 0) + 1; });
    return counts;
  }, [appsWithDisposition]);

  // Portfolio Health: data completeness across the FULL repository, not the
  // current filter selection — data quality is a property of the whole
  // dataset, not whatever subset happens to be filtered in right now.
  const healthStats = useMemo(() => {
    const total = apps.length;
    const withOwner = apps.filter((a) => a.owner).length;
    const withVendor = apps.filter((a) => a.vendor && a.vendor !== "Undisclosed").length;
    const gaps = apps
      .map((a) => {
        const missing = [];
        if (!a.owner) missing.push("No Owner Defined");
        if (!a.vendor || a.vendor === "Undisclosed") missing.push("Vendor Unconfirmed");
        return { app: a, missing };
      })
      .filter((g) => g.missing.length > 0)
      .sort((a, b) => b.missing.length - a.missing.length);
    const completenessScore = total ? Math.round(((withOwner + withVendor) / (total * 2)) * 100) : 0;
    return { total, withOwner, withVendor, completenessScore, gaps };
  }, [apps]);

  const pathfinderApps = useMemo(() => {
    return appsWithDisposition
      .map((a) => ({ ...a, aiQuadrant: aiPathfinderQuadrant(a) }))
      .filter((a) => a.aiQuadrant);
  }, [appsWithDisposition]);
  const pathfinderTopPick = useMemo(
    () => pathfinderApps.find((a) => a.aiQuadrant === "Accelerate"),
    [pathfinderApps]
  );

  // Redundancy: group apps by (capability, functional category) — more than
  // one app in the same group is a genuine overlap candidate, not just two
  // apps that happen to touch the same capability for different reasons.
  const redundancyGroups = useMemo(() => {
    const groups = {};
    apps.forEach((a) => {
      (a.capabilities || []).forEach((cap) => {
        const key = `${cap}::${a.category}`;
        (groups[key] = groups[key] || []).push(a);
      });
    });
    return Object.entries(groups)
      .filter(([, list]) => list.length > 1)
      .map(([key, list]) => {
        const [capability, category] = key.split("::");
        return { capability, category, apps: list };
      });
  }, [apps]);

  const scoredAppsForAITime = useMemo(() => {
    return appsWithDisposition.map((a) => {
      const scores = computeAITime(a);
      return { ...a, ...scores, aiQuadrant: aiTimeQuadrant(scores) };
    });
  }, [appsWithDisposition]);

  const AT_RISK_LIFECYCLES = new Set(["Approaching EOL", "EOL", "Unsupported"]);
  const LIFECYCLE_SEVERITY = { "EOL": 3, "Unsupported": 3, "Approaching EOL": 2, "Current": 0 };
  const atRiskTech = useMemo(() => {
    return depNodes
      .filter((n) => (n.type === "SoftwareTechnology" || n.type === "HardwareTechnology") && AT_RISK_LIFECYCLES.has(n.lifecycle))
      .map((n) => {
        const exposedIds = computeReachable(n.id, depLinks, "downstream");
        const exposedApps = [...exposedIds]
          .map((id) => depNodes.find((x) => x.id === id))
          .filter((x) => x && x.type === "Application")
          .map((x) => {
            const full = apps.find((a) => a.id === x.id);
            return full || { id: x.id, name: x.name, tco: null };
          });
        const tcoAtRisk = exposedApps.reduce((sum, a) => sum + (a.tco || 0), 0);
        return { ...n, exposedApps, tcoAtRisk };
      })
      .sort((a, b) => (LIFECYCLE_SEVERITY[b.lifecycle] || 0) - (LIFECYCLE_SEVERITY[a.lifecycle] || 0));
  }, [depNodes, depLinks, apps]);

  const totalAppsExposed = useMemo(() => {
    const ids = new Set();
    atRiskTech.forEach((t) => t.exposedApps.forEach((a) => ids.add(a.id)));
    return ids.size;
  }, [atRiskTech]);
  const totalTcoExposed = useMemo(() => {
    const ids = new Set();
    let sum = 0;
    atRiskTech.forEach((t) => t.exposedApps.forEach((a) => {
      if (!ids.has(a.id)) { ids.add(a.id); sum += a.tco || 0; }
    }));
    return sum;
  }, [atRiskTech]);

  // Cloud migration: illustrative rule-of-thumb multipliers per 6R disposition,
  // not a costed business case. Wave 1 (foundation) and wave 2 (dependent apps)
  // reuse atRiskTech directly rather than recomputing the dependency chain.
  const CLOUD_COST_MULTIPLIER = { Retain: 1, Rehost: 0.85, Replatform: 0.75, Replace: 0.65, Retire: 0, Refactor: 0.8 };
  const migrationWaves = useMemo(() => {
    const foundation = atRiskTech; // wave 1: on-prem infra flagged at-risk
    const dependentIds = new Set();
    foundation.forEach((t) => t.exposedApps.forEach((a) => dependentIds.add(a.id)));
    const dependentApps = appsWithDisposition.filter((a) => dependentIds.has(a.id));
    const standaloneApps = appsWithDisposition.filter((a) => a.hosting === "On-Prem" && !dependentIds.has(a.id));
    const withCloudCost = (a) => {
      const mult = CLOUD_COST_MULTIPLIER[a.disposition.code] ?? 0.8;
      const cloudTco = Math.round((a.tco || 0) * mult);
      return { ...a, cloudTco, savings: (a.tco || 0) - cloudTco };
    };
    return {
      foundation,
      dependentApps: dependentApps.map(withCloudCost),
      standaloneApps: standaloneApps.map(withCloudCost),
    };
  }, [atRiskTech, appsWithDisposition]);
  const totalMigrationSavings = useMemo(() => {
    return [...migrationWaves.dependentApps, ...migrationWaves.standaloneApps].reduce((s, a) => s + a.savings, 0);
  }, [migrationWaves]);

  const rankedBlockedDecisions = useMemo(() =>
    [...blockedDecisions].sort((a, b) => (b.cost || 0) - (a.cost || 0)),
    [blockedDecisions]);
  const blockingAppIds = useMemo(() => new Set(blockedDecisions.map((d) => d.appId)), [blockedDecisions]);
  // The actual payoff of this framework: which systems look bad on age/health
  // (6R says replace/replatform/retire) but, once you check, block nothing at all.
  const ageFlaggedNotBlocking = useMemo(() =>
    appsWithDisposition.filter((a) =>
      ["Replace", "Replatform", "Retire"].includes(a.disposition.code) && !blockingAppIds.has(a.id)
    ),
    [appsWithDisposition, blockingAppIds]);

  // Executive Brief: nothing computed here is new reasoning — it's the same
  // numbers already sitting in five separate tabs, added up and reframed as
  // cost/risk instead of as analytical technique, so it hits on login instead
  // of requiring five clicks to assemble by hand.
  const totalBlockedCost = useMemo(() =>
    rankedBlockedDecisions.reduce((s, d) => s + (d.cost || 0), 0),
    [rankedBlockedDecisions]);
  const redundancyWaste = useMemo(() =>
    redundancyGroups.reduce((sum, g) => {
      const retiring = g.apps.find((a) => a.status === "Retiring");
      const wasteApp = retiring || [...g.apps].sort((a, b) => (a.businessValue || 0) - (b.businessValue || 0))[0];
      return sum + (wasteApp ? (wasteApp.tco || 0) : 0);
    }, 0),
    [redundancyGroups]);
  const criticalNoDR = useMemo(() =>
    appsWithDisposition
      .filter((a) => a.criticality === "Critical")
      .map((a) => ({ app: a, dr: computeDRReadiness(a, controls, depLinks) }))
      .filter((x) => !x.dr.covered),
    [appsWithDisposition, controls, depLinks]);
  const totalAtStake = totalBlockedCost + redundancyWaste + totalTcoExposed;

  // ValueSnapshot lives outside the governed ontology — a system/telemetry
  // record, same idea as Workspace/Canvas nodes, not a business concept
  // someone would model on the canvas. Each snapshot is a real, timestamped
  // read of numbers already computed elsewhere in this file (redundancy
  // waste, blocked-decision cost, EOL exposure, DR gaps) plus ownership and
  // verification coverage across the whole graph — nothing here is a new
  // metric invented for this view, which is the whole point: a trend line
  // is only defensible if every point on it is a real historical fact, not
  // freshly-computed spin.
  const loadValueSnapshots = async () => {
    setValueSnapshotsLoading(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const rows = await runCypher(apiUrl, authHeader,
        `MATCH (v:ValueSnapshot) RETURN properties(v) AS props ORDER BY v.timestamp`
      );
      setValueSnapshots(rows.map((r) => r.props));
      setValueSnapshotsError("");
    } catch (e) {
      setValueSnapshotsError(`Couldn't load value snapshots: ${e.message}`);
      setValueSnapshots([]);
    } finally {
      setValueSnapshotsLoading(false);
    }
  };

  const recordValueSnapshotNow = async () => {
    setValueSnapshotBusy(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const coverageRows = await runCypher(apiUrl, authHeader,
        `MATCH (n:Instance) RETURN n.owner AS owner, n.verified_at AS verifiedAt`
      );
      const total = coverageRows.length || 1;
      const ownershipCoveragePct = Math.round((coverageRows.filter((r) => r.owner && String(r.owner).trim()).length / total) * 100);
      const verificationCoveragePct = Math.round((coverageRows.filter((r) => r.verifiedAt).length / total) * 100);
      const id = newCanvasId("vsnap");
      const now = new Date().toISOString();
      await runCypher(apiUrl, authHeader,
        `CREATE (v:ValueSnapshot {id: $id, timestamp: $now, redundancyWasteGBP: $redundancyWasteGBP,
          blockedDecisionCostGBP: $blockedDecisionCostGBP, eolExposureGBP: $eolExposureGBP,
          drGapCount: $drGapCount, appCount: $appCount, ownershipCoveragePct: $ownershipCoveragePct,
          verificationCoveragePct: $verificationCoveragePct})`,
        {
          id, now,
          redundancyWasteGBP: Math.round(redundancyWaste), blockedDecisionCostGBP: Math.round(totalBlockedCost),
          eolExposureGBP: Math.round(totalTcoExposed), drGapCount: criticalNoDR.length, appCount: apps.length,
          ownershipCoveragePct, verificationCoveragePct,
        }
      );
      await loadValueSnapshots();
    } catch (e) {
      setValueSnapshotsError(`Couldn't record a snapshot: ${e.message}`);
    } finally {
      setValueSnapshotBusy(false);
    }
  };

  // Runs once per session, after real data has actually loaded — capped to
  // one automatic snapshot per calendar day so simply opening the app
  // several times a day can't inflate the trend with duplicate points.
  // Someone can still add more via "Record Snapshot Now" on the view
  // itself; that's a deliberate human action, not automatic noise, so it
  // isn't capped the same way.
  const maybeRecordValueSnapshot = async () => {
    if (snapshotCheckedThisSession) return;
    setSnapshotCheckedThisSession(true);
    try {
      const apiUrl = deriveQueryApiUrl(uri, dbName);
      const authHeader = "Basic " + btoa(`${username}:${password}`);
      const latestRows = await runCypher(apiUrl, authHeader,
        `MATCH (v:ValueSnapshot) RETURN v.timestamp AS timestamp ORDER BY v.timestamp DESC LIMIT 1`
      );
      const today = new Date().toISOString().slice(0, 10);
      const latestDate = latestRows[0] && latestRows[0].timestamp ? String(latestRows[0].timestamp).slice(0, 10) : null;
      if (latestDate === today) return;
      await recordValueSnapshotNow();
    } catch (e) {
      // Background/best-effort — a failure here shouldn't disrupt the rest
      // of the app, so it's swallowed rather than surfaced as an error.
    }
  };

  // Field-distribution reviews: same generic pattern (count the distribution,
  // flag values that look inconsistent with a correlated field), applied to
  // three different fields with three different, explainable consistency rules
  // — one reusable capability, not three bespoke ones.
  const SERVICE_TIER_EXPECTED = { Critical: "Platinum", High: "Gold", Medium: "Silver", Low: "Bronze" };
  const fieldReviews = useMemo(() => {
    const serviceLevel = { dist: {}, flagged: [] };
    const criticality = { dist: {}, flagged: [] };
    apps.forEach((a) => {
      if (a.serviceLevel) {
        serviceLevel.dist[a.serviceLevel] = (serviceLevel.dist[a.serviceLevel] || 0) + 1;
        const expected = SERVICE_TIER_EXPECTED[a.criticality];
        if (expected && a.serviceLevel !== expected) {
          serviceLevel.flagged.push({ id: a.id, name: a.name, value: a.serviceLevel,
            reason: `Criticality is ${a.criticality} (would suggest ${expected} support), but tagged ${a.serviceLevel}.` });
        }
      }
      if (a.criticality) {
        criticality.dist[a.criticality] = (criticality.dist[a.criticality] || 0) + 1;
        if (a.businessValue === 3 && (a.criticality === "Low" || a.criticality === "Medium")) {
          criticality.flagged.push({ id: a.id, name: a.name, value: a.criticality,
            reason: `Business value is High, but criticality is only ${a.criticality} — worth checking if this is under-rated.` });
        } else if (a.businessValue === 1 && a.criticality === "Critical") {
          criticality.flagged.push({ id: a.id, name: a.name, value: a.criticality,
            reason: `Business value is Low, but criticality is Critical — worth checking if this is over-rated.` });
        }
      }
    });
    const marketDifferentiation = { dist: {}, flagged: [] };
    capCoverage.forEach((c) => {
      if (!c.marketDifferentiation) return;
      marketDifferentiation.dist[c.marketDifferentiation] = (marketDifferentiation.dist[c.marketDifferentiation] || 0) + 1;
      if (c.marketDifferentiation === "High" && !["Critical", "High"].includes(c.importance)) {
        marketDifferentiation.flagged.push({ id: c.capability, name: c.capability, value: c.marketDifferentiation,
          reason: `Tagged as a market differentiator, but organisational importance is only ${c.importance} — is the differentiation claim real?` });
      }
    });
    return { serviceLevel, criticality, marketDifferentiation };
  }, [apps, capCoverage]);

  const capabilityRealization = useMemo(() => {
    return capCoverage.map((c) => {
      const realizingProcs = processes.filter((p) => p.capabilityName === c.capability);
      let health, reason;
      if (realizingProcs.length === 0) {
        health = "Not Realized"; reason = "No process realises this capability.";
      } else if (realizingProcs.every((p) => (p.supportingApps || []).length === 0)) {
        health = "Weakly Realized";
        reason = `Realized by ${realizingProcs.map((p) => p.name).join(", ")}, but no application supports ${realizingProcs.length === 1 ? "it" : "any of them"}.`;
      } else {
        health = "Realized";
        reason = `Realized by ${realizingProcs.map((p) => p.name).join(", ")}.`;
      }
      return { ...c, realizingProcs, health, reason };
    });
  }, [capCoverage, processes]);

  // Action Center: the landing page's "what needs fixing now" feed. Every
  // item here reuses a signal already computed for its own dedicated view
  // (Blocked Decisions, Tech Obsolescence, Redundancy, AI Pathfinder, Field
  // Review, Portfolio Health, Capability Board, Decision Log, Executive
  // Brief) — this is a rollup, not a new analysis engine, so it can never
  // drift out of sync with what those views themselves show.
  const actionItems = useMemo(() => {
    const items = [];

    if (criticalNoDR.length > 0) {
      items.push({
        severity: "critical",
        title: `${criticalNoDR.length} critical application${criticalNoDR.length === 1 ? "" : "s"} with no disaster recovery coverage`,
        description: "A single outage on these becomes a business continuity event — no documented DR plan covers them today.",
        view: "brief",
        entities: criticalNoDR.map((x) => x.app.name),
      });
    }

    const eolTech = atRiskTech.filter((t) => t.lifecycle === "EOL" || t.lifecycle === "Unsupported");
    if (eolTech.length > 0) {
      items.push({
        severity: "critical",
        title: `${eolTech.length} unsupported or end-of-life technolog${eolTech.length === 1 ? "y" : "ies"} still in use`,
        description: `Exposes ${totalAppsExposed} application${totalAppsExposed === 1 ? "" : "s"} (${fmtGBP(totalTcoExposed)} TCO) to unpatched, unsupported infrastructure.`,
        view: "obsolescence",
        entities: eolTech.map((t) => t.name),
      });
    }

    if (rankedBlockedDecisions.length > 0) {
      items.push({
        severity: "high",
        title: `${rankedBlockedDecisions.length} blocked decision${rankedBlockedDecisions.length === 1 ? "" : "s"} costing ${fmtGBP(totalBlockedCost)} in workarounds`,
        description: `Unresolved architecture decisions blocking ${blockingAppIds.size} application${blockingAppIds.size === 1 ? "" : "s"} from moving forward.`,
        view: "blocked",
        entities: rankedBlockedDecisions.map((d) => d.name),
      });
    }

    if (redundancyGroups.length > 0) {
      items.push({
        severity: "high",
        title: `${redundancyGroups.length} redundancy group${redundancyGroups.length === 1 ? "" : "s"} — overlapping systems doing the same job`,
        description: `An estimated ${fmtGBP(redundancyWaste)} in annual TCO sits in the systems that look safe to retire.`,
        view: "redundancy",
        entities: redundancyGroups.flatMap((g) => g.apps.map((a) => a.name)),
      });
    }

    const flaggedFields = [...fieldReviews.serviceLevel.flagged, ...fieldReviews.criticality.flagged, ...fieldReviews.marketDifferentiation.flagged];
    if (flaggedFields.length > 0) {
      items.push({
        severity: "high",
        title: `${flaggedFields.length} field${flaggedFields.length === 1 ? "" : "s"} flagged for inconsistent data`,
        description: "Service level, criticality, or market differentiation tags that don't logically agree with a correlated field.",
        view: "fieldreview",
        entities: flaggedFields.map((f) => f.name),
      });
    }

    const unscoredApps = apps.filter((a) => !pathfinderApps.find((p) => p.id === a.id));
    if (unscoredApps.length > 0) {
      items.push({
        severity: "medium",
        title: `${unscoredApps.length} application${unscoredApps.length === 1 ? "" : "s"} not yet scored for AI readiness`,
        description: "Missing an AI Readiness or AI Relevance rating — excluded from the AI Pathfinder view until set.",
        view: "ai",
        entities: unscoredApps.map((a) => a.name),
      });
    }

    if (healthStats.gaps.length > 0) {
      items.push({
        severity: "medium",
        title: `${healthStats.gaps.length} application${healthStats.gaps.length === 1 ? "" : "s"} missing owner or vendor`,
        description: `Portfolio data completeness is at ${healthStats.completenessScore}% — these records need an owner or vendor confirmed.`,
        view: "health",
        entities: healthStats.gaps.map((g) => g.app.name),
      });
    }

    const weakCapabilities = capabilityRealization.filter((c) => c.health !== "Realized");
    if (weakCapabilities.length > 0) {
      items.push({
        severity: "medium",
        title: `${weakCapabilities.length} capabilit${weakCapabilities.length === 1 ? "y" : "ies"} not realized`,
        description: "No process realizes this capability, or no application supports the process that does.",
        view: "capboard",
        entities: weakCapabilities.map((c) => c.capability),
      });
    }

    const proposedDecisions = decisions.filter((d) => d.status === "Proposed");
    if (proposedDecisions.length > 0) {
      items.push({
        severity: "medium",
        title: `${proposedDecisions.length} decision${proposedDecisions.length === 1 ? "" : "s"} proposed and awaiting resolution`,
        description: "Sitting in Proposed status — approve, reject, or supersede to keep the decision log current.",
        view: "decisionlog",
        entities: proposedDecisions.map((d) => d.name),
      });
    }

    const severityRank = { critical: 0, high: 1, medium: 2 };
    return items.sort((a, b) => severityRank[a.severity] - severityRank[b.severity]);
  }, [criticalNoDR, atRiskTech, totalAppsExposed, totalTcoExposed, rankedBlockedDecisions, totalBlockedCost, blockingAppIds,
      redundancyGroups, redundancyWaste, fieldReviews, apps, pathfinderApps, healthStats, capabilityRealization, decisions]);

  const radarData = useMemo(() => {
    const softwareTechs = technologies.filter((t) => t.type === "SoftwareTechnology");
    const categories = [...new Set(softwareTechs.map((t) => t.techCategory))];
    const segAngle = categories.length ? (2 * Math.PI) / categories.length : 0;
    const cx = 260, cy = 240;
    const items = softwareTechs.map((t) => {
      const catIdx = Math.max(0, categories.indexOf(t.techCategory));
      const ring = RADAR_RING_ORDER.includes(t.strategicClassification) ? t.strategicClassification : "Contained";
      const baseAngle = catIdx * segAngle + segAngle / 2 - Math.PI / 2;
      const jitter = ((t.id.charCodeAt(t.id.length - 1) % 10) - 5) * (segAngle / 14);
      const angle = baseAngle + jitter;
      const radiusJitter = ((t.id.length * 7) % 24) - 12;
      const r = RADAR_BAND_RADII[ring] + radiusJitter;
      return { ...t, ring, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    });
    return { categories, items, segAngle, cx, cy };
  }, [technologies]);

  const selectSingleFilter = (setter, current, value) => {
    setter(!value || (current.has(value) && current.size === 1) ? new Set() : new Set([value]));
  };

  const exportAppsToCSV = () => {
    const cols = ["Application", "Vendor", "Status", "Hosting", "Criticality", "Disposition", "Est. Annual TCO", "Risk"];
    const escapeCsv = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = filteredApps.map((a) => [
      a.name, a.vendor, a.status, a.hosting, a.criticality, a.disposition.code, a.tco ?? "", a.risks ? a.risks.length : 0,
    ].map(escapeCsv).join(","));
    const csv = [cols.map(escapeCsv).join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `portfolio-overview-${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const exportAuditLogToCSV = () => {
    const cols = ["Timestamp", "Actor", "Action", "Entity Type", "Entity", "Details"];
    const escapeCsv = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = auditLog.map((e) => [
      new Date(e.timestamp).toLocaleString(), e.actor, e.action, e.entityType, e.entityName, e.summary,
    ].map(escapeCsv).join(","));
    const csv = [cols.map(escapeCsv).join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `audit-log-${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  // --- Dependency graph derived data ---
  const spofIds = useMemo(() => {
    const inDegree = {};
    depLinks.forEach((l) => {
      if (DEPENDENCY_TYPES.has(l.relType)) inDegree[l.targetId] = (inDegree[l.targetId] || 0) + 1;
    });
    return new Set(Object.entries(inDegree).filter(([, n]) => n >= 2).map(([id]) => id));
  }, [depLinks]);

  const graphW = 700, graphH = 460;
  const positions = useMemo(
    () => (depNodes.length ? layoutGraph(depNodes, depLinks, graphW, graphH) : {}),
    [depNodes, depLinks]
  );

  const downstream = selectedNode ? computeReachable(selectedNode, depLinks, "downstream") : new Set();
  const upstream = selectedNode ? computeReachable(selectedNode, depLinks, "upstream") : new Set();
