     forecast_cost: 18000, description: "Wanted to pilot AI-assisted triage of incoming welfare grant applications; nobody could extract clean, structured case data out of the system fast enough, so the pilot never left the lab."}
  - {id: i7, concept_type: Initiative, name: "[FICTIONAL] Real-Time Poppy Appeal Campaign Dashboard", status: Shelved,
