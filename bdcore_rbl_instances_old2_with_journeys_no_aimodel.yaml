  - {id: d2, concept_type: Decision, name: "Modernise legacy SQL Server infrastructure via managed service",
     status: Approved, type: Architecture, decision_maker: "Executive Director: Digital, Data & Technology",
     rationale: "Legacy SQL infrastructure was complex, outdated, and relied on a single point of failure"}

  # --- INITIATIVE ---
