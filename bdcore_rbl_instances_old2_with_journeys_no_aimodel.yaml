# BDCore INSTANCE LAYER — The Royal British Legion (RBL)
#
# Grounded in public sources: RBL's "Our Strategy to 2035" (Connect / Remember /
# Support pillars), their Digital, Data & Technology (DDaT) directorate and CIO
# function, a live CRM modernisation programme (legacy CRM -> Microsoft Dynamics
# 365), a Euler/Talend-based enterprise data integration programme aimed at a
# "single trusted supporter view", their departmental structure (Services dept
# ~400 staff, Fundraising Marketing & Remembrance, Poppyscotland), their
# public-facing services (Poppy Appeal, welfare grants, National Memorial
# Arboretum / National Remembrance Gardens, membership), a confirmed employee
# benefits platform (Reward Gateway, live since Sept 2020), a confirmed
# "central database managed by Legion staff" for membership records, and a
# real legacy SQL Server infrastructure modernisation delivered with Phoenix
# Software and Simpson Associates.
#
# v2 note: v1 of this file had 6 applications, all clustered around Fundraising,
# and no Finance or Workforce/HR capability — unrepresentative of a real
# organisation. This version adds Workforce & People Management and Finance &
# Corporate Services capabilities, and spreads applications so every capability
# has at least one connected system.
#
# Where a real detail wasn't publicly available (e.g. exact budget figures,
# named vendors for case management/finance systems, internal risk register
# wording), values are realistic illustrative estimates — flagged inline with
# "# illustrative". Treat this as a plausible demo dataset, not verified
# internal RBL data.

nodes:

