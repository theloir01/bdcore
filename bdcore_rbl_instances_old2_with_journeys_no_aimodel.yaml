     # REAL: delivered as a managed service with Phoenix Software and Simpson Associates,
     # replacing a legacy SQL infrastructure with a single point of failure.

  # --- FICTIONAL — blocked-decisions register ---
  # Everything below is an invented example, not a real RBL initiative. It exists to
  # test whether the ontology can capture "what decision did this system block" —
  # the LinkedIn framework this was built to check the tool against — not to make
  # any factual claim about RBL. Do not present these as real to anyone.
  - {id: i4, concept_type: Initiative, name: "[FICTIONAL] Tiered Membership Pricing Change", status: Shelved,
     type: Commercial, sponsor: "Head of Membership", start_date: "2025-11-01", target_date: "2026-01-15",
     forecast_cost: 35000, description: "Wanted to offer tiered membership pricing; the membership database's flat record structure couldn't express tiers without a costly rebuild, so it was shelved."}
  - {id: i5, concept_type: Initiative, name: "[FICTIONAL] Corporate Partner Revenue-Share Integration", status: Shelved,
     type: Commercial, sponsor: "Head of Corporate Partnerships", start_date: "2025-06-01", target_date: "2025-09-01",
     forecast_cost: 52000, description: "A corporate partner wanted automated revenue-share reporting; the finance system's data model had no concept of a shared transaction, so the deal proceeded on manual monthly reconciliation instead."}
  - {id: i6, concept_type: Initiative, name: "[FICTIONAL] AI-Assisted Grant Triage Pilot", status: Shelved,
